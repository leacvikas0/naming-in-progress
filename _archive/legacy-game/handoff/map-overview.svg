<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" role="img" aria-labelledby="title desc">
  <title id="title">Sunpetal Vale map plan</title>
  <desc id="desc">A 96 metre square playable woodland valley with an open central meadow, northern shrine, western lake outside the playable boundary, eastern camp and a broad connecting loop. This is a layout reference, not a rendered game screenshot.</desc>
