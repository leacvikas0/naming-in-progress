    <pattern id="woods" width="54" height="48" patternUnits="userSpaceOnUse">
      <rect width="54" height="48" fill="#527f62"/>
      <circle cx="12" cy="13" r="14" fill="#759e69"/>
      <circle cx="42" cy="35" r="17" fill="#83ab74"/>
    </pattern>
  </defs>
  <rect width="960" height="850" fill="#f7f4e9"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#283f38">
