<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REF B port — botanical asset sheet</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* REF B's own scene.background (#6a9c78), painted as CSS so the
           ported ShaderMaterial's raw-sRGB output and the backdrop agree
           exactly (see refb-kit.js colour note). */
        background: #6a9c78;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 10;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(10, 22, 18, 0.74);
        color: #eaf7e0;
        font-size: 11px;
        line-height: 1.5;
        letter-spacing: 0.02em;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(234, 247, 224, 0.16);
        min-width: 210px;
        user-select: none;
        pointer-events: none;
      }
      #hud h1 {
        margin: 0 0 7px;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #fff3d6;
      }
      #hud .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      #hud .row span {
        color: #a9c4b4;
      }
      #hud .row b {
        font-weight: 600;
        color: #d9ea8d;
        font-variant-numeric: tabular-nums;
      }
      #hud .hint {
        margin-top: 7px;
        padding-top: 7px;
        border-top: 1px solid rgba(234, 247, 224, 0.14);
        color: #a9c4b4;
        font-size: 10px;
      }
      #stats {
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 10;
        padding: 9px 12px;
        border-radius: 8px;
        background: rgba(10, 22, 18, 0.74);
        color: #eaf7e0;
        font-size: 10px;
        line-height: 1.45;
        letter-spacing: 0.015em;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(234, 247, 224, 0.16);
        min-width: 224px;
        max-height: calc(100vh - 28px);
        overflow: auto;
        user-select: none;
        pointer-events: none;
      }
      #stats h2 {
        margin: 0 0 5px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #fff3d6;
      }
      #stats .fam {
        margin: 7px 0 2px;
        color: #a9c4b4;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 9.5px;
      }
      #stats .row {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        color: #dfeee5;
      }
      #stats .row b {
        font-weight: 600;
        color: #d9ea8d;
        font-variant-numeric: tabular-nums;
      }
      #status {
        position: fixed;
        right: 16px;
        bottom: 14px;
        z-index: 10;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(10, 22, 18, 0.7);
        color: #d9ea8d;
        font-size: 11px;
        letter-spacing: 0.06em;
        user-select: none;
        pointer-events: none;
      }
      #status.err {
        color: #ffb4a8;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <h1>REF B · ported kit</h1>
      <div class="row"><span>assets</span><b id="s-assets">—</b></div>
      <div class="row"><span>triangles</span><b id="s-tris">—</b></div>
      <div class="row"><span>draw calls</span><b id="s-calls">—</b></div>
      <div class="row"><span>fps</span><b id="s-fps">—</b></div>
      <div class="hint">verbatim B material + geometry · trees are new, leaf-only</div>
    </div>
    <div id="stats"><h2>variant / triangles</h2><div id="stats-body"></div></div>
    <div id="status">booting…</div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import {
        REFB_PALETTE,
        REFB_SHARED_UNIFORMS,
        createGhibliBotanicalMaterial,
        createColoredGeometry,
        createPRNG,
        fbm2D,
        createMeadowGrassTuftGeometry,
        createHeroBellflowerClumpGeometry,
        createSingleBellflowerStalkGeometry,
        createSecondaryVioletSprigGeometry,
        createChamomileDaisyClusterGeometry,
        createFacetedMeadowRockGeometry,
        createTreeCanopyGeometry,
        createTreeTrunkGeometry,
      } from "/game/src/map/port/refb-kit.js";

      const statusEl = document.getElementById("status");
      const fail = (msg) => {
        statusEl.textContent = msg;
        statusEl.classList.add("err");
        console.error(msg);
      };
      window.addEventListener("error", (e) => fail("error: " + e.message));

      /* ---------------------------------------------------------------- */
      /* Renderer / scene / camera                                        */
      /* ---------------------------------------------------------------- */

      const params = new URLSearchParams(location.search);
      // The static server 301s `.html?query` -> extensionless and drops the
      // query, so also accept a `#key=value&...` hash for reproducible shots.
      if (location.hash.length > 1) {
        for (const [k, v] of new URLSearchParams(location.hash.slice(1))) params.set(k, v);
      }
      const freeze = params.get("freeze") === "1";
      const fixedTime = params.has("t") ? parseFloat(params.get("t")) : 0.6;
      const useFog = params.get("fog") === "1";

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      // REF B renders straight to the canvas with no tone mapping and no post.
      // Its custom material writes raw (r128) values; keep tone mapping off so
      // nothing is re-graded on the way out.
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.setClearColor(0x000000, 0);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 160);
      camera.position.set(0, 9.8, 15.2);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.9, -1.2);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI * 0.495;
      controls.minDistance = 3;
      controls.maxDistance = 60;

      // Optional reproducible camera override for screenshots:
      //   ?cam=0,8.6,14.6&look=0,1.5,-1.8
      const numList = (s) => s.split(",").map(Number);
      if (params.has("cam")) camera.position.fromArray(numList(params.get("cam")));
      if (params.has("look")) controls.target.fromArray(numList(params.get("look")));
      controls.update();

      /* ---------------------------------------------------------------- */
      /* Materials — the four B materials, unchanged                      */
      /* ---------------------------------------------------------------- */

      // `?fog=1` (or `#fog=1`) turns on the optional scene-fog path so the
      // additive fog support can be eyeballed; default is off = reference.
      const fogOpt = useFog ? { fog: true } : {};
      const matTerrain = createGhibliBotanicalMaterial({ isTerrain: true, swayScale: 0.0, ...fogOpt });
      const matGrass = createGhibliBotanicalMaterial({ isFoliage: true, isPetal: false, swayScale: 1.0, ...fogOpt });
      const matFlower = createGhibliBotanicalMaterial({ isFoliage: true, isPetal: true, swayScale: 1.0, ...fogOpt });
      const matRock = createGhibliBotanicalMaterial({ isRock: true, swayScale: 0.0, ...fogOpt });

      if (useFog) {
        // A real scene fog, as game/src/map/index.js will have.
        scene.fog = new THREE.Fog(0xd6ecea, 16, 46);
      }

      /* ---------------------------------------------------------------- */
      /* Ground — B's terrain two-tone bake, flat                          */
      /* ---------------------------------------------------------------- */

      function createGroundGeometry(size = 72, seg = 72) {
        const positions = [];
        const sun = [];
        const shd = [];
        const wind = [];
        const idx = [];
        for (let iz = 0; iz <= seg; iz++) {
          const z = (iz / seg - 0.5) * size;
          for (let ix = 0; ix <= seg; ix++) {
            const x = (ix / seg - 0.5) * size;
            positions.push(x, 0, z);
            // B's exact per-vertex bake (buildValleyScene terrain loop)
            const n = fbm2D(x * 0.45, z * 0.45);
            const sunC = REFB_PALETTE.grassSunMid.clone().lerp(REFB_PALETTE.grassSunBright, n * 0.72);
            const shdC = REFB_PALETTE.grassShadeDeep.clone().lerp(REFB_PALETTE.grassShadeMid, n * 0.65);
            sun.push(sunC.r, sunC.g, sunC.b);
            shd.push(shdC.r, shdC.g, shdC.b);
            wind.push(0.0);
          }
        }
        for (let iz = 0; iz < seg; iz++) {
          for (let ix = 0; ix < seg; ix++) {
            const a = iz * (seg + 1) + ix;
            const b = a + 1;
            const c = a + (seg + 1);
            const d = c + 1;
            idx.push(a, c, b, b, c, d);
          }
        }
        return createColoredGeometry(positions, idx, sun, shd, wind, false);
      }

      const ground = new THREE.Mesh(createGroundGeometry(), matTerrain);
      ground.name = "RefBTerrain";
      scene.add(ground);

      /* ---------------------------------------------------------------- */
      /* Asset sheet                                                      */
      /* ---------------------------------------------------------------- */

      const triCount = (g) => (g.index ? g.index.count : g.attributes.position.count) / 3;
      const stats = [];
      const statsBody = document.getElementById("stats-body");

      function addStat(family, variant, label, tris) {
        stats.push({ family, variant, label, tris });
      }

      function place(geometry, material, name, x, z, scale = 1, rotY = 0, y = 0) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.name = name;
        mesh.position.set(x, y, z);
        mesh.rotation.y = rotY;
        mesh.scale.setScalar(scale);
        scene.add(mesh);
        return mesh;
      }

      // --- six asset families, three variants each ----------------------
      // Front-to-back: small assets nearest the camera so every family is
      // readable in one frame; trees sit behind everything.
      const ROWS = [
        { key: "grass", z: 3.8, builder: createMeadowGrassTuftGeometry, material: matGrass, scale: 1.25 },
        { key: "rock", z: 2.4, builder: createFacetedMeadowRockGeometry, material: matRock, scale: 1.0 },
        { key: "daisy", z: 0.9, builder: createChamomileDaisyClusterGeometry, material: matFlower, scale: 1.35 },
        { key: "violet", z: -0.6, builder: createSecondaryVioletSprigGeometry, material: matFlower, scale: 1.15 },
        { key: "stalk", z: -2.1, builder: createSingleBellflowerStalkGeometry, material: matFlower, scale: 1.0 },
        { key: "bellflower", z: -3.6, builder: createHeroBellflowerClumpGeometry, material: matFlower, scale: 1.0 },
      ];
      const COLS = [-3.0, 0, 3.0];

      ROWS.forEach((row) => {
        [0, 1, 2].forEach((variant, col) => {
          const geometry = row.builder(variant);
          const tris = triCount(geometry);
          addStat(row.key, variant, `${row.key}[${variant}]`, tris);
          place(geometry, row.material, `${row.key}-${variant}`, COLS[col], row.z, row.scale, 0.4 + variant * 0.5);
        });
      });

      // --- trees: 4 broadleaf + 1 conifer, trunk + leaf-fan canopy ------
      const TREE_HEIGHTS = [2.6, 2.3, 2.85, 2.1, 1.9];
      const TREE_X = [-8.0, -4.0, 0, 4.0, 8.0];
      const TREE_Z = -7.6;
      // Canopy origin is its bottom; bury the trunk tip inside the leaf skirt.
      const CANOPY_OVERLAP = 0.35;
      for (let variant = 0; variant < 5; variant++) {
        const trunkGeo = createTreeTrunkGeometry(variant);
        const canopyGeo = createTreeCanopyGeometry(variant);
        const trunkTris = triCount(trunkGeo);
        const canopyTris = triCount(canopyGeo);
        addStat("tree", variant, `tree-trunk[${variant}]`, trunkTris);
        addStat("tree", variant, `tree-canopy[${variant}]`, canopyTris);

        const x = TREE_X[variant];
        const trunkH = trunkGeo.userData.height ?? TREE_HEIGHTS[variant];
        place(trunkGeo, matGrass, `tree-trunk-${variant}`, x, TREE_Z, 1, variant * 0.7);
        place(canopyGeo, matGrass, `tree-canopy-${variant}`, x, TREE_Z, 1, variant * 0.7, trunkH - CANOPY_OVERLAP);
      }

      // --- HUD stats ----------------------------------------------------
      const byFamily = new Map();
      for (const s of stats) {
        if (!byFamily.has(s.family)) byFamily.set(s.family, []);
        byFamily.get(s.family).push(s);
      }
      const FAM_LABEL = {
        grass: "meadow grass",
        bellflower: "hero bellflower",
        stalk: "single stalk",
        violet: "violet sprig",
        daisy: "chamomile daisy",
        rock: "faceted rock",
        tree: "trees (new)",
      };
      let totalTris = 0;
      for (const [family, rows] of byFamily) {
        const head = document.createElement("div");
        head.className = "fam";
        head.textContent = FAM_LABEL[family] ?? family;
        statsBody.appendChild(head);
        for (const s of rows) {
          const row = document.createElement("div");
          row.className = "row";
          const name = document.createElement("span");
          name.textContent = s.label.replace(`${family}`, "").replace(/^\[|\]$/g, "") || s.label;
          const tris = document.createElement("b");
          tris.textContent = `${s.tris} tris`;
          row.appendChild(name);
          row.appendChild(tris);
          statsBody.appendChild(row);
          totalTris += s.tris;
        }
      }

      document.getElementById("s-assets").textContent = String(stats.length);
      document.getElementById("s-tris").textContent = totalTris.toLocaleString();

      /* ---------------------------------------------------------------- */
      /* Animation                                                        */
      /* ---------------------------------------------------------------- */

      const clock = new THREE.Clock();
      let frames = 0;
      let fpsT = 0;
      const fpsEl = document.getElementById("s-fps");

      function tick() {
        requestAnimationFrame(tick);
        const dt = clock.getDelta();
        if (freeze) {
          REFB_SHARED_UNIFORMS.uTime.value = fixedTime;
        } else {
          REFB_SHARED_UNIFORMS.uTime.value += dt;
        }
        controls.update();
        renderer.render(scene, camera);

        frames++;
        fpsT += dt;
        if (fpsT > 0.5) {
          fpsEl.textContent = String(Math.round(frames / fpsT));
          frames = 0;
          fpsT = 0;
        }
        document.getElementById("s-calls").textContent = String(renderer.info.render.calls);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Handy for Playwright / the Lead's integration checks.
      window.__portb = {
        stats,
        totalTris,
        REFB_PALETTE,
        REFB_SHARED_UNIFORMS,
        scene,
        camera,
        controls,
        renderer,
      };

      tick();
      statusEl.textContent = `ready · ${stats.length} variants · ${totalTris} tris`;
    </script>
  </body>
</html>
