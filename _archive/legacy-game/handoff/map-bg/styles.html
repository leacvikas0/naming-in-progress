<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sunpetal Vale — style sheet</title>
<style>
  :root {
    --ink: #eef7f1;
    --panel: rgba(10, 26, 20, 0.66);
    --edge: rgba(200, 240, 210, 0.18);
    --accent: #c1dc79;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a15; }
  canvas { display: block; }

  /* The 2x2 label grid sits over the single WebGL canvas. */
  #grid {
    position: fixed; inset: 0; z-index: 5;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    pointer-events: none;
  }
  .cell {
    position: relative;
    border-right: 1px solid rgba(255, 255, 255, 0.10);
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
  }
  .cell:nth-child(2n) { border-right: 0; }
  .cell:nth-child(n+3) { border-bottom: 0; }
  .tag {
    position: absolute; left: 12px; top: 12px;
    font: 600 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink);
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 9px; padding: 7px 10px; backdrop-filter: blur(10px);
    max-width: calc(100% - 24px);
  }
  .tag b { color: var(--accent); font-weight: 700; }
  .tag span { display: block; margin-top: 3px; font: 400 10.5px/1.4 ui-monospace, monospace;
    letter-spacing: 0; text-transform: none; color: rgba(238, 247, 241, 0.72); }

  #hint {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 6;
    font: 11px/1.5 ui-monospace, monospace; color: var(--ink);
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 9px; padding: 7px 12px; backdrop-filter: blur(10px);
    pointer-events: none; white-space: nowrap;
  }
  #hint kbd {
    display: inline-block; min-width: 14px; text-align: center;
    padding: 0 4px; border-radius: 4px;
    background: rgba(193, 220, 121, 0.16); color: #eaf7c4;
    border: 1px solid rgba(193, 220, 121, 0.32); font: inherit;
  }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: #0b1a15; color: #cfe6d6;
    font: 600 12px/1.5 ui-monospace, monospace; letter-spacing: 0.12em;
    text-transform: uppercase; transition: opacity 0.5s ease;
  }
  #loading.gone { opacity: 0; pointer-events: none; }
  #timebar {
    position: fixed; right: 14px; bottom: 12px; z-index: 7;
    display: flex; align-items: center; gap: 10px;
    font: 11px/1.5 ui-monospace, monospace; color: var(--ink);
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 9px; padding: 7px 12px; backdrop-filter: blur(10px);
  }
  #timebar kbd {
    display: inline-block; min-width: 12px; text-align: center; padding: 0 4px;
    border-radius: 4px; background: rgba(193, 220, 121, 0.16); color: #eaf7c4;
    border: 1px solid rgba(193, 220, 121, 0.32); font: inherit;
  }
  #tod { width: 200px; accent-color: #c1dc79; }
  #todlabel { font-weight: 700; color: var(--accent); min-width: 40px; }
  .hidden { display: none !important; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@dgreenheck/ez-tree": "/node_modules/@dgreenheck/ez-tree/build/ez-tree.es.js"
  }
}
</script>
</head>
<body>
<div id="loading">growing the meadow…</div>
<div id="grid">
  <div class="cell"><div class="tag" data-i="0"></div></div>
  <div class="cell"><div class="tag" data-i="1"></div></div>
  <div class="cell"><div class="tag" data-i="2"></div></div>
  <div class="cell"><div class="tag" data-i="3"></div></div>
</div>
<div id="hint">
  <kbd>drag</kbd> orbit · <kbd>wheel</kbd> zoom · <kbd>click</kbd> a panel to inspect · <kbd>esc</kbd> back · <kbd>1</kbd>–<kbd>4</kbd> solo · <kbd>h</kbd> hide
</div>
<div id="timebar">
  <span id="todlabel">07:30</span>
  <input id="tod" type="range" min="0" max="1000" value="310" />
  <span><kbd>[</kbd><kbd>]</kbd> scrub · <kbd>p</kbd> play</span>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createMeadowBackground } from "/game/src/map/index.js";
import { createMeadowPost } from "/game/src/map/post.js";
import { STYLES, applyStyle } from "/game/src/map/styles.js";
import { makeRng, CONFIG } from "/game/src/balance.js";

/* ------------------------------------------------------------------ */
/* renderer: ONE canvas, ONE renderer, four viewports                  */
/* ------------------------------------------------------------------ */

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.info.autoReset = false;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// One camera for all four panes. A 2x2 split of a W:H window gives every pane
// the SAME aspect as the window, so a single projection is exactly right --
// which is what makes the four views genuinely camera-synced rather than
// four cameras that happen to be nudged together.
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 700);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.497;
controls.minDistance = 2.5;
controls.maxDistance = 300;

function applyView(name) {
  const v = {
    gameplay: { pos: [-1.5, 2.45, 14.0], target: [-1.5, 1.02, 2.0], fov: 50 },
    eye:      { pos: [-3.2, 2.45, 18.0], target: [-3.2, 1.02, 6.0], fov: 50 },
    lake:     { pos: [-28, 3.2, 5.5],    target: [-62, 1.0, -3],   fov: 55 },
    shrine:   { pos: [0, 2.45, -22.0],   target: [0, 2.30, -36.0], fov: 50 },
  }[name] || { pos: [-1.5, 2.45, 14.0], target: [-1.5, 1.02, 2.0], fov: 50 };
  camera.position.set(...v.pos);
  controls.target.set(...v.target);
  camera.fov = v.fov;
  camera.updateProjectionMatrix();
  controls.update();
}

const rng = makeRng(CONFIG.run?.seed ?? 1337);

// Built WITHOUT its own post chain: this page owns four chains, one per pane.
const bg = createMeadowBackground({
  scene, renderer, camera, rng,
  quality: "high",
  post: false,
  width: innerWidth, height: innerHeight,
});
bg.renderer = renderer; // convenience handle for the style writer

applyView(new URLSearchParams(location.hash.replace(/^#/, "")).get("view") || "gameplay");

/* ------------------------------------------------------------------ */
/* four post chains, one per pane                                      */
/* ------------------------------------------------------------------ */

const paneW = () => Math.max(2, Math.floor(innerWidth / 2));
const paneH = () => Math.max(2, Math.floor(innerHeight / 2));

const chains = STYLES.map(() =>
  createMeadowPost({
    renderer, scene, camera,
    width: paneW(), height: paneH(),
    enabled: true,
    displayReferred: false,
  })
);

/* ------------------------------------------------------------------ */
/* depth pass, for the outline style                                   */
/* ------------------------------------------------------------------ */

// The composer's scene target is multisampled, and a multisampled target
// carries a depth *renderbuffer*, not a depth texture -- so it cannot be
// sampled. The outline therefore gets its own half-resolution depth pass,
// rendered only for panes that ask for it. Half res on purpose: it smooths
// the single-pixel depth spikes that grass blades would turn into speckle.
let depthRT = null, depthTex = null, depthW = 0, depthH = 0;

function ensureDepth(w, h) {
  if (depthRT && depthW === w && depthH === h) return;
  if (depthRT) { depthRT.dispose(); depthTex.dispose(); }
  depthW = w; depthH = h;
  depthTex = new THREE.DepthTexture(w, h, THREE.FloatType);
  // NEAREST, not LINEAR: a depth texture is not filterable in WebGL2 unless the
  // float-linear extension is on, and a filtered depth texture comes back
  // *incomplete* -- every sample reads 0, which silently produces no outline.
  depthTex.minFilter = THREE.NearestFilter;
  depthTex.magFilter = THREE.NearestFilter;
  depthRT = new THREE.WebGLRenderTarget(w, h, {
    depthTexture: depthTex,
    depthBuffer: true,
    stencilBuffer: false,
    type: THREE.UnsignedByteType,
  });
}

/* ------------------------------------------------------------------ */
/* labels                                                              */
/* ------------------------------------------------------------------ */

const tags = [...document.querySelectorAll(".tag")];
function paintTags() {
  tags.forEach((el, i) => {
    const s = STYLES[i];
    el.innerHTML = `<b>${i + 1} · ${s.label}</b><span>${s.blurb}</span>`;
  });
}
paintTags();

let labelsOn = true;
const grid = document.getElementById("grid");
const hint = document.getElementById("hint");

/* ------------------------------------------------------------------ */
/* solo mode                                                           */
/* ------------------------------------------------------------------ */

let solo = -1;

function layout() {
  const W = innerWidth, H = innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  if (solo < 0) {
    for (const c of chains) c.setSize(paneW(), paneH());
  } else {
    chains[solo].setSize(W, H);
  }
}

addEventListener("resize", layout);

renderer.domElement.addEventListener("click", (e) => {
  if (solo >= 0) return;
  const col = e.clientX < innerWidth / 2 ? 0 : 1;
  const row = e.clientY < innerHeight / 2 ? 0 : 1;
  solo = row * 2 + col;
  chains[solo].setSize(innerWidth, innerHeight);
  grid.classList.add("hidden");
  layout();
});

addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "escape" || k === "0") { solo = -1; grid.classList.remove("hidden"); layout(); }
  if (k >= "1" && k <= "4") {
    solo = Number(k) - 1;
    chains[solo].setSize(innerWidth, innerHeight);
    grid.classList.add("hidden");
    layout();
  }
  if (k === "h") {
    labelsOn = !labelsOn;
    grid.classList.toggle("hidden", !labelsOn || solo >= 0);
    hint.classList.toggle("hidden", !labelsOn);
  }
  if (k === "[") { timeOfDay = (timeOfDay - 0.01 + 1) % 1; todEl.value = Math.round(timeOfDay * 1000); }
  if (k === "]") { timeOfDay = (timeOfDay + 0.01) % 1; todEl.value = Math.round(timeOfDay * 1000); }
  if (k === "p") todPlaying = !todPlaying;
});

/* ------------------------------------------------------------------ */
/* time of day                                                         */
/* ------------------------------------------------------------------ */

const todEl = document.getElementById("tod");
const todLabel = document.getElementById("todlabel");
let timeOfDay = 0.31;   // 07:26 -- the light the four styles were tuned on
let todPlaying = false;
let daylight = 1;

function tickTime(dt) {
  if (todPlaying) {
    timeOfDay = (timeOfDay + dt * 0.02) % 1;
    todEl.value = Math.round(timeOfDay * 1000);
  }
  daylight = bg.setTimeOfDay(timeOfDay);
  const mins = Math.floor(timeOfDay * 24 * 60);
  todLabel.textContent =
    String(Math.floor(mins / 60)).padStart(2, "0") + ":" + String(mins % 60).padStart(2, "0");
}

todEl.addEventListener("input", () => { timeOfDay = Number(todEl.value) / 1000; });

/* ------------------------------------------------------------------ */
/* frame                                                               */
/* ------------------------------------------------------------------ */

const clock = new THREE.Clock();
let fps = 60, last = performance.now(), frames = 0;

function drawPane(i) {
  const W = innerWidth, H = innerHeight;
  applyStyle(bg, STYLES[i], scene, chains[i], renderer);
  // The vegetation is a self-lit ramp and ignores light intensity, so the
  // night has to come from exposure. Multiply, do not overwrite: applyStyle
  // just set the per-style base exposure.
  renderer.toneMappingExposure *= daylight;

  // Panes that want a drawn outline need their own depth buffer first.
  if ((STYLES[i].outline ?? 0) > 0.001) {
    const dw = Math.max(2, Math.floor((solo >= 0 ? W : paneW()) * 0.5));
    const dh = Math.max(2, Math.floor((solo >= 0 ? H : paneH()) * 0.5));
    ensureDepth(dw, dh);
    renderer.setScissorTest(false);
    renderer.setRenderTarget(depthRT);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    const g = chains[i].params.grade;
    g.tDepth.value = depthTex;
    g.uTexel.value.set(1 / dw, 1 / dh);
    g.uCamNear.value = camera.near;
    g.uCamFar.value = camera.far;
  }

  if (solo >= 0) {
    renderer.setViewport(0, 0, W, H);
    renderer.setScissor(0, 0, W, H);
    renderer.setScissorTest(true);
  } else {
    const pw = paneW(), ph = paneH();
    const col = i % 2;
    const row = Math.floor(i / 2);
    // WebGL's origin is bottom-left; CSS grid rows run top-down.
    const x = col * pw;
    const y = (1 - row) * ph;
    renderer.setViewport(x, y, pw, ph);
    renderer.setScissor(x, y, pw, ph);
    renderer.setScissorTest(true);
  }
  chains[i].render(0);
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  bg.update(clock.elapsedTime, dt);
  tickTime(dt);
  controls.update();

  renderer.info.reset();
  if (solo >= 0) {
    drawPane(solo);
  } else {
    for (let i = 0; i < chains.length; i++) drawPane(i);
  }
  renderer.setScissorTest(false);

  frames++;
  const now = performance.now();
  fps = fps * 0.93 + (1000 / Math.max(1, now - last)) * 0.07;
  last = now;
  if (labelsOn && frames % 15 === 0) {
    const info = renderer.info.render;
    hint.innerHTML =
      `<kbd>drag</kbd> orbit · <kbd>wheel</kbd> zoom · <kbd>click</kbd> inspect · <kbd>1</kbd>–<kbd>4</kbd> solo · ` +
      `<b>${fps.toFixed(0)} fps</b> · ${(info.triangles / 1000).toFixed(0)}k tris · ${info.calls} draws`;
  }
  requestAnimationFrame(frame);
}

bg.update(0, 0);
renderer.setViewport(0, 0, innerWidth, innerHeight);
renderer.setScissor(0, 0, innerWidth, innerHeight);
renderer.setScissorTest(true);
chains[0].render(0);
renderer.setScissorTest(false);
document.getElementById("loading").classList.add("gone");
frame();

window.__styles = { scene, camera, renderer, bg, chains, STYLES, applyStyle, applyView, controls,
  setSolo: (i) => { solo = i; layout(); } };
</script>
</body>
</html>
