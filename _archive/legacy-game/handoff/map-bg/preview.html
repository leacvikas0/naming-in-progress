<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sunpetal Vale — anime meadow background</title>
<style>
  :root {
    --ink: #f2fbf6;
    --panel: rgba(12, 30, 24, 0.72);
    --edge: rgba(200, 240, 210, 0.18);
    --accent: #c1dc79;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d6ecea; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 14px; bottom: 14px; z-index: 10;
    font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--edge); border-radius: 10px;
    padding: 9px 12px; white-space: pre; backdrop-filter: blur(10px);
    pointer-events: none;
  }
  #hud b { color: var(--accent); font-weight: 600; }
  #keys {
    position: fixed; right: 14px; top: 14px; z-index: 10;
    font: 11px/1.6 ui-monospace, monospace; color: var(--ink);
    background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
    padding: 8px 11px; backdrop-filter: blur(10px); pointer-events: none;
  }
  #keys kbd {
    display: inline-block; min-width: 14px; text-align: center;
    padding: 0 4px; border-radius: 4px;
    background: rgba(193, 220, 121, 0.16); color: #eaf7c4;
    border: 1px solid rgba(193, 220, 121, 0.32); font: inherit;
  }
  #title {
    position: fixed; left: 14px; top: 14px; z-index: 10;
    font: 600 13px/1.4 ui-monospace, monospace; letter-spacing: 0.06em;
    color: var(--ink); text-transform: uppercase;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 10px; padding: 7px 11px; backdrop-filter: blur(10px);
    pointer-events: none;
  }
  #title span { color: var(--accent); }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: #d6ecea; color: #2c4a3c;
    font: 600 12px/1.5 ui-monospace, monospace; letter-spacing: 0.12em;
    text-transform: uppercase; transition: opacity 0.5s ease;
  }
  #loading.gone { opacity: 0; pointer-events: none; }
  .hidden { display: none !important; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@dgreenheck/ez-tree": "/node_modules/@dgreenheck/ez-tree/build/ez-tree.es.js"
  }
}
</script>
</head>
<body>
<div id="loading">growing the meadow…</div>
<div id="title">Sunpetal Vale <span>· meadow background</span></div>
<div id="keys">
  <kbd>1</kbd> gameplay · <kbd>2</kbd> aerial · <kbd>3</kbd> eye level · <kbd>4</kbd> lake<br />
  <kbd>drag</kbd> orbit · <kbd>wheel</kbd> zoom · <kbd>P</kbd> post · <kbd>H</kbd> hide ui
</div>
<div id="hud">building…</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createMeadowBackground } from "/game/src/map/index.js";
import { makeRng, CONFIG } from "/game/src/balance.js";

const params = new URLSearchParams(location.search);
// `npx serve` 301s /preview.html?x=y to /preview and drops the query string, so
// flags have to be readable from the hash as well: preview.html#hud=0
const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
const flag = (name) => params.get(name) ?? hashParams.get(name);
const quality = flag("quality") || "high";
const postEnabled = flag("post") !== "0";
// #hud=0 renders the frame clean (no title / key legend / stats overlay) so a
// screenshot can be judged and pixel-sampled without the UI on top of the art.
const hudVisibleAtStart = flag("hud") !== "0";

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.info.autoReset = false;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 700);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
// NOTE: OrbitControls clamps the camera to polar <= 0.497pi (89.5 deg). Every
// view below looks *down* (target y < camera y), so nothing is clamped. If a
// view ever puts the target above the camera the camera is silently lifted and
// the numbers in VIEWS stop describing what is rendered.
controls.maxPolarAngle = Math.PI * 0.497;
controls.minDistance = 2.5;
controls.maxDistance = 300;
controls.target.set(0, 1.0, 0);

// Eye-level framing, like the reference painting: low horizon, path leading in,
// sky occupying the top third of the frame.
//
// gameplay is the reference shot. Derived from the numbers, not eyeballed:
//   eye height above the meadow floor (heightAt ~= 0.75)  = 1.70 m
//   pitch atan((2.45 - 1.02) / 12.0)                      = 6.8 deg down
//   true horizon 0.5 - 6.8/50                             = 36.4 % of frame
//   visible crest (terrain rises to y 5.4 at z -120)      =~ 32-34 %
//   canopy tops ~17 %, tree bases ~37 %
//
// z = 14, not the plan's 20: the leading path spoke starts at z = 6, so from
// z = 20 the tan ribbon only appears at ~50 % frame height and never reaches the
// bottom edge (acceptance test 4 fails). From z = 14 the bottom edge of the frame
// is at z ~= 11, the path enters it right of centre and runs to the tree line --
// the reference's read -- while horizon/canopy framing stay inside the targets.
// x = -1.5 puts the path right of centre and lets it curve away, as in the ref.
const VIEWS = {
  gameplay: { pos: [-1.5, 2.45, 14.0], target: [-1.5, 1.02, 2.0], fov: 50 },
  aerial:   { pos: [0, 78, 92],    target: [0, 0, 0], fov: 58 },
  eye:      { pos: [-3.2, 2.45, 18.0], target: [-3.2, 1.02, 6.0], fov: 50 },
  lake:     { pos: [-28, 3.2, 5.5], target: [-62, 1.0, -3], fov: 55 },
  shrine:   { pos: [0, 2.45, -22.0], target: [0, 2.30, -36.0], fov: 50 },
};
function applyView(name) {
  const v = VIEWS[name] || VIEWS.gameplay;
  camera.position.set(...v.pos);
  controls.target.set(...v.target);
  if (v.fov) { camera.fov = v.fov; camera.updateProjectionMatrix(); }
  controls.update();
}

const rng = makeRng(CONFIG.run?.seed ?? 1337);
const bg = createMeadowBackground({
  scene, renderer, camera, rng, quality, post: postEnabled,
  width: innerWidth, height: innerHeight,
});

applyView(flag("view") || "gameplay");

/* ---------------- time of day ---------------- */

// 0 = midnight, 0.25 sunrise, 0.5 noon, 0.75 sunset. 0.31 is the morning light
// the Cinematic grade was tuned on: sun low and slightly right of centre.
let tod = 0.31;
const baseExposure = renderer.toneMappingExposure;
const todLabel = () => {
  const m = Math.floor(tod * 24 * 60);
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
};

/* ---------------- input ---------------- */

let hudVisible = hudVisibleAtStart;
if (!hudVisibleAtStart) {
  for (const id of ["hud", "keys", "title"]) document.getElementById(id).classList.add("hidden");
}
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "1") applyView("gameplay");
  if (k === "2") applyView("aerial");
  if (k === "3") applyView("eye");
  if (k === "4") applyView("lake");
  if (k === "5") applyView("shrine");
  if (k === "p") { postOn = !postOn; bg.setPostEnabled(postOn); }
  if (k === "[") tod = (tod - 0.01 + 1) % 1;
  if (k === "]") tod = (tod + 0.01) % 1;
  if (k === "h") {
    hudVisible = !hudVisible;
    for (const id of ["hud", "keys", "title"]) document.getElementById(id).classList.toggle("hidden", !hudVisible);
  }
});
let postOn = postEnabled;

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  bg.resize(innerWidth, innerHeight);
});

/* ---------------- frame loop ---------------- */

const hudEl = document.getElementById("hud");
const clock = new THREE.Clock();
let fps = 60;
let last = performance.now();
let hudTimer = 0;
let frames = 0;

function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  const elapsed = clock.elapsedTime;
  bg.update(elapsed, dt);
  // The vegetation is a self-lit ramp and ignores light intensity, so night has
  // to come from exposure.
  renderer.toneMappingExposure = baseExposure * bg.setTimeOfDay(tod);
  controls.update();
  renderer.info.reset();
  bg.render(dt);

  frames += 1;
  const now = performance.now();
  fps = fps * 0.93 + (1000 / Math.max(1, now - last)) * 0.07;
  last = now;

  hudTimer += dt;
  if (hudTimer > 0.25) {
    hudTimer = 0;
    const info = renderer.info.render;
    const s = bg.stats;
    hudEl.innerHTML =
      `<b>triangles</b> ${(info.triangles / 1000).toFixed(0)}k   <b>draws</b> ${info.calls}   <b>fps</b> ${fps.toFixed(0)}\n` +
      `<b>terrain</b>   ${(s.terrain.triangles / 1000).toFixed(0)}k tris · ${s.terrain.drawCalls} draws\n` +
      `<b>meadow</b>    ${(s.kit.triangles / 1000).toFixed(0)}k tris · ${s.kit.instances} instances · ${s.kit.trees} trees\n` +
      `<b>post</b>      ${postOn ? "on" : "off"}   <b>colliders</b> ${s.colliders}`;
  }
  requestAnimationFrame(frame);
}

// One frame before hiding the loader so the first paint is the meadow, not a flash.
bg.update(0, 0);
bg.render(0);
document.getElementById("loading").classList.add("gone");
frame();

window.__meadow = { scene, camera, renderer, bg, applyView, controls };
</script>
</body>
</html>
