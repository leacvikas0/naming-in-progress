<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meadow terrain — ground pass</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d6ecea; }
  canvas { display: block; }
  #stats {
    position: fixed; left: 12px; bottom: 12px; z-index: 5;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #f2fbf6; background: rgba(12, 30, 24, 0.72);
    padding: 8px 10px; border-radius: 8px; white-space: pre;
  }
  #hint {
    position: fixed; right: 12px; top: 12px; z-index: 5;
    font: 11px/1.5 ui-monospace, monospace; color: #eaf7ee;
    background: rgba(12, 30, 24, 0.6); padding: 6px 9px; border-radius: 8px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stats">loading…</div>
<div id="hint">drag orbit · wheel zoom · 1/2/3 camera presets</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { MEADOW, MEADOW_LIGHT } from "/game/src/map/palette.js";
import { createMeadowTerrain } from "/game/src/map/terrain.js";

const params = new URLSearchParams(location.search);
const quality = params.get("quality") || "high";

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = MEADOW_LIGHT.exposure;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(MEADOW.skyHorizon);
scene.fog = new THREE.Fog(MEADOW.fog, MEADOW_LIGHT.fogNear, MEADOW_LIGHT.fogFar);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 600);

// Temporary light rig: the sky module will own this later. Same colours/dir so
// the ground can be judged against the intended lighting.
const sun = new THREE.DirectionalLight(MEADOW.sun, MEADOW_LIGHT.sunIntensity);
const az = MEADOW_LIGHT.sunAzimuth;
const el = MEADOW_LIGHT.sunElevation;
sun.position.set(Math.cos(az) * Math.cos(el) * 90, Math.sin(el) * 90, Math.sin(az) * Math.cos(el) * 90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -70; sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70; sun.shadow.camera.bottom = -70;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 260;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(MEADOW.ambientSky, MEADOW.ambientGround, MEADOW_LIGHT.hemiIntensity));
scene.add(new THREE.AmbientLight(MEADOW.ambientSky, MEADOW_LIGHT.ambientIntensity));

const terrain = createMeadowTerrain({ palette: MEADOW, quality });
scene.add(terrain.group);

// Reference markers so scale reads correctly (1.9 m hero height).
const marker = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.28, 1.3, 4, 8),
  new THREE.MeshStandardMaterial({ color: 0xf0e6d2, roughness: 0.9 })
);
marker.position.set(0, 0.95, 6);
marker.castShadow = true;
scene.add(marker);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 3;
controls.maxDistance = 240;

const VIEWS = {
  game:  { pos: [0, 8.2, 14.5], target: [0, 0.6, 1.5] },
  aerial:{ pos: [0, 82, 96],     target: [0, 0, 0] },
  ground:{ pos: [3.4, 1.7, 9.5], target: [0, 0.9, -2] },
  lake:  { pos: [-24, 7.5, 6],   target: [-56, -0.3, -4] },
};
function applyView(name) {
  const v = VIEWS[name] || VIEWS.game;
  camera.position.set(...v.pos);
  controls.target.set(...v.target);
  controls.update();
}
applyView(params.get("view") || location.hash.slice(1) || "game");
addEventListener("keydown", (e) => {
  if (e.key === "1") applyView("game");
  if (e.key === "2") applyView("aerial");
  if (e.key === "3") applyView("ground");
});

const statsEl = document.getElementById("stats");
function updateStats() {
  const info = renderer.info.render;
  statsEl.textContent =
    `triangles  ${(info.triangles / 1000).toFixed(0)}k\n` +
    `draw calls ${info.calls}\n` +
    `terrain    ${(terrain.stats.triangles / 1000).toFixed(0)}k tris / ${terrain.stats.drawCalls} calls\n` +
    `fps        ${fps.toFixed(0)}`;
}

let fps = 60;
let last = performance.now();
const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta();
  const elapsed = clock.elapsedTime;
  terrain.update(elapsed);
  controls.update();
  renderer.render(scene, camera);
  const now = performance.now();
  fps = fps * 0.92 + (1000 / Math.max(1, now - last)) * 0.08;
  last = now;
  updateStats();
  requestAnimationFrame(frame);
}
frame();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

window.__meadow = { scene, camera, renderer, terrain, applyView };
</script>
</body>
</html>
