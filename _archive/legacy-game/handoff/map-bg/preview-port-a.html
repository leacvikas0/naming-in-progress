<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REFA kit — port A preview (verbatim botanical engine)</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #071824;
      }
      canvas {
        display: block;
      }
      /* Full-width debug bar across the top: sits over the empty sky band so it
         never covers the asset lineup. */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 8px 14px 9px;
        background: linear-gradient(180deg, rgba(5, 15, 23, 0.94), rgba(5, 15, 23, 0.72));
        border-bottom: 1px solid rgba(150, 190, 255, 0.16);
        color: #cfe4f4;
        font-size: 10px;
        line-height: 1.5;
        letter-spacing: 0.02em;
        user-select: none;
        pointer-events: none;
      }
      #hud .line1 {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
      }
      #hud h1 {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #c9e2ff;
        white-space: nowrap;
      }
      #hud h1 span {
        color: #7f9bb2;
        font-weight: 400;
        letter-spacing: 0.02em;
        text-transform: none;
        margin-left: 10px;
      }
      #summary {
        color: #9fc0d8;
        white-space: nowrap;
      }
      #summary b {
        color: #d9ea8d;
        font-weight: 600;
      }
      #summary em {
        font-style: normal;
        color: #f0b9ff;
      }
      #variants {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-top: 4px;
      }
      .chip {
        white-space: nowrap;
        color: #9db8cc;
      }
      .chip b {
        color: #e8f6ff;
        font-weight: 600;
      }
      .chip span {
        color: #8fa9bd;
      }
      .chip.grass b {
        color: #b7e88a;
      }
      .chip.wild b {
        color: #f3e6b8;
      }
      .chip.stalk b {
        color: #e2c4ff;
      }
      #hud .hint {
        margin-top: 4px;
        color: #6f8ba1;
        font-size: 9px;
        letter-spacing: 0.04em;
      }
      #hud .hint b {
        color: #93b4cc;
        font-weight: 600;
      }
      #status {
        position: fixed;
        right: 14px;
        bottom: 12px;
        z-index: 10;
        padding: 5px 10px;
        border-radius: 6px;
        background: rgba(5, 15, 23, 0.8);
        color: #9df03a;
        font-size: 10px;
        letter-spacing: 0.07em;
        user-select: none;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <div class="line1">
        <h1>REFA kit — port A <span>verbatim botanical geometry + shader · three r0.170</span></h1>
        <div id="summary"></div>
      </div>
      <div id="variants"></div>
      <div class="hint">
        <b>[1]</b> twilight · <b>[2]</b> dusk · <b>[3]</b> moonlight · <b>[w]</b> wireframe ·
        <b>[g]</b> grass bed · <b>[p]</b> post off · <b>[h]</b> hide bar · drag / scroll to orbit
      </div>
    </div>
    <div id="status">booting…</div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import {
        REFA_PRESETS,
        REFA_UNIFORMS,
        createRefaMaterial,
        applyRefaPreset,
        getRefaPresetName,
        buildFlowerStalkGeometry,
        buildWildflowerGeometry,
        buildGrassTuftGeometry,
        SeededRandom
      } from "../../src/map/port/refa-kit.js";

      const statusEl = document.getElementById("status");
      const hudEl = document.getElementById("hud");

      // ----------------------------------------------------------------------
      // Renderer / scene / camera. The kit's ShaderMaterial is self-lit and
      // writes its final colour, exactly as in source A; the reference post
      // stack below is what converts that to the reference page's screen look.
      // ----------------------------------------------------------------------
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = REFA_PRESETS.twilight.skyBg.clone();

      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 220);
      camera.position.set(0, 2.2, 7.8);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.0, -0.2);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI * 0.495;
      controls.minDistance = 0.35;
      controls.maxDistance = 42;

      // Source A's exact post stack: EffectComposer + RenderPass +
      // UnrealBloomPass(0.16, 0.55, 0.86). The kit's ShaderMaterial writes raw
      // (linear) values like the source does; this stack is what turns them
      // into the reference page's on-screen colour + soft highlight glow.
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.16,
        0.55,
        0.86
      );
      composer.addPass(bloomPass);
      let postEnabled = true;

      // ----------------------------------------------------------------------
      // The ported material (twilight by default). Uniforms are shared exactly
      // as authored, so the mood switch updates every mesh at once.
      // ----------------------------------------------------------------------
      const material = createRefaMaterial("twilight");

      // Source's interactive foliage parting + player lantern are driven by
      // uPlayerPos; park it far away so the showcase keeps the authored
      // geometry untouched (uInspectorMode stays 0, so the canopy dapple runs).
      REFA_UNIFORMS.uPlayerPos.value.set(0, -1000, 0);

      // ----------------------------------------------------------------------
      // Plain dark ground
      // ----------------------------------------------------------------------
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshBasicMaterial({ color: "#0a352d" })
      );      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // ----------------------------------------------------------------------
      // Asset lineup: back row = 4 hero stalks, front row = 3 wildflowers + 3 grass
      // ----------------------------------------------------------------------
      const triCount = (geo) =>
        geo.index ? geo.index.count / 3 : geo.attributes.position.count / 3;
      const fmt = (n) => n.toLocaleString("en-US");

      const assets = [];
      function addAsset(geo, name, kind, x, z, scale = 1) {
        const mesh = new THREE.Mesh(geo, material);
        mesh.position.set(x, 0, z);
        mesh.scale.setScalar(scale);
        scene.add(mesh);
        const rec = { mesh, geo, name, kind, tris: triCount(geo), verts: geo.attributes.position.count };
        assets.push(rec);
        return rec;
      }

      const STALK_X = [-3.375, -1.125, 1.125, 3.375];
      const FRONT_X = [-3.625, -2.175, -0.725, 0.725, 2.175, 3.625];

      const stalks = [];
      for (let i = 0; i < 4; i++) {
        stalks.push(addAsset(buildFlowerStalkGeometry(i), `stalk-${i}`, "stalk", STALK_X[i], -1.8, 1));
      }

      const wilds = [];
      for (let i = 0; i < 3; i++) {
        wilds.push(addAsset(buildWildflowerGeometry(i), `wild-${i}`, "wild", FRONT_X[i], 1.2, 1));
      }

      const tufts = [];
      for (let i = 0; i < 3; i++) {
        tufts.push(addAsset(buildGrassTuftGeometry(i), `grass-${i}`, "grass", FRONT_X[3 + i], 1.2, 1.15));
      }

      // ----------------------------------------------------------------------
      // Dense instanced grass bed behind the lineup — same 6-blade tufts, same
      // material, USE_INSTANCING path of the shader. Demonstrates the source's
      // meadow density without a hand-rolled field.
      // ----------------------------------------------------------------------
      const grassBed = new THREE.Group();
      grassBed.name = "grass-bed";
      scene.add(grassBed);

      const BED_PER_VARIANT = 900;
      const BED_X = 8.5;
      const BED_Z0 = -14.0;
      const BED_Z1 = -5.0;
      const rngBed = new SeededRandom(42);
      const bedDummy = new THREE.Object3D();
      let bedTris = 0;

      for (let v = 0; v < 3; v++) {
        const geo = tufts[v].geo;
        const inst = new THREE.InstancedMesh(geo, material, BED_PER_VARIANT);
        inst.frustumCulled = false;
        bedTris += triCount(geo) * BED_PER_VARIANT;
        for (let i = 0; i < BED_PER_VARIANT; i++) {
          const x = rngBed.range(-BED_X, BED_X);
          const z = rngBed.range(BED_Z0, BED_Z1);
          bedDummy.position.set(x, 0, z);
          bedDummy.rotation.set(
            rngBed.range(-0.1, 0.1),
            rngBed.range(0, Math.PI * 2),
            rngBed.range(-0.1, 0.1)
          );
          const sXZ = rngBed.range(0.85, 1.45);
          bedDummy.scale.set(sXZ, rngBed.range(0.85, 1.45), sXZ);
          bedDummy.updateMatrix();
          inst.setMatrixAt(i, bedDummy.matrix);
        }
        inst.instanceMatrix.needsUpdate = true;
        grassBed.add(inst);
      }

      // ----------------------------------------------------------------------
      // HUD
      // ----------------------------------------------------------------------
      const lineupTris = assets.reduce((s, a) => s + a.tris, 0);

      document.getElementById("variants").innerHTML = assets
        .map(
          (a) =>
            `<span class="chip ${a.kind}"><b>${a.name}</b> <span>${fmt(a.tris)} tris · ${fmt(
              a.verts
            )} verts</span></span>`
        )
        .join("");

      document.getElementById("summary").innerHTML =
        `lineup <b>${fmt(lineupTris)}</b> tris · ${assets.length} assets · ` +
        `grass bed <b>${fmt(bedTris)}</b> tris (${BED_PER_VARIANT * 3} instanced tufts) · ` +
        `preset <em id="presetName">twilight</em>`;

      const presetNameEl = document.getElementById("presetName");
      const groundBase = new THREE.Color();

      // Mood preset switching — copied from A's .mood-btn handler.
      function setPreset(name) {
        const p = REFA_PRESETS[name];
        if (!p) return;
        applyRefaPreset(name);
        scene.background.copy(p.skyBg);
        // plain dark ground, tinted from the mood's own grass-shadow tone
        groundBase.copy(p.grassShadow).multiplyScalar(0.5);
        ground.material.color.copy(groundBase);
        presetNameEl.textContent = getRefaPresetName();
        statusEl.textContent = `● live · ${getRefaPresetName()} · ${fmt(lineupTris)} tris lineup`;
      }

      // ----------------------------------------------------------------------
      // Camera views (used by the screenshot harness)
      // ----------------------------------------------------------------------
      const VIEWS = {
        lineup: { pos: [0, 2.2, 7.8], target: [0, 1.0, -0.2] },
        stalk: { pos: [-1.75, 1.3, 1.3], target: [-3.375, 0.72, -1.8] },
        closeup: { pos: [-2.2, 1.28, 0.35], target: [-3.375, 0.98, -1.8] },
        flowers: { pos: [-2.175, 1.05, 4.5], target: [-2.175, 0.36, 1.2] },
        grass: { pos: [2.175, 1.0, 4.4], target: [2.175, 0.38, 1.2] },
        meadow: { pos: [0, 3.0, -2.5], target: [0.5, 0.4, -10.5] },
        top: { pos: [0, 10.5, 0.01], target: [0, 0, -1.0] }
      };
      function setView(name) {
        const v = VIEWS[name] || VIEWS.lineup;
        camera.position.set(...v.pos);
        controls.target.set(...v.target);
        controls.update();
      }

      // ----------------------------------------------------------------------
      // Input
      // ----------------------------------------------------------------------
      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (k === "1") setPreset("twilight");
        else if (k === "2") setPreset("dusk");
        else if (k === "3") setPreset("moonlight");
        else if (k === "w") {
          material.wireframe = !material.wireframe;
          statusEl.textContent = `wireframe ${material.wireframe ? "on" : "off"}`;
        } else if (k === "g") {
          grassBed.visible = !grassBed.visible;
        } else if (k === "h") {
          hudEl.style.display = hudEl.style.display === "none" ? "" : "none";
        } else if (k === "p") {
          postEnabled = !postEnabled;
          statusEl.textContent = `post ${postEnabled ? "on (ref composer + bloom)" : "off (raw kit output)"}`;
        }
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      // ----------------------------------------------------------------------
      // Loop — only uTime is animated (shader wind + canopy drift)
      // ----------------------------------------------------------------------
      const clock = new THREE.Clock();
      let timeOverride = null; // harness-only freeze, used for still screenshots
      setPreset("twilight");

      function animate() {
        requestAnimationFrame(animate);
        REFA_UNIFORMS.uTime.value = timeOverride !== null ? timeOverride : clock.getElapsedTime();
        controls.update();
        if (postEnabled) composer.render();
        else renderer.render(scene, camera);
      }
      animate();

      // Debug / screenshot hook
      window.__refa = {
        THREE,
        scene,
        camera,
        renderer,
        composer,
        controls,
        material,
        uniforms: REFA_UNIFORMS,
        assets,
        grassBed,
        views: Object.keys(VIEWS),
        view: setView,
        preset: setPreset,
        setPost(on) {
          postEnabled = !!on;
        },
        // Freeze the shader clock (harness only) so a still can pick a frame
        // where the dappled canopy light reads across the lineup.
        setTime(t) {
          timeOverride = t === null ? null : Number(t);
        },
        // isolate one asset at the origin for 1:1 comparison with the source page
        solo(name) {
          for (const a of assets) a.mesh.visible = a.name === name;
          const a = assets.find((x) => x.name === name);
          if (!a) return null;
          a.mesh.position.set(0, 0, 0);
          a.mesh.scale.setScalar(1);
          return a;
        },
        restore() {
          for (const a of assets) a.mesh.visible = true;
          assets.forEach((a, i) => {
            const x = a.kind === "stalk" ? STALK_X[i] : FRONT_X[a.kind === "wild" ? i - 4 : i - 7];
            a.mesh.position.set(x, 0, a.kind === "stalk" ? -1.8 : 1.2);
            a.mesh.scale.setScalar(a.kind === "grass" ? 1.15 : 1);
          });
        },
        stats: {
          lineupTris,
          bedTris,
          variants: assets.map((a) => ({ name: a.name, tris: a.tris, verts: a.verts }))
        }
      };
      window.__refaReady = true;
      document.body.dataset.ready = "1";
    </script>
  </body>
</html>
