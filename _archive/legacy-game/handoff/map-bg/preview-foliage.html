<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sunpetal Vale — foliage preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #d6ecea;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 10;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(10, 22, 18, 0.72);
        color: #eaf7e0;
        font-size: 11.5px;
        line-height: 1.55;
        letter-spacing: 0.02em;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(234, 247, 224, 0.16);
        min-width: 214px;
        user-select: none;
        pointer-events: none;
      }
      #hud h1 {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff3d6;
      }
      #hud .row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
      }
      #hud .row b {
        font-weight: 600;
        color: #d9ea8d;
      }
      #hud .muted {
        color: #a9c4b4;
      }
      #hud .hint {
        margin-top: 7px;
        padding-top: 7px;
        border-top: 1px solid rgba(234, 247, 224, 0.14);
        color: #a9c4b4;
        font-size: 10.5px;
      }
      #status {
        position: fixed;
        right: 16px;
        bottom: 14px;
        z-index: 10;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(10, 22, 18, 0.7);
        color: #d9ea8d;
        font-size: 11px;
        letter-spacing: 0.06em;
        user-select: none;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <h1>Sunpetal Vale · foliage</h1>
      <div class="row"><span class="muted">instances</span><b id="s-instances">—</b></div>
      <div class="row"><span class="muted">draw calls</span><b id="s-calls">—</b></div>
      <div class="row"><span class="muted">triangles</span><b id="s-tris">—</b></div>
      <div class="row"><span class="muted">trees / grass</span><b id="s-trees">—</b></div>
      <div class="row"><span class="muted">flowers / shrubs</span><b id="s-flowers">—</b></div>
      <div class="row"><span class="muted">fps</span><b id="s-fps">—</b></div>
      <div class="hint">1 gameplay · 2 orbit · 3 close-up · H hide hud</div>
    </div>
    <div id="status">booting…</div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { createMeadowFoliage } from "/game/src/map/foliage.js";
      import { MEADOW, MEADOW_LIGHT } from "/game/src/map/palette.js";

      /* ---------------------------------------------------------------- */
      /* Stub world: flat heightAt and the SPEC path loop.                 */
      /* ---------------------------------------------------------------- */

      const LOOP = [
        [0, 24], [-27, 20], [-32, -9], [-18, -28], [0, -31],
        [26, -23], [30, 14], [18, 29],
      ];
      const SPOKES = [
        { from: [0, 6], to: [0, -31], width: 3.0 },
        { from: [0, 4], to: [-31, -4], width: 2.8 },
        { from: [8, 10], to: [29, 17], width: 2.8 },
        { from: [0, 20], to: [-23, 22], width: 2.4 },
      ];
      const LOOP_WIDTH = 3.5;

      const segments = [];
      for (let i = 0; i < LOOP.length; i++) {
        const a = LOOP[i];
        const b = LOOP[(i + 1) % LOOP.length];
        segments.push({ ax: a[0], az: a[1], bx: b[0], bz: b[1], half: LOOP_WIDTH * 0.5 });
      }
      for (const s of SPOKES) {
        segments.push({
          ax: s.from[0], az: s.from[1], bx: s.to[0], bz: s.to[1],
          half: (s.width ?? 2.9) * 0.5,
        });
      }

      function pathDistance(x, z) {
        let best = Infinity;
        for (let i = 0; i < segments.length; i++) {
          const s = segments[i];
          const dx = s.bx - s.ax;
          const dz = s.bz - s.az;
          const len2 = dx * dx + dz * dz;
          let t = len2 > 0 ? ((x - s.ax) * dx + (z - s.az) * dz) / len2 : 0;
          if (t < 0) t = 0;
          else if (t > 1) t = 1;
          const d = Math.hypot(x - (s.ax + dx * t), z - (s.az + dz * t)) - s.half;
          if (d < best) best = d;
        }
        return best;
      }

      const heightAt = () => 0;

      // Deterministic RNG for the preview (same seed => same meadow).
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function rng() {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /* ---------------------------------------------------------------- */
      /* Renderer / scene                                                  */
      /* ---------------------------------------------------------------- */

      const params = new URLSearchParams(location.search);
      const quality = params.get("quality") === "low" ? "low" : "high";
      const freeze = params.get("freeze") === "1";

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      // The foliage is ramp-lit and needs no shadow maps; ground shadows only
      // add acne at this stub-ground scale, so keep them off for clean judging.
      renderer.shadowMap.enabled = false;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(MEADOW.fog, MEADOW_LIGHT.fogNear, MEADOW_LIGHT.fogFar);

      const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 520);
      camera.position.set(0, 7.4, 10.2);

      /* ---------------------------------------------------------------- */
      /* Sky dome (preview only; the real sky module is separate)          */
      /* ---------------------------------------------------------------- */

      const sunDir = new THREE.Vector3(
        Math.cos(MEADOW_LIGHT.sunElevation) * Math.sin(MEADOW_LIGHT.sunAzimuth),
        Math.sin(MEADOW_LIGHT.sunElevation),
        Math.cos(MEADOW_LIGHT.sunElevation) * Math.cos(MEADOW_LIGHT.sunAzimuth)
      ).normalize();

      const skyMat = new THREE.ShaderMaterial({
        uniforms: {
          uZenith: { value: new THREE.Color(MEADOW.skyZenith) },
          uMid: { value: new THREE.Color(MEADOW.skyMid) },
          uHorizon: { value: new THREE.Color(MEADOW.skyHorizon) },
          uSunGlow: { value: new THREE.Color(MEADOW.skySunGlow) },
          uSunDir: { value: sunDir.clone() },
        },
        vertexShader: /* glsl */ `
          varying vec3 vDir;
          void main() {
            vDir = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform vec3 uZenith;
          uniform vec3 uMid;
          uniform vec3 uHorizon;
          uniform vec3 uSunGlow;
          uniform vec3 uSunDir;
          varying vec3 vDir;
          void main() {
            vec3 d = normalize(vDir);
            float h = clamp(d.y, 0.0, 1.0);
            vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.28, h));
            col = mix(col, uZenith, smoothstep(0.22, 0.85, h));
            float sd = max(dot(d, normalize(uSunDir)), 0.0);
            col += uSunGlow * pow(sd, 6.0) * 0.55;
            col += uSunGlow * pow(sd, 180.0) * 1.4;
            col = mix(col, uHorizon, smoothstep(0.12, -0.02, d.y));
            gl_FragColor = vec4(col, 1.0);
          }
        `,
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
      });
      const sky = new THREE.Mesh(new THREE.SphereGeometry(320, 32, 16), skyMat);
      sky.name = "previewSky";
      scene.add(sky);

      /* ---------------------------------------------------------------- */
      /* Lights (for the preview ground/path only — foliage is ramp-lit)   */
      /* ---------------------------------------------------------------- */

      const sun = new THREE.DirectionalLight(MEADOW.sun, MEADOW_LIGHT.sunIntensity);
      sun.position.copy(sunDir).multiplyScalar(140);
      sun.castShadow = false;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 320;
      sun.shadow.camera.left = -80;
      sun.shadow.camera.right = 80;
      sun.shadow.camera.top = 80;
      sun.shadow.camera.bottom = -80;
      sun.shadow.bias = -0.0004;
      sun.shadow.normalBias = 0.02;
      scene.add(sun);
      scene.add(sun.target);

      const hemi = new THREE.HemisphereLight(MEADOW.ambientSky, MEADOW.ambientGround, MEADOW_LIGHT.hemiIntensity);
      scene.add(hemi);
      scene.add(new THREE.AmbientLight(MEADOW.ambientSky, MEADOW_LIGHT.ambientIntensity));

      /* ---------------------------------------------------------------- */
      /* Preview ground + path + lake                                      */
      /* ---------------------------------------------------------------- */

      function hash2(ix, iz) {
        let h = ix * 374761393 + iz * 668265263;
        h = (h ^ (h >> 13)) * 1274126177;
        h = h ^ (h >> 16);
        return (h & 0x7fffffff) / 0x7fffffff;
      }
      function noise2(x, z) {
        const ix = Math.floor(x);
        const iz = Math.floor(z);
        const fx = x - ix;
        const fz = z - iz;
        const ux = fx * fx * (3 - 2 * fx);
        const uz = fz * fz * (3 - 2 * fz);
        const a = hash2(ix, iz);
        const b = hash2(ix + 1, iz);
        const c = hash2(ix, iz + 1);
        const d = hash2(ix + 1, iz + 1);
        return (a + (b - a) * ux) + ((c + (d - c) * ux) - (a + (b - a) * ux)) * uz;
      }
      function fbm(x, z, oct = 3) {
        let v = 0, amp = 0.5, freq = 1, norm = 0;
        for (let i = 0; i < oct; i++) {
          v += amp * noise2(x * freq, z * freq);
          norm += amp;
          freq *= 2.02;
          amp *= 0.5;
        }
        return v / norm;
      }

      const groundGeo = new THREE.PlaneGeometry(300, 300, 110, 110);
      groundGeo.rotateX(-Math.PI / 2);
      {
        const pos = groundGeo.attributes.position;
        const colors = new Float32Array(pos.count * 3);
        const base = new THREE.Color(MEADOW.grassBase);
        const warm = new THREE.Color(MEADOW.grassWarm);
        const cool = new THREE.Color(MEADOW.grassCool);
        const shadow = new THREE.Color(MEADOW.grassShadow);
        const tip = new THREE.Color(MEADOW.grassTip);
        const edge = new THREE.Color(MEADOW.pathEdge);
        const c = new THREE.Color();
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          const n1 = fbm(x * 0.027 + 11, z * 0.027 - 7, 3);
          const n2 = fbm(x * 0.058 - 3, z * 0.058 + 9, 3);
          c.copy(base);
          c.lerp(warm, Math.max(0, Math.min(1, (n1 - 0.4) / 0.34)) * 0.92);
          c.lerp(cool, Math.max(0, Math.min(1, (n2 - 0.44) / 0.36)) * 0.78);
          c.lerp(tip, 0.08 + fbm(x * 0.14 + 5, z * 0.14 - 2, 2) * 0.12);
          // Woodland shade outside the playable square.
          const sd = Math.max(Math.max(Math.abs(x), Math.abs(z)) - 46, 0);
          c.lerp(shadow, Math.min(1, sd / 34) * 0.45);
          // Soft worn shoulder around the path.
          const pd = pathDistance(x, z);
          if (pd < 6) c.lerp(edge, Math.max(0, 1 - pd / 6) * 0.5);
          colors[i * 3] = c.r;
          colors[i * 3 + 1] = c.g;
          colors[i * 3 + 2] = c.b;
        }
        groundGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      }
      groundGeo.computeVertexNormals();
      const groundMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96, metalness: 0 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.name = "previewGround";
      ground.receiveShadow = true;
      scene.add(ground);

      function buildRibbon(points, closed, width, steps, seedOffset) {
        const curve = new THREE.CatmullRomCurve3(
          points.map((p) => new THREE.Vector3(p[0], 0, p[1])),
          closed,
          "catmullrom",
          0.5
        );
        const verts = [];
        const cols = [];
        const idx = [];
        const pathCol = new THREE.Color(MEADOW.path);
        const edgeCol = new THREE.Color(MEADOW.pathEdge);
        const c = new THREE.Color();
        for (let i = 0; i <= steps; i++) {
          const t = closed ? (i / steps) % 1 : i / steps;
          const p = curve.getPoint(t);
          const tan = curve.getTangent(t);
          const nx = -tan.z;
          const nz = tan.x;
          const wob = Math.sin(i * 0.21 + seedOffset) * 0.22 + Math.sin(i * 0.07 + seedOffset * 2.1) * 0.35;
          const half = width * 0.5 * (1 + Math.sin(i * 0.13 + seedOffset * 1.7) * 0.11);
          const cx = p.x + nx * wob;
          const cz = p.z + nz * wob;
          verts.push(cx + nx * half, 0.022, cz + nz * half);
          verts.push(cx - nx * half, 0.022, cz - nz * half);
          const v = fbm(cx * 0.09 + seedOffset, cz * 0.09 - seedOffset, 2);
          c.copy(pathCol).lerp(edgeCol, (1 - v) * 0.4);
          cols.push(c.r, c.g, c.b, c.r * 0.94, c.g * 0.94, c.b * 0.94);
        }
        for (let i = 0; i < steps; i++) {
          const a = i * 2;
          const b = (i + 1) * 2;
          idx.push(a, b, a + 1, a + 1, b, b + 1);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
        geo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
        geo.setIndex(idx);
        geo.computeVertexNormals();
        return geo;
      }

      const pathMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 1,
        metalness: 0,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
      });
      const pathGroup = new THREE.Group();
      pathGroup.name = "previewPaths";
      const loopMesh = new THREE.Mesh(buildRibbon(LOOP, true, LOOP_WIDTH, 420, 1.7), pathMat);
      loopMesh.receiveShadow = true;
      pathGroup.add(loopMesh);
      for (let s = 0; s < SPOKES.length; s++) {
        const sp = SPOKES[s];
        const mesh = new THREE.Mesh(
          buildRibbon([sp.from, sp.to], false, sp.width ?? 2.9, 90, 4.1 + s * 2.3),
          pathMat
        );
        mesh.receiveShadow = true;
        pathGroup.add(mesh);
      }
      scene.add(pathGroup);

      const lake = new THREE.Mesh(
        new THREE.PlaneGeometry(46, 60),
        new THREE.MeshStandardMaterial({
          color: MEADOW.water,
          roughness: 0.2,
          metalness: 0.05,
          transparent: true,
          opacity: 0.9,
        })
      );
      lake.geometry.rotateX(-Math.PI / 2);
      lake.position.set(-65, 0.012, -3.5);
      lake.name = "previewLake";
      scene.add(lake);

      /* ---------------------------------------------------------------- */
      /* Foliage                                                           */
      /* ---------------------------------------------------------------- */

      const rng = mulberry32(20261017);
      const foliage = createMeadowFoliage({
        rng,
        heightAt,
        pathDistance,
        palette: MEADOW,
        quality,
        seed: 20261017,
        sunDir,
      });
      scene.add(foliage.group);

      /* ---------------------------------------------------------------- */
      /* Camera modes + controls                                           */
      /* ---------------------------------------------------------------- */

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI * 0.492;
      controls.minDistance = 1.2;
      controls.maxDistance = 90;
      controls.target.set(0, 0.9, -0.8);
      controls.enabled = false;

      const MODES = {
        gameplay: {
          pos: new THREE.Vector3(0, 7.4, 10.2),
          target: new THREE.Vector3(0, 1.0, -1.2),
          fov: 58,
        },
        orbit: {
          pos: new THREE.Vector3(27, 16, 27),
          target: new THREE.Vector3(0, 2.6, 0),
          fov: 52,
        },
        close: {
          pos: new THREE.Vector3(2.6, 1.35, 5.0),
          target: new THREE.Vector3(0.2, 0.5, 1.2),
          fov: 55,
        },
      };

      let mode = "gameplay";
      function setMode(next) {
        mode = next;
        const m = MODES[next];
        camera.fov = m.fov;
        camera.position.copy(m.pos);
        controls.target.copy(m.target);
        controls.enabled = next === "orbit";
        camera.lookAt(m.target);
        camera.updateProjectionMatrix();
        if (next === "orbit") controls.update();
      }
      setMode("gameplay");

      window.addEventListener("keydown", (e) => {
        if (e.key === "1") setMode("gameplay");
        else if (e.key === "2") setMode("orbit");
        else if (e.key === "3") setMode("close");
        else if (e.key === "h" || e.key === "H") {
          const hud = document.getElementById("hud");
          hud.style.display = hud.style.display === "none" ? "" : "none";
        }
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      /* ---------------------------------------------------------------- */
      /* HUD + loop                                                        */
      /* ---------------------------------------------------------------- */

      const el = {
        instances: document.getElementById("s-instances"),
        calls: document.getElementById("s-calls"),
        tris: document.getElementById("s-tris"),
        trees: document.getElementById("s-trees"),
        flowers: document.getElementById("s-flowers"),
        fps: document.getElementById("s-fps"),
        status: document.getElementById("status"),
      };

      function fmt(n) {
        return n.toLocaleString("en-US");
      }

      el.instances.textContent = fmt(foliage.stats.instances);
      el.trees.textContent = `${foliage.stats.trees} / ${fmt(foliage.stats.grassClumps)}`;
      el.flowers.textContent = `${fmt(foliage.stats.flowers)} / ${foliage.stats.shrubs}`;

      const clock = new THREE.Clock();
      let elapsed = 0;
      let frames = 0;
      let fpsTime = 0;
      let fps = 0;
      let ready = false;

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        if (!freeze) elapsed += dt;

        foliage.update(freeze ? 2.0 : elapsed, dt);
        if (mode === "orbit") controls.update();

        renderer.render(scene, camera);

        frames += 1;
        fpsTime += dt;
        if (fpsTime > 0.35) {
          fps = Math.round(frames / fpsTime);
          frames = 0;
          fpsTime = 0;
          el.fps.textContent = String(fps);
          el.calls.textContent = `${renderer.info.render.calls} / ${foliage.stats.drawCalls}`;
          el.tris.textContent = `${fmt(renderer.info.render.triangles)}`;
        }

        if (!ready) {
          ready = true;
          window.__foliageReady = true;
          el.status.textContent = `READY · ${fmt(foliage.stats.triangles)} tris · ${foliage.stats.drawCalls} batches`;
        }
      }

      window.__foliage = foliage;
      window.__THREE = THREE;
      window.__scene = scene;
      window.__camera = camera;
      window.__renderer = renderer;
      window.__pathGroup = pathGroup;
      animate();
    </script>
  </body>
</html>
