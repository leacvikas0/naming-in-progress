<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>asset gallery</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e6eee2; overflow: hidden; }
      canvas { display: block; }
      #hud { position: fixed; left: 10px; top: 8px; font: 11px/1.45 monospace; color: #14301f; white-space: pre; text-shadow: 0 1px 0 #fff; }
    </style>
    <script type="importmap">
      { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <div id="hud">loading catalog…</div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const PICKS = [
        ["kaykit-forest-free", [
          "Tree_1_A_Color1.gltf", "Tree_2_A_Color1.gltf", "Tree_2_C_Color1.gltf",
          "Tree_3_A_Color1.gltf", "Tree_4_A_Color1.gltf", "Tree_4_C_Color1.gltf",
          "Bush_2_A_Color1.gltf", "Bush_2_C_Color1.gltf", "Bush_4_B_Color1.gltf",
          "Grass_1_B_Color1.gltf", "Grass_2_A_Color1.gltf",
          "Rock_1_C_Color1.gltf", "Rock_2_B_Color1.gltf",
        ]],
        ["quaternius-stylized-nature-standard", [
          "Flower_3_Group.gltf", "Flower_4_Group.gltf", "Fern_1.gltf",
          "Clover_1.gltf", "Bush_Common_Flowers.gltf", "Pebble_Round_1.gltf",
        ]],
        ["kenney-fantasy-town", [
          "wall-arch.glb", "wall-arch-top.glb", "wall-broken.glb", "pillar-stone.glb",
          "rock-large.glb", "stairs-stone.glb", "wall-doorway-square.glb",
        ]],
        ["kenney-castle", [
          "wall-pillar.glb", "rocks-large.glb", "tower-square-arch.glb", "stairs-stone.glb",
        ]],
        ["kenney-survival", [
          "tent.glb", "bedroll.glb", "box-large.glb", "campfire-pit.glb",
          "barrel.glb", "signpost.glb", "chest.glb",
        ]],
        ["kenney-nature", [
          "rock_smallA.glb", "rock_largeA.glb", "lily_small.glb", "log.glb",
        ]],
        ["kaykit-dungeon", [
          "wall_arched.gltf.glb", "column.gltf.glb", "coin.gltf.glb",
        ]],
      ];

      const hud = document.getElementById("hud");
      const catalog = await (await fetch("/catalog/index.json")).json();
      const byPack = new Map();
      for (const a of catalog.assets) {
        if (!byPack.has(a.pack)) byPack.set(a.pack, new Map());
        byPack.get(a.pack).set(a.url.split("/").pop().toLowerCase(), a.url);
      }

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe6eee2);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x94a68c, 2.4));
      const sun = new THREE.DirectionalLight(0xfff3dc, 2.2);
      sun.position.set(6, 10, 8);
      scene.add(sun);
      scene.add(new THREE.GridHelper(500, 250, 0xa9b8a6, 0xccd6c8));

      const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 1200);
      const loader = new GLTFLoader();
      const load = (u) => loader.loadAsync(u).then((g) => g.scene).catch((e) => { console.warn("FAIL", u, e.message); return null; });
      const box = new THREE.Box3();
      const lines = [];
      let maxX = -999;

      let z = -30;
      for (const [pack, names] of PICKS) {
        const table = byPack.get(pack) || new Map();
        let x = -62;
        lines.push(`== ${pack}`);
        for (const name of names) {
          const url = table.get(name.toLowerCase());
          if (!url) { lines.push(`  MISSING ${name}`); continue; }
          const root = await load(url);
          if (!root) { lines.push(`  FAILED ${name}`); continue; }
          box.setFromObject(root);
          const size = box.getSize(new THREE.Vector3());
          root.position.set(x, -box.min.y, z);
          scene.add(root);
          const ref = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.9, 0.14), new THREE.MeshBasicMaterial({ color: 0xd23b3b }));
          ref.position.set(x - 0.55, 0.95, z);
          scene.add(ref);
          lines.push(`  ${name}  H=${size.y.toFixed(2)} W=${size.x.toFixed(2)} D=${size.z.toFixed(2)}`);
          maxX = Math.max(maxX, x + size.x);
          x += Math.max(size.x, 1.0) + 1.3;
        }
        z += 10;
      }

      hud.textContent = lines.join("\n");

      const cx = (maxX - 62) / 2;
      camera.position.set(cx, 26, z + 14);
      camera.lookAt(new THREE.Vector3(cx, 2, -30 + (z + 30) / 2));
      renderer.render(scene, camera);
      window.__ready = lines;
    </script>
  </body>
</html>
