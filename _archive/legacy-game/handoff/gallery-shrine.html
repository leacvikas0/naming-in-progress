<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>shrine options</title>
    <style>
      html, body { margin: 0; height: 100%; background: #cfe3e8; overflow: hidden; }
      canvas { display: block; }
      #hud { position: fixed; left: 10px; top: 8px; font: 12px/1.5 monospace; color: #14301f; white-space: pre; }
    </style>
    <script type="importmap">
      { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <div id="hud">loading…</div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const catalog = await (await fetch("/catalog/index.json")).json();
      const byPack = new Map();
      for (const a of catalog.assets) {
        if (!byPack.has(a.pack)) byPack.set(a.pack, new Map());
        byPack.get(a.pack).set(a.url.split("/").pop().toLowerCase(), a.url);
      }
      const url = (pack, name) => (byPack.get(pack) || new Map()).get(name.toLowerCase());
      const loader = new GLTFLoader();
      const cache = new Map();
      async function put(pack, name, scale, x, y, z, rotY = 0) {
        const u = url(pack, name);
        if (!u) { console.warn("missing", pack, name); return null; }
        if (!cache.has(u)) cache.set(u, await loader.loadAsync(u).then((g) => g.scene).catch((e) => { console.warn("fail", u, e.message); return null; }));
        const src = await cache.get(u);
        if (!src) return null;
        const root = src.clone(true);
        root.scale.setScalar(scale);
        root.position.set(x, y, z);
        root.rotation.y = rotY;
        scene.add(root);
        return root;
      }

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xcfe3e8);
      scene.fog = new THREE.Fog(0xcfe3e8, 55, 120);
      scene.add(new THREE.HemisphereLight(0xdff0ff, 0x8a9a70, 1.9));
      const sun = new THREE.DirectionalLight(0xfff0d0, 2.8);
      sun.position.set(10, 16, 8);
      scene.add(sun);
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x93c070, roughness: 1 }));
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const stone = (w, h, d, color, x, y, z) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.92 }));
        m.position.set(x, y, z);
        scene.add(m);
        return m;
      };
      const heroAt = (x, z) => {
        const h = new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 1.15, 4, 12), new THREE.MeshStandardMaterial({ color: 0xd23b3b }));
        h.position.set(x, 0.95, z);
        scene.add(h);
      };

      // ---------- VARIANT 1: dungeon arch, x=0 ----------
      await put("kaykit-dungeon", "wall_arched.gltf.glb", 1.5, 0, 0, -2, 0);
      await put("kenney-fantasy-town", "pillar-stone.glb", 3.4, -5.2, 0, -2);
      await put("kenney-fantasy-town", "pillar-stone.glb", 3.4, 5.2, 0, -2);
      await put("kenney-fantasy-town", "pillar-stone.glb", 1.9, -6.4, 0, 2.4, 0.4); // broken stub
      stone(1.7, 0.5, 1.2, 0xd9d0b4, 0, 0.25, 3.2);
      stone(2.1, 0.13, 1.6, 0xcfc6a8, 0, 0.065, 3.2);
      await put("kaykit-forest-free", "Tree_2_C_Color1.gltf", 1.35, 1.5, 0, -8);
      await put("kenney-fantasy-town", "wall-broken.glb", 2.6, -8.6, 0, -1.2, 0.5);
      heroAt(0, 6.5);

      // ---------- VARIANT 2: fantasy arch-top, x=26 ----------
      await put("kenney-fantasy-town", "wall-arch-top.glb", 3.2, 26, 3.2, -2, Math.PI / 2);
      await put("kenney-fantasy-town", "pillar-stone.glb", 3.2, 24.2, 0, -2);
      await put("kenney-fantasy-town", "pillar-stone.glb", 3.2, 27.8, 0, -2);
      await put("kenney-fantasy-town", "pillar-stone.glb", 1.6, 29.4, 0, 2.6, 0.3);
      stone(1.6, 0.45, 1.1, 0xd9d0b4, 26, 0.225, 3.0);
      await put("kaykit-forest-free", "Tree_2_C_Color1.gltf", 1.35, 27.4, 0, -8);
      await put("kenney-fantasy-town", "wall-broken.glb", 2.4, 18.5, 0, 0.6, -0.4);
      heroAt(26, 6.5);

      // ---------- VARIANT 3: castle tower arch, x=52 ----------
      await put("kenney-castle", "tower-square-arch.glb", 3.2, 52, 0, -2);
      await put("kenney-castle", "wall-pillar.glb", 3.2, 47.2, 0, -2);
      await put("kenney-castle", "wall-pillar.glb", 3.2, 56.8, 0, -2);
      await put("kenney-castle", "wall-half.glb", 3.2, 45.0, 0, 1.4, 0.2);
      stone(1.6, 0.45, 1.1, 0xd9d0b4, 52, 0.225, 3.0);
      await put("kaykit-forest-free", "Tree_2_C_Color1.gltf", 1.35, 53.4, 0, -8);
      heroAt(52, 6.5);

      document.getElementById("hud").textContent =
        "V1 dungeon arch (x=0) | V2 fantasy arch-top (x=26) | V3 castle tower arch (x=52) — red capsule = hero 1.9m";

      const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
      // gameplay-ish camera: ~3.2m high, 8m back, looking slightly down
      camera.position.set(26, 3.6, 14.5);
      camera.lookAt(new THREE.Vector3(26, 1.4, -1));
      renderer.render(scene, camera);
      window.__ready = true;
    </script>
  </body>
</html>
