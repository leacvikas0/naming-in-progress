<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>structure closeup</title>
    <style>
      html, body { margin: 0; height: 100%; background: #dfe9d8; overflow: hidden; }
      canvas { display: block; }
      #hud { position: fixed; left: 10px; top: 8px; font: 12px/1.5 monospace; color: #14301f; white-space: pre; }
    </style>
    <script type="importmap">
      { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <div id="hud">loading…</div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const PICKS = [
        ["kenney-fantasy-town", ["wall-arch.glb", "wall-arch-top.glb", "wall-broken.glb", "pillar-stone.glb", "wall-doorway-square.glb", "stairs-stone.glb"]],
        ["kenney-castle", ["wall-pillar.glb", "tower-square-arch.glb", "stairs-stone.glb", "rocks-large.glb"]],
        ["kenney-survival", ["tent.glb", "bedroll.glb", "box-large.glb", "campfire-pit.glb", "barrel.glb", "signpost.glb"]],
        ["kaykit-dungeon", ["wall_arched.gltf.glb", "column.gltf.glb"]],
      ];
      // Structures are authored on a 1 m Kenney grid; scale up so a doorway reads ~2.4 m.
      const SCALE = 3.0;

      const hud = document.getElementById("hud");
      const catalog = await (await fetch("/catalog/index.json")).json();
      const byPack = new Map();
      for (const a of catalog.assets) {
        if (!byPack.has(a.pack)) byPack.set(a.pack, new Map());
        byPack.get(a.pack).set(a.url.split("/").pop().toLowerCase(), a.url);
      }

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xdfe9d8);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x9aac92, 2.2));
      const sun = new THREE.DirectionalLight(0xfff3dc, 2.4);
      sun.position.set(5, 9, 7);
      scene.add(sun);
      scene.add(new THREE.GridHelper(200, 100, 0xa9b8a6, 0xccd6c8));

      const loader = new GLTFLoader();
      const load = (u) => loader.loadAsync(u).then((g) => g.scene).catch((e) => { console.warn("FAIL", u, e.message); return null; });
      const box = new THREE.Box3();
      const lines = [];
      const all = [];

      let x = -14;
      let row = 0;
      let z = 0;
      for (const [pack, names] of PICKS) {
        const table = byPack.get(pack) || new Map();
        x = -14;
        z = row * 7;
        lines.push(`== ${pack} (scaled x${SCALE})`);
        for (const name of names) {
          const url = table.get(name.toLowerCase());
          if (!url) { lines.push(`  MISSING ${name}`); continue; }
          const root = await load(url);
          if (!root) { lines.push(`  FAILED ${name}`); continue; }
          root.scale.setScalar(SCALE);
          box.setFromObject(root);
          const size = box.getSize(new THREE.Vector3());
          root.position.set(x, -box.min.y, z);
          scene.add(root);
          const ref = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.9, 0.16), new THREE.MeshBasicMaterial({ color: 0xd23b3b }));
          ref.position.set(x - 0.7, 0.95, z + 0.9);
          scene.add(ref);
          lines.push(`  ${name}  H=${size.y.toFixed(2)} W=${size.x.toFixed(2)} D=${size.z.toFixed(2)}`);
          all.push(root);
          x += Math.max(size.x, 1.2) + 1.6;
        }
        row++;
      }

      hud.textContent = lines.join("\n");
      const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);
      camera.position.set(0, 9, z + 20);
      camera.lookAt(new THREE.Vector3(0, 2, z / 2));
      renderer.render(scene, camera);
      window.__ready = lines;
    </script>
  </body>
</html>
