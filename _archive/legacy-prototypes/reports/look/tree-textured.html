<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hero trees — painted clump cards</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#cfe3d8; }
  canvas { display:block; }
  #hud { position:fixed; left:14px; bottom:14px; z-index:10; font:11px/1.55 ui-monospace,monospace; color:#f2fbf6; background:rgba(12,30,24,0.78); border:1px solid rgba(200,240,210,0.18); border-radius:10px; padding:9px 12px; white-space:pre; pointer-events:none; }
  #hud b { color:#c1dc79; }
  #keys { position:fixed; right:14px; top:14px; z-index:10; font:11px/1.6 ui-monospace,monospace; color:#f2fbf6; background:rgba(12,30,24,0.78); border:1px solid rgba(200,240,210,0.18); border-radius:10px; padding:8px 11px; pointer-events:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@dgreenheck/ez-tree": "/node_modules/@dgreenheck/ez-tree/build/ez-tree.es.js"
  }
}
</script>
</head>
<body>
<div id="keys">1 close 25 m · 2 gameplay 46 m · 3 far 70 m · 4 side</div>
<div id="hud">building…</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createAnimeTree } from "/game/src/map/port/anime-tree-kit.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd6ece4);
scene.fog = new THREE.Fog(0xd6ece4, 90, 220);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.497;
controls.target.set(0, 6, -40);

scene.add(new THREE.HemisphereLight(0xdfeaff, 0x5f6b4e, 1.1));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(-30, 60, 40);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(160, 64),
  new THREE.MeshStandardMaterial({ color: 0xa8c47c, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
scene.add(ground);

const loader = new THREE.TextureLoader();
const texA = loader.load("/game/src/map/textures/leaf-clump-a.png");
const texB = loader.load("/game/src/map/textures/leaf-clump-b.png");
for (const t of [texA, texB]) {
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
}

const VARIANTS = [
  { name: "Oak Medium", preset: "Oak Medium", seed: 11, tex: texA, leafCount: 70, leafSize: 1.1 },
  { name: "Oak Large",  preset: "Oak Large",  seed: 23, tex: texB, leafCount: 70, leafSize: 1.15 },
  { name: "Ash Large",  preset: "Ash Large",  seed: 37, tex: texA, leafCount: 80, leafSize: 1.05 },
  { name: "Aspen Large", preset: "Aspen Large", seed: 41, tex: texB, leafCount: 70, leafSize: 1.1 },
];

const trees = [];
VARIANTS.forEach((v, i) => {
  const t = createAnimeTree({
    seed: v.seed,
    preset: v.preset,
    palette: "summer",
    height: 12.5,
    leafSize: v.leafSize,
    leafCount: v.leafCount,
    leafTexture: v.tex,
  });
  t.group.position.set(-21 + i * 14, 0, -40);
  scene.add(t.group);
  trees.push({ ...v, ...t, tri: t.stats.triangles });
});

const VIEWS = {
  close:    { pos: [0, 5, -15], target: [0, 6, -40] },
  gameplay: { pos: [0, 7, 6],   target: [0, 6, -40] },
  far:      { pos: [0, 10, 30], target: [0, 6, -40] },
  side:     { pos: [0, 6, -40], target: [0, 6, -40] },
};
function applyView(name) {
  const v = VIEWS[name] || VIEWS.gameplay;
  camera.position.set(...v.pos);
  controls.target.set(...v.target);
  controls.update();
}
applyView(new URLSearchParams(location.search).get("view") || "gameplay");

addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "1") applyView("close");
  if (k === "2") applyView("gameplay");
  if (k === "3") applyView("far");
  if (k === "4") applyView("side");
});

const hud = document.getElementById("hud");
function updateHud() {
  const rows = trees.map((t, i) => `${i}: ${t.name.padEnd(11)} ${String(t.tri).padStart(6)} tris  ${t.leafCount} cards`).join("\n");
  hud.innerHTML = `<b>left → right: 0 1 2 3</b>\n${rows}\n<b>scene</b> ${renderer.info.render.triangles} tris · ${renderer.info.render.calls} draws`;
}

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  for (const tr of trees) tr.update(t);
  controls.update();
  renderer.render(scene, camera);
  updateHud();
  requestAnimationFrame(frame);
}
frame();

window.__trees = { scene, camera, renderer, trees, applyView, controls };
</script>
</body>
</html>
