<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Our tree — original camera</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f5}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createAnimeFlowerTree } from "/game/src/map/port/anime-flower-tree.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3f5);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 6.2, 16.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5.2, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

// Same lights as the source page
scene.add(new THREE.HemisphereLight(0xa6d8ff, 0x7cb342, 1.1));
const sunDir = new THREE.Vector3(0.55, 0.78, 0.45).normalize();
const dir = new THREE.DirectionalLight(0xfff5e0, 2.2);
dir.position.copy(sunDir).multiplyScalar(25);
dir.castShadow = true;
dir.shadow.mapSize.set(1024, 1024);
scene.add(dir);

// Ground like the source page
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(65, 64),
  new THREE.MeshStandardMaterial({ color: 0x8cc63f, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const tree = createAnimeFlowerTree({
  seed: 42,
  leafCount: 4600,
  flowerCount: 1450,
  natural: true,
});
tree.group.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(tree.group);

function frame() {
  tree.update(performance.now() / 1000);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

window.__solo = { scene, camera, renderer, tree, controls };
</script>
</body>
</html>
