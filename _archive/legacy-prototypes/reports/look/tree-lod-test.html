<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hero tree — LOD test</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#cfe3d8; }
  canvas { display:block; }
  #hud { position:fixed; left:14px; bottom:14px; z-index:10; font:11px/1.55 ui-monospace,monospace; color:#f2fbf6; background:rgba(12,30,24,0.78); border:1px solid rgba(200,240,210,0.18); border-radius:10px; padding:9px 12px; white-space:pre; pointer-events:none; }
  #hud b { color:#c1dc79; }
  #keys { position:fixed; right:14px; top:14px; z-index:10; font:11px/1.6 ui-monospace,monospace; color:#f2fbf6; background:rgba(12,30,24,0.78); border:1px solid rgba(200,240,210,0.18); border-radius:10px; padding:8px 11px; pointer-events:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@dgreenheck/ez-tree": "/node_modules/@dgreenheck/ez-tree/build/ez-tree.es.js"
  }
}
</script>
</head>
<body>
<div id="keys">1 close 25 m · 2 gameplay 46 m · 3 far 70 m · 4 side</div>
<div id="hud">building…</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createAnimeTree } from "/game/src/map/port/anime-tree-kit.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe3d8);
scene.fog = new THREE.Fog(0xcfe3d8, 90, 220);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.497;
controls.target.set(0, 6, -40);

const hemi = new THREE.HemisphereLight(0xdfeaff, 0x5f6b4e, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(-30, 60, 40);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(160, 64),
  new THREE.MeshStandardMaterial({ color: 0x9fbe78, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
scene.add(ground);

// L0..L3 left -> right. The whole point: fewer, bigger cards + single billboard
// + thinner branches, so the silhouette and leaf-cloud volume survive.
const LEVELS = [
  { name: "L0 150 leaves", leafCount: 150, leafSize: 0.5, billboard: "double", branchDetail: 1.0 },
  { name: "L1 90 leaves",  leafCount: 90,  leafSize: 0.7, billboard: "double", branchDetail: 0.85 },
  { name: "L2 50 leaves",  leafCount: 50,  leafSize: 1.0, billboard: "double", branchDetail: 0.7 },
  { name: "L3 24 leaves",  leafCount: 24,  leafSize: 1.4, billboard: "single", branchDetail: 0.55 },
];

const trees = [];
LEVELS.forEach((lvl, i) => {
  const t = createAnimeTree({
    seed: 20261017,
    preset: "Oak Medium",
    palette: "summer",
    height: 12.5,
    leafSize: lvl.leafSize,
    leafCount: lvl.leafCount,
    billboard: lvl.billboard,
    branchDetail: lvl.branchDetail,
  });
  t.group.position.set(-21 + i * 14, 0, -40);
  scene.add(t.group);
  trees.push({ ...lvl, ...t, tri: t.stats.triangles });
});

const VIEWS = {
  close:    { pos: [0, 5, -15], target: [0, 6, -40] },
  gameplay: { pos: [0, 7, 6],   target: [0, 6, -40] },
  far:      { pos: [0, 10, 30], target: [0, 6, -40] },
  side:     { pos: [0, 6, -40], target: [0, 6, -40] },
};
function applyView(name) {
  const v = VIEWS[name] || VIEWS.gameplay;
  camera.position.set(...v.pos);
  controls.target.set(...v.target);
  controls.update();
}
applyView(new URLSearchParams(location.search).get("view") || "gameplay");

addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "1") applyView("close");
  if (k === "2") applyView("gameplay");
  if (k === "3") applyView("far");
  if (k === "4") applyView("side");
});

const hud = document.getElementById("hud");
function updateHud() {
  const rows = trees.map((t, i) => `${i}: ${t.name.padEnd(9)} ${String(t.tri).padStart(5)} tris  ${t.leafCount} cards × ${t.leafSize}`).join("\n");
  hud.innerHTML = `<b>left → right: L0 L1 L2 L3</b>\n${rows}\n<b>scene</b> ${renderer.info.render.triangles} tris · ${renderer.info.render.calls} draws`;
}

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  for (const tr of trees) tr.update(t);
  controls.update();
  renderer.render(scene, camera);
  updateHud();
  requestAnimationFrame(frame);
}
frame();

window.__lod = { scene, camera, renderer, trees, applyView, controls };
</script>
</body>
</html>
