<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>meadow-kit preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #dbe8ca;
        overflow: hidden;
        font: 12px/1.4 ui-monospace, monospace;
        color: #2c3a22;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        padding: 8px 10px;
        background: #ffffffcc;
        border-radius: 6px;
        white-space: pre;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">loading…</div>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { resolveConfig } from "../src/core/config.js";
      import { createWind } from "../src/core/wind.js";
      import { createMaterialFactory } from "../src/core/materials.js";
      import { finalizeGeometry, triangleCount } from "../src/core/geom.js";
      import { groundCol, lightCol } from "../src/core/palette.js";

      const params = new URLSearchParams(location.search);
      const id = params.get("species") || "daisy";
      const scale = Number(params.get("scale") || 0.3);
      const seed = Number(params.get("seed") || 1234);
      const spin = params.get("spin") !== "0";
      const num = (k, d) => (params.has(k) ? Number(params.get(k)) : d);
      const camPos = [num("cx", 0.26), num("cy", 0.3), num("cz", 0.42)];
      const camTarget = [num("tx", 0), num("ty", 0.18), num("tz", 0)];
      const camFov = num("fov", 38);
      const wire = params.get("wire") === "1";

      const config = resolveConfig({});
      const wind = createWind(config);
      const materials = createMaterialFactory({ config, wind });

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = config.palette.light.exposure;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = lightCol("background");
      scene.fog = new THREE.Fog(lightCol("fog"), 1.2, 6);

      const camera = new THREE.PerspectiveCamera(camFov, innerWidth / innerHeight, 0.01, 50);
      camera.position.set(camPos[0], camPos[1], camPos[2]);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(camTarget[0], camTarget[1], camTarget[2]);
      controls.enableDamping = true;
      controls.update();

      // lighting
      const L = config.palette.light;
      const sun = new THREE.DirectionalLight(lightCol("sun"), L.sunIntensity);
      const el = THREE.MathUtils.degToRad(L.sunElevation);
      const az = THREE.MathUtils.degToRad(L.sunAzimuth);
      sun.position.set(Math.cos(el) * Math.sin(az) * 10, Math.sin(el) * 10, Math.cos(el) * Math.cos(az) * 10);
      scene.add(sun);
      scene.add(new THREE.HemisphereLight(lightCol("sky"), lightCol("groundBounce"), L.hemiIntensity));
      scene.add(new THREE.AmbientLight(lightCol("ambient"), L.ambientIntensity));

      // ground reference disc
      const disc = new THREE.Mesh(
        new THREE.CircleGeometry(0.6, 48),
        new THREE.MeshStandardMaterial({ color: groundCol("grassMid"), roughness: 1 })
      );
      disc.rotation.x = -Math.PI / 2;
      disc.position.y = -0.001;
      scene.add(disc);

      const hud = document.getElementById("hud");
      let root = null;

      try {
        const mod = await import(`../src/foliage/${id}.js`);
        const spec = mod.spec;
        const geo = finalizeGeometry(spec.build({ seed, config }));
        const mat = materials.get(spec.material, {});
        if (wire) {
          mat.wireframe = true;
          mat.side = THREE.DoubleSide;
        }
        root = new THREE.Mesh(geo, mat);
        root.scale.setScalar(scale);
        scene.add(root);

        hud.textContent = [
          `${spec.id}  (${spec.label})`,
          `tris      ${triangleCount(geo)}`,
          `height    ${spec.scale[0]}-${spec.scale[1]} m`,
          `material  ${spec.material}`,
          `scale     ${scale} m`,
          spin ? "drag to orbit" : "",
        ]
          .filter(Boolean)
          .join("\n");
      } catch (err) {
        hud.textContent = `failed to load "${id}"\n${err.message}`;
        console.error(err);
      }

      const clock = new THREE.Clock();
      function frame() {
        const t = clock.getElapsedTime();
        wind.update(t);
        if (root && spin) root.rotation.y = t * 0.35;
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }
      frame();

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      window.__MEADOW_PREVIEW__ = { id, ready: true };
      document.title = `ready:${id}`;
    </script>
  </body>
</html>
