<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dreamy meadow · meadow-kit</title>
    <style>
      :root {
        --paper: #f2ecdd;
        --ink: #2e3a27;
        --muted: #6b7660;
        --line: #b9b09a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #cfe0bd;
        color: var(--ink);
        font: 12px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      canvas { display: block; }
      #panel {
        position: fixed;
        left: 16px;
        top: 16px;
        width: 268px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 14px 14px 12px;
        box-shadow: 0 10px 28px rgba(48, 56, 34, 0.16);
      }
      #panel h1 {
        margin: 0 0 2px;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 600;
      }
      #panel .sub {
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        border-top: 1px dashed #cec6b1;
      }
      .row:first-of-type { border-top: 0; }
      .row label { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; }
      select, input[type="number"] {
        font: inherit;
        font-size: 11px;
        color: var(--ink);
        background: #fbf7ec;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 2px 5px;
        width: 96px;
      }
      button {
        font: inherit;
        font-size: 11px;
        color: var(--ink);
        background: #fbf7ec;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 3px;
        padding: 3px 9px;
        cursor: pointer;
      }
      button:hover { background: #f0e9d8; }
      button:active { border-bottom-width: 1px; transform: translateY(1px); }
      #stats {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
        white-space: pre;
      }
      #stats b { color: var(--ink); font-weight: 600; }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #cfe0bd;
        color: #46523a;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        z-index: 50;
        transition: opacity 0.4s ease;
      }
      #loading.gone { opacity: 0; pointer-events: none; }
      #hint {
        position: fixed;
        right: 16px;
        bottom: 14px;
        color: #4d5942;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(242, 236, 221, 0.72);
        padding: 3px 8px;
        border-radius: 3px;
      }
      #error {
        position: fixed;
        inset: auto 16px 16px 16px;
        background: #f6dede;
        border: 1px solid #c99;
        border-radius: 4px;
        padding: 10px 12px;
        color: #5a2222;
        font-size: 11px;
        white-space: pre-wrap;
        display: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="loading">growing meadow…</div>

    <div id="panel">
      <h1>Dreamy Meadow</h1>
      <div class="sub">meadow-kit · modular foliage</div>

      <div class="row">
        <label>quality</label>
        <select id="quality">
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high" selected>high</option>
          <option value="ultra">ultra</option>
        </select>
      </div>
      <div class="row">
        <label>seed</label>
        <input id="seed" type="number" value="20261018" step="1" />
      </div>
      <div class="row">
        <label>wind</label>
        <button id="wind">on</button>
      </div>
      <div class="row">
        <label>&nbsp;</label>
        <button id="regen">regrow</button>
      </div>

      <div id="stats">building…</div>
    </div>

    <div id="hint">drag orbit · wheel zoom</div>
    <div id="error"></div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { createMeadow } from "./src/index.js";
      import { createEnvironment } from "./src/core/environment.js";
      import { DEFAULT_RECIPE } from "./src/core/config.js";

      const $ = (id) => document.getElementById(id);
      const loading = $("loading");
      const errBox = $("error");

      function fail(err) {
        console.error(err);
        errBox.style.display = "block";
        errBox.textContent = `meadow failed to build\n\n${err.message}`;
        loading.classList.add("gone");
      }

      // ---------------------------------------------------------------- renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 400);
      const cam = DEFAULT_RECIPE.camera;
      camera.position.set(...cam.position);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(...cam.target);
      controls.enableDamping = true;
      controls.dampingFactor = 0.075;
      controls.maxPolarAngle = Math.PI * 0.495;
      controls.minDistance = 1.2;
      controls.maxDistance = 42;
      controls.update();

      // ---------------------------------------------------------------- build
      let meadow = null;
      let environment = null;
      let windOn = true;
      let clock = new THREE.Clock();

      async function build() {
        loading.classList.remove("gone");
        errBox.style.display = "none";
        try {
          if (meadow) {
            meadow.dispose();
            meadow = null;
          }
          if (environment) {
            environment.dispose();
            environment = null;
          }

          const quality = $("quality").value;
          const seed = Number($("seed").value) || 1;

          const t0 = performance.now();
          meadow = await createMeadow({ scene, seed, quality });
          const ms = Math.round(performance.now() - t0);

          environment = createEnvironment(meadow.config);
          environment.configureRenderer(renderer);
          environment.apply(scene);

          const s = meadow.stats();
          $("stats").innerHTML =
            `<b>${s.instances.toLocaleString()}</b> instances\n` +
            `<b>${(s.triangles / 1000).toFixed(0)}k</b> triangles\n` +
            `<b>${s.drawCalls}</b> draw calls\n` +
            `<b>${ms}</b> ms build · seed ${s.seed}\n\n` +
            s.species
              .map((sp) => `${sp.id.padEnd(12)} ${String(sp.instances).padStart(6)}  ${String(sp.trisPerInstance).padStart(5)} tri`)
              .join("\n");

          renderer.toneMappingExposure = meadow.config.palette.light.exposure;
          loading.classList.add("gone");
          document.title = "ready:meadow";
          window.__MEADOW_READY__ = true;
        } catch (err) {
          fail(err);
        }
      }

      // ---------------------------------------------------------------- loop
      function frame() {
        const t = clock.getElapsedTime();
        if (meadow) {
          if (windOn) meadow.update(t, camera);
          else meadow.update(0, camera);
        }
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      $("regen").addEventListener("click", build);
      $("quality").addEventListener("change", build);
      $("seed").addEventListener("change", build);
      $("wind").addEventListener("click", () => {
        windOn = !windOn;
        $("wind").textContent = windOn ? "on" : "off";
      });

      build();
      frame();
    </script>
  </body>
</html>
