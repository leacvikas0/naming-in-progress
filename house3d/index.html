<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Red Roof House — three.js</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #2b1c11;
        --cream: #f7ecd8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bfe0f2;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
      }
      #scene { display: block; width: 100%; height: 100%; }

      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(43, 26, 14, 0.22) 100%);
      }

      .brand {
        position: fixed;
        top: 24px;
        left: 28px;
        pointer-events: none;
        user-select: none;
        text-shadow: 0 1px 0 rgba(255, 250, 240, 0.55);
      }
      .brand .kicker {
        margin: 0 0 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(60, 38, 22, 0.72);
      }
      .brand h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 600;
        font-size: clamp(22px, 3.1vw, 38px);
        letter-spacing: 0.015em;
        line-height: 1;
        color: #33200f;
      }
      .brand p {
        margin: 8px 0 0;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: rgba(58, 36, 20, 0.66);
      }

      .hint {
        position: fixed;
        left: 28px;
        bottom: 24px;
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(50, 31, 16, 0.62);
        text-shadow: 0 1px 0 rgba(255, 250, 240, 0.5);
        user-select: none;
        pointer-events: none;
      }

      .dock {
        position: fixed;
        right: 24px;
        bottom: 22px;
        display: flex;
        gap: 8px;
      }
      .dock button {
        appearance: none;
        border: 1px solid rgba(60, 38, 22, 0.18);
        background: rgba(250, 244, 231, 0.68);
        color: #3a2414;
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 9px 14px;
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: background 160ms ease, transform 160ms ease, border-color 160ms ease;
      }
      .dock button:hover { background: rgba(255, 249, 238, 0.92); transform: translateY(-1px); }
      .dock button[aria-pressed="true"] {
        background: #3a2414;
        border-color: #3a2414;
        color: #f7ecd8;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #cfe8f7 0%, #eef6f0 100%);
        z-index: 10;
        transition: opacity 500ms ease;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading span {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(58, 36, 20, 0.7);
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 32px;
        background: #f3ead8;
        z-index: 20;
        text-align: center;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "../node_modules/three/build/three.module.js",
          "three/addons/": "../node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="vignette"></div>

    <header class="brand">
      <p class="kicker">three.js study</p>
      <h1>Red Roof House</h1>
      <p>cel-shaded medieval cottage</p>
    </header>

    <p class="hint">drag to orbit &middot; scroll to zoom &middot; 1–6 camera views</p>

    <div class="dock">
      <button id="turntable" type="button" aria-pressed="false">Turntable</button>
      <button id="outlines" type="button" aria-pressed="true">Outlines</button>
    </div>

    <div id="loading"><span>Building the house</span></div>
    <div id="fatal"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
