<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amarante · Phase 4 Enemy Asset Audition Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f131d;
      --panel: rgba(20, 25, 38, 0.88);
      --border: rgba(212, 175, 106, 0.35);
      --gold: #f5d07e;
      --rose: #fb7185;
      --text: #f3efe6;
      --muted: #9aa3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: grid;
      grid-template-columns: 330px 1fr;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      backdrop-filter: blur(12px);
      z-index: 10;
    }
    header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 17px;
      letter-spacing: 0.06em;
      color: var(--gold);
      margin-bottom: 4px;
    }
    header p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .model-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cat-label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--rose);
      margin: 10px 6px 4px;
    }
    .model-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      cursor: pointer;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .model-btn:hover {
      border-color: rgba(245, 208, 126, 0.45);
      background: rgba(245, 208, 126, 0.08);
    }
    .model-btn.active {
      border-color: var(--gold);
      background: rgba(245, 208, 126, 0.16);
      box-shadow: 0 0 18px rgba(245, 208, 126, 0.16);
    }
    .model-btn .title {
      font-weight: 700;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .model-btn .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 99px;
      background: rgba(251, 113, 133, 0.18);
      color: #fda4af;
      font-weight: 600;
    }
    .model-btn .sub {
      font-size: 11px;
      color: var(--muted);
    }
    main {
      position: relative;
      width: 100%;
      height: 100vh;
    }
    #viewport {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-overlay {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .info-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      pointer-events: auto;
      backdrop-filter: blur(10px);
      max-width: 440px;
    }
    .info-card h2 {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .info-card .meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .stats-row {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--text);
    }
    .stats-row span strong {
      color: var(--gold);
    }
    .clips-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      max-height: 145px;
      overflow-y: auto;
    }
    .clips-bar .label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      color: var(--gold);
      margin-right: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .clip-btn {
      padding: 6px 11px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .clip-btn:hover {
      border-color: var(--gold);
    }
    .clip-btn.active {
      background: var(--gold);
      color: #141824;
      border-color: var(--gold);
      font-weight: 700;
    }
  </style>

    const canvas = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121723);
    scene.fog = new THREE.FogExp2(0x121723, 0.032);

    const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.set(0, 2.6, 6.2);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 1.35, 0);
    controls.enableDamping = true;

    const hemi = new THREE.HemisphereLight(0xfff4d6, 0x28324e, 1.15);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xfff0cc, 1.65);
    dir.position.set(5, 9, 6);
    scene.add(dir);
    const rim = new THREE.DirectionalLight(0x7dd3fc, 0.75);
    rim.position.set(-6, 5, -5);
    scene.add(rim);

    // Pedestal & 1m grid
    const grid = new THREE.GridHelper(12, 12, 0xf5d07e, 0x2a3348);
    scene.add(grid);

    const loader = new GLTFLoader();
    const texLoader = new THREE.TextureLoader();

    // Load shared Rig_Medium (from Knight.glb + Skeleton_Warrior.glb) and Rig_Large animation packs
    const sharedPacks = { medium: [], large: [] };
    async function loadSharedAnims() {
      const kUrl = '/library/kaykit-adventurers/KayKit-Character-Pack-Adventures-1.0-main/addons/kaykit_character_pack_adventures/Characters/gltf/Knight.glb';
      const sUrl = '/library/kaykit-skeletons/KayKit-Character-Pack-Skeletons-1.0-main/addons/kaykit_character_pack_skeletons/Characters/gltf/Skeleton_Warrior.glb';
      const seen = new Set();
      for (const u of [kUrl, sUrl]) {
        try {
          const g = await loader.loadAsync(u);
          for (const clip of g.animations || []) {
            if (clip?.name && !seen.has(clip.name)) {
              seen.add(clip.name);
              sharedPacks.medium.push(clip);
            }
          }
        } catch {}
      }
      const lgFiles = ['Rig_Large_General.glb', 'Rig_Large_MovementBasic.glb', 'Rig_Large_CombatMelee.glb'];
      for (const f of lgFiles) {
        try {
          const g = await loader.loadAsync('/library/enemy-candidates/' + f);
          sharedPacks.large.push(...(g.animations || []));
        } catch {}
      }
    }

    // Load 1.9m Knight scale reference on the left (-2.1m)
    async function loadKnightReference() {
      try {
        const kUrl = '/library/kaykit-adventurers/KayKit-Character-Pack-Adventures-1.0-main/addons/kaykit_character_pack_adventures/Characters/gltf/Knight.glb';
        const gltf = await loader.loadAsync(kUrl);
        const root = gltf.scene;
        const box = new THREE.Box3().setFromObject(root);
        const h = Math.max(0.1, box.max.y - box.min.y);
        const s = 1.9 / h;
        root.scale.setScalar(s);
        root.position.set(-2.2, 0, 0);
        root.traverse((c) => {
          if (c.isMesh && c.material) {
            c.material = c.material.clone();
            c.material.transparent = true;
            c.material.opacity = 0.55;
          }
        });
        scene.add(root);
      } catch {}
    }

    let currentGroup = null;
    let currentMixer = null;
    let currentAction = null;
    let activeClips = [];

    function renderClipsBar(clips) {
      const bar = document.getElementById('clips-bar');
      bar.innerHTML = '<span class="label">Animations:</span>';
      clips.forEach((clip, idx) => {
        const b = document.createElement('button');
        b.className = 'clip-btn' + (idx === 0 ? ' active' : '');
        b.textContent = clip.name.replace(/^.*\|/, '');
        b.onclick = () => {
          document.querySelectorAll('.clip-btn').forEach((el) => el.classList.remove('active'));
          b.classList.add('active');
          playClip(clip);
        };
        bar.appendChild(b);
      });
    }

    function playClip(clip) {
      if (!currentMixer || !clip) return;
      if (currentAction) currentAction.fadeOut(0.18);
      const act = currentMixer.clipAction(clip);
      act.reset().fadeIn(0.18).play();
      currentAction = act;
    }

    function measureVisualBounds(root) {
      root.updateMatrixWorld(true);
      const box = new THREE.Box3();
      const v = new THREE.Vector3();
      root.traverse((c) => {
        if (!c.isMesh || !c.geometry?.attributes?.position) return;
        if (c.isSkinnedMesh && c.skeleton) {
          c.skeleton.update();
        }
        const pos = c.geometry.attributes.position;
        const step = Math.max(1, Math.floor(pos.count / 400));
        for (let i = 0; i < pos.count; i += step) {
          v.fromBufferAttribute(pos, i);
          if (c.isSkinnedMesh && typeof c.applyBoneTransform === 'function') {
            c.applyBoneTransform(i, v);
          }
          v.applyMatrix4(c.matrixWorld);
          box.expandByPoint(v);
        }
      });
      return box;
    }

    async function selectCandidate(cand) {
      document.querySelectorAll('.model-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.id === cand.id);
      });
      document.getElementById('info-title').textContent = cand.name;
      document.getElementById('info-desc').textContent = cand.desc;

      if (currentGroup) {
        scene.remove(currentGroup);
        currentGroup = null;
      }
      currentMixer = null;
      currentAction = null;

      try {
        const gltf = await loader.loadAsync(cand.url);
        const root = gltf.scene;

        root.traverse((c) => {
          if (c.isMesh) {
            c.frustumCulled = false;
            if (c.material) {
              c.material.opacity = 1.0;
              c.material.transparent = false;
            }
          }
        });
        if (cand.textureUrl) {
          const tex = await texLoader.loadAsync(cand.textureUrl);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.flipY = false;
          root.traverse((c) => {
            if (c.isMesh && c.material) {
              c.material.map = tex;
              c.material.needsUpdate = true;
            }
          });
        }

        scene.add(root);
        currentGroup = root;
        currentMixer = new THREE.AnimationMixer(root);

        let clips = [...(gltf.animations || [])];
        if (cand.rigPack === 'medium' && sharedPacks.medium.length > 0) {
          clips.push(...sharedPacks.medium);
        } else if (cand.rigPack === 'large' && sharedPacks.large.length > 0) {
          clips.push(...sharedPacks.large);
        }
        activeClips = clips;

        const defaultClip =
          clips.find((c) => /idle|fly/i.test(c.name)) || clips[0];
        if (defaultClip) {
          playClip(defaultClip);
          currentMixer.update(0.016);
        }

        if (cand.rotY) {
          root.rotation.y = cand.rotY;
        }
        const box = measureVisualBounds(root);
        const spanX = box.max.x - box.min.x;
        const spanY = box.max.y - box.min.y;
        const spanZ = box.max.z - box.min.z;
        const rawSize = cand.flyOffset ? Math.max(spanX, spanY, spanZ, 0.01) : Math.max(spanY, 0.01);
        const scale = (cand.targetHeight || 2.0) / rawSize;
        root.scale.setScalar(scale);

        const cx = (box.min.x + box.max.x) * 0.5 * scale;
        const cz = (box.min.z + box.max.z) * 0.5 * scale;
        const yOff = -box.min.y * scale + (cand.flyOffset || 0);
        root.position.set(-cx, yOff, -cz);

        let tris = 0;
        let bones = 0;
        root.traverse((c) => {
          if (c.isMesh && c.geometry) {
            const g = c.geometry;
            tris += g.index ? g.index.count / 3 : (g.attributes.position?.count || 0) / 3;
          }
          if (c.isBone) bones++;
        });

        document.getElementById('stat-tris').textContent = Math.round(tris).toLocaleString();
        document.getElementById('stat-bones').textContent = bones;
        document.getElementById('stat-clips').textContent = clips.length;
        document.getElementById('stat-height').textContent = `${cand.targetHeight.toFixed(2)}m`;

        renderClipsBar(clips);
      } catch (err) {
        document.getElementById('info-desc').textContent = 'Error loading model: ' + err.message;
      }
    }

    function buildSidebar() {
      const list = document.getElementById('model-list');
      let lastCat = '';
      for (const c of CANDIDATES) {
        if (c.cat !== lastCat) {
          lastCat = c.cat;
          const lbl = document.createElement('div');
          lbl.className = 'cat-label';
          lbl.textContent = c.cat;
          list.appendChild(lbl);
        }
        const btn = document.createElement('button');
        btn.className = 'model-btn';
        btn.dataset.id = c.id;
        btn.innerHTML = `
          <div class="title">
            <span>${c.name}</span>
            <span class="badge">${c.badge}</span>
          </div>
          <div class="sub">${c.targetHeight.toFixed(1)}m · ${c.rigPack === 'embedded' ? 'Custom Rig' : 'KayKit ' + c.rigPack}</div>
        `;
        btn.onclick = () => selectCandidate(c);
        list.appendChild(btn);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (currentMixer) currentMixer.update(dt);
      controls.update();
      renderer.render(scene, camera);
    }

    buildSidebar();
    await loadSharedAnims();
    await loadKnightReference();
    const initialId = new URLSearchParams(window.location.search).get('model') || CANDIDATES[0].id;
    const initialCand = CANDIDATES.find((c) => c.id === initialId) || CANDIDATES[0];
    await selectCandidate(initialCand);
    window.__AUDITION_READY__ = true;
    window.__SELECT_CANDIDATE__ = (id) => {
      const c = CANDIDATES.find((x) => x.id === id);
      if (c) return selectCandidate(c);
    };
    animate();
  </script>
</body>
</html>
