<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>Haru-machi · Stage 2 Assembled World &amp; Time-of-Day Sky</title>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b132b;
      color: #f8fafc;
      user-select: none;
    }
    #world-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    #top-bar {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hud-card {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 9px 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    .hud-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .hud-sub {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 2px;
    }
    .controls-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn {
      background: rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .btn.active {
      background: #f59e0b;
      color: #111827;
      border-color: #fbbf24;
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
      font-size: 11px;
      color: #e2e8f0;
    }
    #tod-slider {
      width: 110px;
      accent-color: #f59e0b;
      cursor: pointer;
    }
    #tod-clock-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: #fde68a;
      min-width: 108px;
    }
    #stats-readout {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      color: #86efac;
    }
    #bottom-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 96vw;
    }
    #view-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    #view-buttons button {
      background: rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    #view-buttons button.active {
      background: #f59e0b;
      color: #111827;
      border-color: #fbbf24;
    }
  </style>
</head>
<body>
  <canvas id="world-canvas"></canvas>

  <div id="hud">
    <div id="top-bar">
      <div class="hud-card">
        <div class="hud-title">Haru-machi · Stage 3 Co-Op Heroes (Knight &amp; Mage) &amp; Assembled Valley</div>
        <div class="hud-sub">WASD Move · Shift Sprint · Space Jump · J Attack · E Skill · Q Burst · Hold V Pray · Tab Swap Hero · 1–8 Views</div>
      </div>

      <div class="hud-card controls-row">
        <button type="button" class="btn active" data-tod="day">☀️ Day</button>
        <button type="button" class="btn" data-tod="evening">🌅 Evening</button>
        <button type="button" class="btn" data-tod="night">🌙 Night</button>
        <div class="slider-wrap">
          <input id="tod-slider" type="range" min="0" max="1" step="0.005" value="0.34" />
          <span id="tod-clock-label">08:10 (DAY)</span>
        </div>
        <button type="button" class="btn" id="tod-play-btn">▶ Cycle (P)</button>
      </div>

      <div class="hud-card controls-row">
        <button type="button" class="btn" id="hud-swap-hero-btn" title="Swap Active Co-Op Hero (Tab)">🛡️ Knight · 🔄 Tab</button>
        <button type="button" class="btn active" data-profile="desktop">🖥️ RX 6700</button>
        <button type="button" class="btn" data-profile="tablet">📱 Pad 7</button>
        <span id="stats-readout" style="margin-left: 6px;">Initializing world...</span>
      </div>
    </div>

    <div id="bottom-bar" class="hud-card">
      <div id="view-buttons"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
