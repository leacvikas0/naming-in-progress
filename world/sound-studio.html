<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haru-machi · Synced Scene & Sound Audition Studio</title>
  <style>
    :root {
      --bg: #0b090e;
      --panel: #15111a;
      --panel-elev: #1d1724;
      --border: rgba(245, 236, 224, 0.12);
      --border-active: #e11d48;
      --gold: #f59e0b;
      --gold-soft: #fde68a;
      --crimson: #e11d48;
      --text: #faf6f0;
      --muted: #a89f96;
      --emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #221320 0%, var(--bg) 55%);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 64px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13, 10, 16, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-pill {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(225, 29, 72, 0.18);
      border: 1px solid rgba(225, 29, 72, 0.5);
      color: #fda4af;
    }

    .brand p {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .status-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      padding: 7px 13px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    .picks-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel-elev);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
    }

    .picks-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--gold-soft);
      font-weight: 600;
    }

    .btn-copy {
      background: var(--crimson);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
    }

    .btn-copy:hover {
      background: #f43f5e;
      transform: translateY(-1px);
    }

    main {
      max-width: 1520px;
      margin: 28px auto 0;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(660px, 1fr));
      gap: 28px;
    }

    @media (max-width: 740px) {
      main {
        grid-template-columns: 1fr;
        padding: 0 14px;
      }
    }

    .scene-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48);
      transition: border-color 0.2s;
    }

    .scene-card.playing {
      border-color: rgba(225, 29, 72, 0.65);
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
    }

    .card-title-group h2 {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .card-title-group p {
      font-size: 0.81rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .winner-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: var(--gold-soft);
      white-space: nowrap;
    }

    .video-stage {
      position: relative;
      background: #050407;
      aspect-ratio: 16 / 9;
      width: 100%;
      overflow: hidden;
    }

    .video-stage video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-overlay-hud {
      position: absolute;
      left: 14px;
      bottom: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .live-cue-toast {
      background: rgba(11, 9, 14, 0.86);
      border: 1px solid rgba(225, 29, 72, 0.65);
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      transition: opacity 0.18s, transform 0.18s;
    }

    .timeline-bar-wrap {
      background: #100c14;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scrubber-track {
      position: relative;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
    }

    .scrubber-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--crimson), var(--gold));
      border-radius: 999px;
    }

    .beat-markers-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .beat-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.13);
      color: var(--text);
      font-size: 0.74rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.14s;
    }

    .beat-chip:hover {
      background: rgba(225, 29, 72, 0.22);
      border-color: var(--crimson);
    }

    .beat-chip.fired {
      background: var(--crimson);
      border-color: #fda4af;
      color: #fff;
    }

    .controls-section {
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .toolbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .play-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-action {
      background: #271e30;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.81rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.14s;
    }

    .btn-action:hover {
      background: #332740;
      border-color: rgba(255, 255, 255, 0.32);
    }

    .btn-action.primary {
      background: var(--crimson);
      border-color: #fb7185;
      color: #fff;
    }

    .btn-action.primary:hover {
      background: #f43f5e;
    }

    .distance-switcher {
      display: inline-flex;
      background: #100c14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .dist-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s;
    }

    .dist-btn.active {
      background: rgba(245, 158, 11, 0.22);
      color: var(--gold-soft);
      border: 1px solid rgba(245, 158, 11, 0.5);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .option-btn {
      background: var(--panel-elev);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: all 0.14s;
    }

    .option-btn:hover {
      border-color: rgba(255, 255, 255, 0.32);
      background: #251d2e;
    }

    .option-btn.active {
      border-color: var(--crimson);
      background: linear-gradient(90deg, rgba(225, 29, 72, 0.18), rgba(245, 158, 11, 0.07));
      box-shadow: 0 0 0 1px rgba(225, 29, 72, 0.35);
    }

    .opt-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .opt-title {
      font-size: 0.87rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .opt-num {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.73rem;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.09);
      color: var(--gold-soft);
    }

    .option-btn.active .opt-num {
      background: var(--crimson);
      color: #fff;
    }

    .opt-desc {
      font-size: 0.77rem;
      color: var(--muted);
    }

    .opt-layers {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.71rem;
      color: #cbd5e1;
      background: rgba(0, 0, 0, 0.32);
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>
        Haru-machi · Synced Scene &amp; Sound Audition Studio
        <span class="badge-pill">Real Studio Foley + Sub-Bass</span>
      </h1>
      <p>Click any Option (1–5) below a scene to play the video with frame-locked multi-layer foley &amp; sub-bass.</p>
    </div>
    <div class="header-right">
      <div id="audio-status-pill" class="status-pill">Loading real foley buffers...</div>
      <div class="picks-bar">
        <span>Your Picks:</span>
        <span id="picks-summary" class="picks-text">Briar #1 · Smite #1 · Sword #1 · Spell #1</span>
        <button id="copy-picks-btn" class="btn-copy">Copy Picks</button>
      </div>
    </div>
  </header>

  <main id="studio-grid"></main>

  <script type="module">
    import { createStudioAudioDirector } from './src/audio/sfx-studio-engine.js';

    const director = createStudioAudioDirector({ basePath: './assets/audio' });
    const statusPill = document.getElementById('audio-status-pill');

    director.preloadAll((loaded, total) => {
      statusPill.textContent = `Decoding Real Foley Buffers (${loaded}/${total})...`;
    }).then((count) => {
      statusPill.textContent = `✓ ${count} Real Studio Foley + Sub-Bass Buffers Ready`;
    });

    const SCENES = [
      {
        id: 'briar',
        label: 'Briar',
        title: '1 · Divine Verdict — Briar Option 9 (Blessing & Underground Resurrection)',
        subtitle: 'Synced to full 4-Beat sequence: Slow Root Creep → Fast Chestnut Briar Whip → -3.05m Earth Plunge → Subterranean Heal → Petal Burst Pop-Up.',
        videoSrc: './videos/clip-blessing-resurrection.webm',
        actionStartTime: 1.15,
        cues: [
          { id: 'prayer_start', time: 0.08, label: '0.08s · Prayer Wind' },
          { id: 'root_creep', time: 1.20, label: '1.20s · Root Creep' },
          { id: 'briar_whip_lock', time: 2.85, label: '2.85s · Briar Whip Lock' },
          { id: 'earth_plunge', time: 3.76, label: '3.76s · -3.05m Plunge' },
          { id: 'underground_heal', time: 4.45, label: '4.45s · Underground Heal' },
          { id: 'pop_up_emerge', time: 6.38, label: '6.38s · Pop-Up & Petals' },
        ],
        options: [
          { num: 1, name: 'Witcher 3 Iris Manor (Heavy Chestnut Bark & Earth Tomb)', desc: 'Thick gnarled wood creaks, 4 staggered whip snaps, deep soil plunge thud & double subterranean heartbeat.', tag: 'Wood + Whip + 34Hz Sub' },
          { num: 2, name: 'Sacred Botanical Cathedral (Singing Bowl & Heartbeat)', desc: 'Warm Tibetan bronze bowl harmonic over woody root creep, deep earth plunge, and luminous bell emergence.', tag: 'Singing Bowl + Roots' },
          { num: 3, name: 'Visceral Thicket & Bowed Cello Bloom', desc: 'Crisp whip-crack lattice interlock, heavy boulder/soil submerge, and rising acoustic E2 cello swell underground.', tag: 'Whip Crack + Cello E2' },
          { num: 4, name: 'Dark Eclipse Ritual (Tectonic Rumble & Low Bronze)', desc: 'Underwater/tectonic thunder rumble beneath creeping roots, heavy bass impact, and deep temple resonance.', tag: 'Tectonic + Low Bell' },
          { num: 5, name: 'Pure Intimate Organic Foley (Zero Musical Tones)', desc: '100% dry physical wood creaks, thick foliage brush, soil thud, and crisp fluttering rose petals.', tag: '100% Dry Foley' },
        ],
      },
      {
        id: 'smite',
        label: 'Smite',
        title: '2 · Divine Verdict — Left-to-Right Wind Petal Smite (Frame 41)',
        subtitle: 'Synced to 0.0x dead-wind vacuum drop at 0.90s → Stereo Left-to-Right rushing wind gust & petal erosion sweeping into the right horizon.',
        videoSrc: './videos/clip-smite-dissolve.webm',
        actionStartTime: 0.75,
        cues: [
          { id: 'smite_channel', time: 0.08, label: '0.08s · Prayer Channel' },
          { id: 'vacuum_drop', time: 0.90, label: '0.90s · 0.0x Vacuum Drop' },
          { id: 'wind_petal_sweep_1', time: 1.12, label: '1.12s · Left→Right Wind Gust' },
          { id: 'wind_petal_sweep_2', time: 1.88, label: '1.88s · Right Horizon Fade' },
        ],
        options: [
          { num: 1, name: 'Ghost of Tsushima Gale (Vacuum Drop + Stereo Wind Rush)', desc: 'Sudden 24Hz vacuum drop cuts all air, followed by a howling stereo wind gust (-0.92 Left → +0.98 Right) & dry petal flutter.', tag: 'Stereo Pan L→R + Gale' },
          { num: 2, name: 'Clair Obscur Cello Elegy (Mournful Bowed String + Wind)', desc: 'Bowed E2 cello harmonic bends downward at the vacuum drop while velvet petals rush left-to-right across the stage.', tag: 'Cello Elegy + Petals' },
          { num: 3, name: 'Cold Obsidian Temple Verdict (Low Bell Toll + Razor Wind)', desc: 'Deep pitch-shifted temple bowl toll on the monochrome snap + high-velocity freezing wind gust.', tag: 'Obsidian Bell + Gust' },
          { num: 4, name: 'Breathless Heart-Stop (Single Final Heartbeat + Whisper)', desc: 'One heavy final heartbeat thump as the world turns B&W, then a delicate, haunting rush of departing petals.', tag: 'Heart-Stop + Flutter' },
          { num: 5, name: 'Storm-Torn Rose (Sub-Bass Implosion + Whip Gust)', desc: 'Heavy sub-bass implosion + sharp vine-whip snap launching a fierce storm of foliage and petals rightward.', tag: 'Sub Implosion + Storm' },
        ],
      },
      {
        id: 'sword',
        label: 'Sword',
        title: '3 · Knight 4-Hit Sword Combo + Elemental Finisher',
        subtitle: 'Frame-locked to contact frames: Hit 1 Slice → Hit 2 Rising Slash → Hit 3 Overhead Cleave → Hit 4 Jump Slam → 360° Glacial Spin.',
        videoSrc: './videos/01-knight-sword-combos.webm',
        actionStartTime: 0.15,
        cues: [
          { id: 1, time: 0.38, label: '0.38s · Hit 1 Slice' },
          { id: 2, time: 1.20, label: '1.20s · Hit 2 Rising' },
          { id: 3, time: 2.02, label: '2.02s · Hit 3 Cleave' },
          { id: 4, time: 2.84, label: '2.84s · Hit 4 Jump Slam' },
          { id: 5, time: 3.68, label: '3.68s · 360° Glacial Spin' },
        ],
        options: [
          { num: 1, name: 'Heavy Steel & Armor Crunch (Witcher / Dark Souls Weight)', desc: 'Crisp blade air-cut whoosh followed 55ms later by meaty armor impact, steel ring, and escalating sub-bass punch.', tag: 'Steel + Armor + Sub' },
          { num: 2, name: 'Hinokami Sunfire & Glacial Breath (Ufotable Elemental)', desc: 'Layers real roaring torch/sunfire whooshes onto Hits 1–4 and crystalline glacier fracture onto the 360° spin.', tag: 'Fire Roar + Ice Crack' },
          { num: 3, name: 'Harmonic Katana & Taiko Sub (Ghost of Tsushima Style)', desc: 'High-sheen singing steel overtones on every contact frame paired with a tight, resonant low membrane thump.', tag: 'Singing Steel + Taiko' },
          { num: 4, name: 'Brutal Greatsword Cleave (Low-Formant Heavy Iron)', desc: 'Pitch-shifted heavy iron swings with deep bone-crushing impacts and massive 30Hz jump-slam shockwave.', tag: 'Heavy Iron + Crater' },
          { num: 5, name: 'Crisp Duelist Parry & Slice (Fast Transient Precision)', desc: 'Ultra-tight, fast-attack blade swishes and metallic clashes with zero mud so rapid mash combos feel razor-sharp.', tag: 'Fast Transient Steel' },
        ],
      },
      {
        id: 'spell',
        label: 'Spell',
        title: '4 · Mage Distance-Dynamic Attack (Near 3m vs. Mid 9m vs. Far 16m)',
        subtitle: 'Test how the impact physics adapt to cast distance: speed-of-sound delay (0ms → 52ms), air-absorption filter, sub-bass weight, and valley reverb.',
        videoSrc: './videos/03-cinder-fall-lifecycle.webm',
        actionStartTime: 0.10,
        hasDistanceSwitcher: true,
        cues: [
          { id: 'cast_launch', time: 0.25, label: '0.25s · Cast Launch (At Hands)' },
          { id: 'crater_impact', time: 0.88, label: '0.88s · Crater Impact (At Distance)' },
          { id: 'chunk_bounce', time: 1.52, label: '1.52s · Bouncing Debris' },
          { id: 'magma_cool', time: 2.45, label: '2.45s · Cooling Vent Rumble' },
        ],
        options: [
          { num: 1, name: 'Tectonic Volcanic Boulder (Heavy Rock Smash + 26Hz Magma Sub)', desc: 'Massive boulder shatter + earth thud + cinema subwoofer drop that shakes the chest up close and echoes across the valley from afar.', tag: 'Boulder + 26Hz Sub' },
          { num: 2, name: 'Glacial Shatterlance Hybrid (Crystalline Ice Fracture + Boom)', desc: 'High-voltage glacier crack & crystalline shatter layered over a deep sub-zero shockwave.', tag: 'Ice Crack + Shockwave' },
          { num: 3, name: 'Celestial Temple Bell & Meteor (Harmonic Bronze Impact)', desc: 'Strikes a deep pitch-shifted Tibetan bronze bell at the moment of rock shatter so the impact rings musically.', tag: 'Bronze Bell + Rock' },
          { num: 4, name: 'Siege Artillery Thunderclap (Whip-Crack Transient + Rolling Thunder)', desc: 'Sharp acoustic whip-snap transient on contact followed by a rolling outdoor canyon thunder tail.', tag: 'Crack + Canyon Thunder' },
          { num: 5, name: 'Visceral Close-Foley Firestorm (Roaring Flame + Multi-Rock Scatter)', desc: 'Saturated flame eruption + wide stereo bouncing rock fragments and subterranean magma rumble.', tag: 'Flame Roar + Debris' },
        ],
      },
    ];

    const state = {
      picks: { briar: 1, smite: 1, sword: 1, spell: 1 },
      distance: 'near',
    };

    function updatePicksSummary() {
      const el = document.getElementById('picks-summary');
      el.textContent = `Briar #${state.picks.briar} · Smite #${state.picks.smite} · Sword #${state.picks.sword} · Spell #${state.picks.spell} (${state.distance.toUpperCase()})`;
    }

    document.getElementById('copy-picks-btn').addEventListener('click', async (e) => {
      const txt = `Sound Picks — Briar: Option ${state.picks.briar}, Smite: Option ${state.picks.smite}, Sword: Option ${state.picks.sword}, Distance Spell: Option ${state.picks.spell}`;
      try {
        await navigator.clipboard.writeText(txt);
      } catch {
        // ignore
      }
      const btn = e.currentTarget;
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = old; }, 1400);
    });

    function fireSceneCue(sceneId, cueId, optNum) {
      if (sceneId === 'briar') {
        director.triggerBriarCue(cueId, optNum);
      } else if (sceneId === 'smite') {
        director.triggerSmiteCue(cueId, optNum);
      } else if (sceneId === 'sword') {
        director.triggerKnightComboCue(cueId, optNum);
      } else if (sceneId === 'spell') {
        director.triggerDistanceSpellCue(cueId, optNum, state.distance);
      }
    }

    const grid = document.getElementById('studio-grid');

    SCENES.forEach((scene) => {
      const card = document.createElement('section');
      card.className = 'scene-card';
      card.id = `card-${scene.id}`;

      const distSwitcherHtml = scene.hasDistanceSwitcher
        ? `<div class="distance-switcher" role="group" aria-label="Target Distance">
            <button class="dist-btn active" data-dist="near">Near (3m · 0ms)</button>
            <button class="dist-btn" data-dist="mid">Mid (9m · 26ms)</button>
            <button class="dist-btn" data-dist="far">Far (16m · 52ms Echo)</button>
          </div>`
        : '';

      card.innerHTML = `
        <div class="card-header">
          <div class="card-title-group">
            <h2>${scene.title}</h2>
            <p>${scene.subtitle}</p>
          </div>
          <span class="winner-pill" id="winner-pill-${scene.id}">Selected: Option #1</span>
        </div>

        <div class="video-stage">
          <video id="vid-${scene.id}" src="${scene.videoSrc}" playsinline muted preload="auto"></video>
          <div class="video-overlay-hud">
            <div class="live-cue-toast" id="toast-${scene.id}">Ready · Click any Option (1–5) to Audition</div>
          </div>
        </div>

        <div class="timeline-bar-wrap">
          <div class="scrubber-track" id="scrub-${scene.id}">
            <div class="scrubber-fill" id="fill-${scene.id}"></div>
          </div>
          <div class="beat-markers-row" id="markers-${scene.id}">
            ${scene.cues
              .map(
                (c, idx) =>
                  `<button class="beat-chip" data-cue-idx="${idx}" title="Jump to ${c.label}">${c.label}</button>`
              )
              .join('')}
          </div>
        </div>

        <div class="controls-section">
          <div class="toolbar-row">
            <div class="play-controls">
              <button class="btn-action primary" id="play-btn-${scene.id}">▶ Play Synced Scene</button>
              <button class="btn-action" id="impact-only-btn-${scene.id}">⚡ Trigger Main Impact Only</button>
            </div>
            ${distSwitcherHtml}
          </div>

          <div class="options-grid" id="opts-${scene.id}">
            ${scene.options
              .map(
                (o) => `
              <button class="option-btn ${o.num === 1 ? 'active' : ''}" data-opt="${o.num}">
                <div class="opt-left">
                  <div class="opt-title">
                    <span class="opt-num">OPTION ${o.num}</span>
                    <span>${o.name}</span>
                  </div>
                  <div class="opt-desc">${o.desc}</div>
                </div>
                <span class="opt-layers">${o.tag}</span>
              </button>
            `
              )
              .join('')}
          </div>
        </div>
      `;

      grid.appendChild(card);

      const video = card.querySelector(`#vid-${scene.id}`);
      const fill = card.querySelector(`#fill-${scene.id}`);
      const scrub = card.querySelector(`#scrub-${scene.id}`);
      const toast = card.querySelector(`#toast-${scene.id}`);
      const winnerPill = card.querySelector(`#winner-pill-${scene.id}`);
      const markerBtns = Array.from(card.querySelectorAll('.beat-chip'));
      const optBtns = Array.from(card.querySelectorAll('.option-btn'));
      const playBtn = card.querySelector(`#play-btn-${scene.id}`);
      const impactOnlyBtn = card.querySelector(`#impact-only-btn-${scene.id}`);

      const firedSet = new Set();
      let lastVideoTime = 0;

      function startSyncedPlayback(fromTime = 0) {
        // Pause other videos so you hear one scene cleanly at a time
        document.querySelectorAll('video').forEach((v) => {
          if (v !== video) v.pause();
        });
        document.querySelectorAll('.scene-card').forEach((c) => c.classList.remove('playing'));
        director.stopAllActive();
        firedSet.clear();
        markerBtns.forEach((b) => b.classList.remove('fired'));

        for (const c of scene.cues) {
          if (c.time < fromTime - 0.04) {
            firedSet.add(c.id);
          }
        }
        video.currentTime = fromTime;
        lastVideoTime = fromTime;
        card.classList.add('playing');
        video.play().catch(() => {});
        playBtn.textContent = '⏸ Pause Scene';
      }

      playBtn.addEventListener('click', () => {
        if (video.paused || video.ended) {
          startSyncedPlayback(video.ended ? 0 : video.currentTime);
        } else {
          video.pause();
          director.stopAllActive();
          card.classList.remove('playing');
          playBtn.textContent = '▶ Play Synced Scene';
        }
      });

      impactOnlyBtn.addEventListener('click', () => {
        director.stopAllActive();
        const opt = state.picks[scene.id];
        if (scene.id === 'briar') {
          startSyncedPlayback(2.75);
        } else if (scene.id === 'smite') {
          startSyncedPlayback(0.82);
        } else if (scene.id === 'sword') {
          startSyncedPlayback(0.25);
        } else if (scene.id === 'spell') {
          startSyncedPlayback(0.75);
        }
      });

      optBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const num = Number(btn.dataset.opt);
          state.picks[scene.id] = num;
          optBtns.forEach((b) => b.classList.toggle('active', Number(b.dataset.opt) === num));
          winnerPill.textContent = `Selected: Option #${num}`;
          updatePicksSummary();
          startSyncedPlayback(scene.actionStartTime || 0);
        });
      });

      markerBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.cueIdx);
          const cue = scene.cues[idx];
          if (!cue) return;
          startSyncedPlayback(Math.max(0, cue.time - 0.05));
        });
      });

      if (scene.hasDistanceSwitcher) {
        const distBtns = Array.from(card.querySelectorAll('.dist-btn'));
        distBtns.forEach((dBtn) => {
          dBtn.addEventListener('click', () => {
            state.distance = dBtn.dataset.dist;
            distBtns.forEach((b) => b.classList.toggle('active', b === dBtn));
            updatePicksSummary();
            startSyncedPlayback(0.15);
          });
        });
      }

      scrub.addEventListener('click', (e) => {
        const rect = scrub.getBoundingClientRect();
        const u = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        if (Number.isFinite(video.duration) && video.duration > 0) {
          startSyncedPlayback(u * video.duration);
        }
      });

      video.addEventListener('ended', () => {
        card.classList.remove('playing');
        playBtn.textContent = '↻ Replay Synced Scene';
      });

      function tickSync() {
        if (!video.paused && !video.ended) {
          const t = video.currentTime;
          const dur = video.duration || 1;
          fill.style.width = `${Math.min(100, (t / dur) * 100).toFixed(1)}%`;

          // Detect loop wrap
          if (t < lastVideoTime - 0.25) {
            firedSet.clear();
            markerBtns.forEach((b) => b.classList.remove('fired'));
          }
          lastVideoTime = t;

          const opt = state.picks[scene.id];
          scene.cues.forEach((c, idx) => {
            if (!firedSet.has(c.id) && t >= c.time) {
              firedSet.add(c.id);
              fireSceneCue(scene.id, c.id, opt);
              markerBtns[idx]?.classList.add('fired');
              toast.textContent = `🔊 [Option #${opt}] Fired: ${c.label}${scene.hasDistanceSwitcher ? ` (${state.distance.toUpperCase()})` : ''}`;
            }
          });
        }
        requestAnimationFrame(tickSync);
      }
      requestAnimationFrame(tickSync);
    });
  </script>
</body>
</html>
