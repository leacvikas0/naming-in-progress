<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Haru-machi · Ghibli Gouache Tree + 3D Shingled-Petal Wisteria Study</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #68b5f8;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .label-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .panel-tag {
      position: absolute;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(20, 28, 38, 0.80);
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: 1px solid rgba(255, 255, 255, 0.20);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="labels" class="label-layer"></div>

  <script type="module">
    import * as THREE from 'three';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    const TAU = Math.PI * 2;

    function createPRNG(seed) {
      let s = (seed >>> 0) || 1337;
      return function () {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    // =========================================================================
    // 1. Procedural 1024x512 Gouache Leaf & Crown-Blossom Atlas (2 Tiles)
    // =========================================================================
    function createGouacheFoliageAtlas() {
      const W = 1024, H = 512;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      function drawGouacheLeaf(cx, cy, len, wid, angle, baseHex, midHex, tipHex, rimHex, darkOutline = '#285c24') {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);

        const grad = ctx.createLinearGradient(0, -len * 0.45, 0, len * 0.55);
        grad.addColorStop(0.0, baseHex);
        grad.addColorStop(0.50, midHex);
        grad.addColorStop(0.88, tipHex);
        grad.addColorStop(1.0, rimHex);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, -len * 0.48);
        ctx.bezierCurveTo(wid * 0.68, -len * 0.18, wid * 0.60, len * 0.26, 0, len * 0.54);
        ctx.bezierCurveTo(-wid * 0.60, len * 0.26, -wid * 0.68, -len * 0.18, 0, -len * 0.48);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = darkOutline;
        ctx.globalAlpha = 0.22;
        ctx.lineWidth = 1.8;
        ctx.stroke();

        ctx.strokeStyle = rimHex;
        ctx.globalAlpha = 0.24;
        ctx.lineWidth = Math.max(1.4, wid * 0.06);
        ctx.beginPath();
        ctx.moveTo(0, -len * 0.30);
        ctx.lineTo(0, len * 0.38);
        ctx.stroke();
        ctx.restore();
      }

      function drawCrownFlower(cx, cy, radius, rot, petalHex, shdHex) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot);
        for (let p = 0; p < 5; p++) {
          const a = (p / 5) * TAU;
          ctx.save();
          ctx.rotate(a);
          const g = ctx.createRadialGradient(0, radius * 0.35, 1, 0, radius * 0.45, radius * 0.68);
          g.addColorStop(0, shdHex);
          g.addColorStop(0.45, petalHex);
          g.addColorStop(1, '#ffffff');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(0, radius * 0.10);
          ctx.bezierCurveTo(radius * 0.38, radius * 0.28, radius * 0.34, radius * 0.86, 0, radius * 0.98);
          ctx.bezierCurveTo(-radius * 0.34, radius * 0.86, -radius * 0.38, radius * 0.28, 0, radius * 0.10);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = '#ffbe32';
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.23, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#fff5b8';
        ctx.beginPath();
        ctx.arc(-radius * 0.05, -radius * 0.05, radius * 0.11, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      // Left Tile (0..512): Ragged Star-Burst Gouache Leaf Cluster
      {
        const rand = createPRNG(101);
        const ox = 256, oy = 256;
        const outerSpokes = 12;
        for (let i = 0; i < outerSpokes; i++) {
          const a = (i / outerSpokes) * TAU + (rand() - 0.5) * 0.16;
          const r = 96 + (i % 3) * 26 + rand() * 16;
          drawGouacheLeaf(
            ox + Math.cos(a) * r,
            oy + Math.sin(a) * r,
            152 + (i % 2) * 22,
            76 + rand() * 14,
            a - Math.PI * 0.5 + (rand() - 0.5) * 0.28,
            '#3b7a30', '#5cae40', '#88d652', '#b8f06c'
          );
        }
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * TAU + 0.25 + (rand() - 0.5) * 0.20;
          const r = 46 + rand() * 42;
          drawGouacheLeaf(
            ox + Math.cos(a) * r,
            oy + Math.sin(a) * r,
            134 + rand() * 20,
            72 + rand() * 14,
            a - Math.PI * 0.5 + (rand() - 0.5) * 0.30,
            '#468a36', '#70c048', '#9ee25e', '#caf678'
          );
        }
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * TAU + rand() * 0.35;
          const r = 18 + rand() * 24;
          drawGouacheLeaf(
            ox + Math.cos(a) * r,
            oy + Math.sin(a) * r,
            116 + rand() * 16,
            66 + rand() * 12,
            a - Math.PI * 0.5 + (rand() - 0.5) * 0.35,
            '#58a240', '#84d052', '#b6ee6a', '#defa8c'
          );
        }
      }

      // Right Tile (512..1024): Ragged Leaf Sprig + White 5-Petal Crown Flowers
      {
        const rand = createPRNG(202);
        const ox = 512 + 256, oy = 256;
        const outerSpokes = 12;
        for (let i = 0; i < outerSpokes; i++) {
          const a = (i / outerSpokes) * TAU + (rand() - 0.5) * 0.16;
          const r = 94 + (i % 3) * 24 + rand() * 16;
          drawGouacheLeaf(
            ox + Math.cos(a) * r,
            oy + Math.sin(a) * r,
            150 + (i % 2) * 22,
            74 + rand() * 14,
            a - Math.PI * 0.5 + (rand() - 0.5) * 0.28,
            '#3b7a30', '#5cae40', '#8ad652', '#baee6c'
          );
        }
        for (let i = 0; i < 9; i++) {
          const a = (i / 9) * TAU + 0.3 + (rand() - 0.5) * 0.20;
          const r = 44 + rand() * 42;
          drawGouacheLeaf(
            ox + Math.cos(a) * r,
            oy + Math.sin(a) * r,
            130 + rand() * 18,
            70 + rand() * 14,
            a - Math.PI * 0.5 + (rand() - 0.5) * 0.30,
            '#488c38', '#74c248', '#a2e45e', '#ccf678'
          );
        }
        drawCrownFlower(ox - 54, oy - 42, 52, 0.3, '#fff6fa', '#dec2d0');
        drawCrownFlower(ox + 62, oy + 26, 46, 1.1, '#fff8fb', '#e2c8d4');
        drawCrownFlower(ox - 10, oy + 66, 40, 2.0, '#fff6fa', '#e0c6d2');
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.anisotropy = 4;
      tex.needsUpdate = true;
      return tex;
    }

    const PAL = {
      barkSun: new THREE.Color('#8e5636'),
      barkShd: new THREE.Color('#5c3620'),
      barkDeep: new THREE.Color('#3f2212'),
      foliageTopSun: new THREE.Color('#cef474'),
      foliageMidSun: new THREE.Color('#7ecb4a'),
      foliageLowSun: new THREE.Color('#529e3a'),
      foliageShdTop: new THREE.Color('#4a9438'),
      foliageShdLow: new THREE.Color('#2e6c28'),

      // 3D Shingled-Petal Wisteria Palette (matching 01-title.png)
      wistCalyxSun:  new THREE.Color('#7c3aed'), // deep violet-indigo stem/calyx base
      wistCalyxShd:  new THREE.Color('#4c1d95'),
      wistUpperSun:  new THREE.Color('#a855f7'), // rich orchid upper florets
      wistUpperShd:  new THREE.Color('#6d28d9'),
      wistMidSun:    new THREE.Color('#d8b4fe'), // luminous lavender-lilac middle florets
      wistMidShd:    new THREE.Color('#9333ea'),
      wistLowerSun:  new THREE.Color('#f5d0fe'), // soft pink-lavender lower florets
      wistLowerShd:  new THREE.Color('#c084fc'),
      wistBudTipSun: new THREE.Color('#fff5fd'), // creamy blush-white bottom buds
      wistBudTipShd: new THREE.Color('#e9d5ff'),
    };

    class GouacheTreeBuilder {
      constructor(crownCenter) {
        this.positions = [];
        this.normals = [];
        this.uvs = [];
        this.colors = [];
        this.shadowColors = [];
        this.cardModes = []; // 0.0 = bark, 1.0 = leaf card, 2.0 = 3D shingled wisteria petal
        this.indices = [];
        this.vCount = 0;
        this.crownCenter = crownCenter;
      }

      addVertex(x, y, z, nx, ny, nz, u, v, sunCol, shdCol, mode = 0.0) {
        this.positions.push(x, y, z);
        const len = Math.hypot(nx, ny, nz) || 1;
        this.normals.push(nx / len, ny / len, nz / len);
        this.uvs.push(u, v);
        this.colors.push(sunCol.r, sunCol.g, sunCol.b);
        this.shadowColors.push(shdCol.r, shdCol.g, shdCol.b);
        this.cardModes.push(mode);
        return this.vCount++;
      }

      addTaperedLimb(points, rStart, rEnd, sides = 7, flare = 0.0) {
        const n = points.length;
        const rings = [];
        const tangent = new THREE.Vector3();
        const right = new THREE.Vector3();
        const fwd = new THREE.Vector3();
        const ref = new THREE.Vector3();

        for (let i = 0; i < n; i++) {
          const t = i / (n - 1);
          let r = THREE.MathUtils.lerp(rStart, rEnd, Math.pow(t, 0.78));
          if (flare > 0.0 && t < 0.38) {
            r += Math.pow(1.0 - t / 0.38, 2.2) * flare * rStart;
          }

          if (i === 0) tangent.subVectors(points[1], points[0]);
          else if (i === n - 1) tangent.subVectors(points[n - 1], points[n - 2]);
          else tangent.subVectors(points[i + 1], points[i - 1]);
          tangent.normalize();

          if (Math.abs(tangent.y) > 0.92) ref.set(1, 0, 0);
          else ref.set(0, 1, 0);
          right.crossVectors(tangent, ref).normalize();
          fwd.crossVectors(right, tangent).normalize();

          const sunC = PAL.barkSun.clone().lerp(PAL.barkShd, t * 0.35);
          const shdC = PAL.barkShd.clone().lerp(PAL.barkDeep, t * 0.35);

          const ring = [];
          for (let k = 0; k < sides; k++) {
            const ang = (k / sides) * TAU;
            const ca = Math.cos(ang);
            const sa = Math.sin(ang);
            const ridge = flare > 0.0 && t < 0.35 ? 1.0 + 0.24 * (1.0 - t / 0.35) * Math.cos(ang * 5.0) : 1.0;
            const rad = r * ridge;
            const nx = right.x * ca + fwd.x * sa;
            const ny = right.y * ca + fwd.y * sa;
            const nz = right.z * ca + fwd.z * sa;

            ring.push(
              this.addVertex(
                points[i].x + nx * rad,
                points[i].y + ny * rad,
                points[i].z + nz * rad,
                nx, ny, nz,
                k / sides, t,
                sunC, shdC, 0.0
              )
            );
          }
          rings.push(ring);
        }

        for (let i = 0; i < n - 1; i++) {
          for (let k = 0; k < sides; k++) {
            const nk = (k + 1) % sides;
            const a = rings[i][k];
            const b = rings[i + 1][k];
            const c = rings[i + 1][nk];
            const d = rings[i][nk];
            this.indices.push(a, b, d, b, c, d);
          }
        }
      }

      addLeafCard({
        center,
        lobeCenter,
        cardNormal,
        cardRadius = 0.95,
        cupDepth = 0.16,
        roll = 0,
        tileIndex = 0,
        hCrownFrac = 0.5,
        aoFactor = 1.0,
      }) {
        const upRef = Math.abs(cardNormal.y) > 0.92 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
        const tRight = new THREE.Vector3().crossVectors(upRef, cardNormal).normalize();
        const tUp = new THREE.Vector3().crossVectors(cardNormal, tRight).normalize();

        const cr = Math.cos(roll);
        const sr = Math.sin(roll);
        const axX = tRight.clone().multiplyScalar(cr).addScaledVector(tUp, sr);
        const axY = tUp.clone().multiplyScalar(cr).addScaledVector(tRight, -sr);

        const u0 = tileIndex === 1 ? 0.51 : 0.01;
        const u1 = tileIndex === 1 ? 0.99 : 0.49;
        const v0 = 0.02;
        const v1 = 0.98;
        const uMid = (u0 + u1) * 0.5;
        const vMid = (v0 + v1) * 0.5;

        const sunCol = PAL.foliageLowSun.clone()
          .lerp(PAL.foliageMidSun, smoothstep(0.12, 0.62, hCrownFrac) * aoFactor)
          .lerp(PAL.foliageTopSun, smoothstep(0.52, 0.96, hCrownFrac) * aoFactor);
        const shdCol = PAL.foliageShdLow.clone()
          .lerp(PAL.foliageShdTop, smoothstep(0.22, 0.88, hCrownFrac) * aoFactor);

        const corners = [
          { lx: -1, ly: -1, u: u0, v: v0 },
          { lx:  1, ly: -1, u: u1, v: v0 },
          { lx:  1, ly:  1, u: u1, v: v1 },
          { lx: -1, ly:  1, u: u0, v: v1 },
        ];

        const cPos = center.clone().addScaledVector(cardNormal, cupDepth);
        const cProxyN = cPos.clone().sub(lobeCenter).normalize()
          .lerp(new THREE.Vector3(cPos.x - this.crownCenter.x, (cPos.y - this.crownCenter.y) + 0.75, cPos.z - this.crownCenter.z).normalize(), 0.42)
          .normalize();

        const iCenter = this.addVertex(
          cPos.x, cPos.y, cPos.z,
          cProxyN.x, cProxyN.y, cProxyN.z,
          uMid, vMid,
          sunCol, shdCol, 1.0
        );

        const cornerIndices = [];
        for (const c of corners) {
          const vx = center.x + (axX.x * c.lx + axY.x * c.ly) * cardRadius;
          const vy = center.y + (axX.y * c.lx + axY.y * c.ly) * cardRadius;
          const vz = center.z + (axX.z * c.lx + axY.z * c.ly) * cardRadius;

          const lnx = vx - lobeCenter.x;
          const lny = (vy - lobeCenter.y) * 1.35 + 0.25;
          const lnz = vz - lobeCenter.z;
          const lLen = Math.hypot(lnx, lny, lnz) || 1;

          const cnx = vx - this.crownCenter.x;
          const cny = (vy - this.crownCenter.y) + 0.75;
          const cnz = vz - this.crownCenter.z;
          const cLen = Math.hypot(cnx, cny, cnz) || 1;

          const nx = (lnx / lLen) * 0.65 + (cnx / cLen) * 0.35;
          const ny = (lny / lLen) * 0.65 + (cny / cLen) * 0.35;
          const nz = (lnz / lLen) * 0.65 + (cnz / cLen) * 0.35;

          cornerIndices.push(
            this.addVertex(vx, vy, vz, nx, ny, nz, c.u, c.v, sunCol, shdCol, 1.0)
          );
        }

        this.indices.push(
          iCenter, cornerIndices[0], cornerIndices[1],
          iCenter, cornerIndices[1], cornerIndices[2],
          iCenter, cornerIndices[2], cornerIndices[3],
          iCenter, cornerIndices[3], cornerIndices[0]
        );
      }

      /**
       * Sculpts a 3D Shingled-Petal Wisteria Raceme (`addShingledPetalWisteriaRaceme`):
       * Instead of round balloon spheres or flat cards, builds 30 overlapping, downward-cupped
       * 3D hooded flower petals spiraling down a slender curved stem (like real wisteria florets
       * and `01-title.png`).
       * Each floret has a deep-violet calyx base and a plump, cupped 3D petal hood that flares
       * outward and downward, creating unmistakable floral texture and ragged petal silhouettes!
       */
      addShingledPetalWisteriaRaceme({
        topX,
        topY,
        topZ,
        length = 1.45,
        topRadius = 0.24,
        swayX = 0.08,
        swayZ = 0.06,
        seed = 1,
      }) {
        const rand = createPRNG(seed);
        const floretCount = 28;
        const goldenAngle = 2.3999632;
        const rotStart = rand() * TAU;

        const baseSun = new THREE.Color();
        const baseShd = new THREE.Color();
        const bellySun = new THREE.Color();
        const bellyShd = new THREE.Color();
        const tipSun = new THREE.Color();
        const tipShd = new THREE.Color();

        for (let i = 0; i < floretCount; i++) {
          const t = i / (floretCount - 1); // 0 (top under leaves) -> 1 (hanging bud tip)
          // Envelope swells near t=0.14 and tapers gracefully to a pointed bud tail at t=1.0
          const env = Math.sin(Math.pow(t, 0.55) * Math.PI * 0.92) * (1.0 - t * 0.35) + 0.14 * (1.0 - t);
          const ringR = topRadius * env * (0.55 + 0.25 * (i % 2));
          const theta = rotStart + i * goldenAngle + (rand() - 0.5) * 0.18;

          const cx = topX + swayX * t * t + Math.cos(theta) * ringR * 0.48;
          const cy = topY - t * length;
          const cz = topZ + swayZ * t * t + Math.sin(theta) * ringR * 0.48;

          // Floret size scales down from plump open blossoms at top/mid to small tight buds at the tip
          const petalLen = (0.28 - t * 0.13) * (topRadius / 0.24) * (0.92 + rand() * 0.16);
          const petalWid = (0.19 - t * 0.09) * (topRadius / 0.24) * (0.92 + rand() * 0.16);
          const cupOut   = petalWid * 0.58;

          const dirX = Math.cos(theta);
          const dirZ = Math.sin(theta);
          const sideX = -dirZ;
          const sideZ = dirX;

          // Color progression along the raceme + per-floret calyx-to-tip gradient!
          // Calyx/base of each floret is darker violet so every single petal is visually separated!
          baseSun.copy(PAL.wistCalyxSun).lerp(PAL.wistUpperSun, smoothstep(0.0, 0.75, t));
          baseShd.copy(PAL.wistCalyxShd).lerp(PAL.wistUpperShd, smoothstep(0.0, 0.75, t));

          bellySun.copy(PAL.wistUpperSun)
            .lerp(PAL.wistMidSun, smoothstep(0.12, 0.52, t))
            .lerp(PAL.wistLowerSun, smoothstep(0.48, 0.88, t));
          bellyShd.copy(PAL.wistUpperShd)
            .lerp(PAL.wistMidShd, smoothstep(0.12, 0.52, t))
            .lerp(PAL.wistLowerShd, smoothstep(0.48, 0.88, t));

          tipSun.copy(PAL.wistMidSun)
            .lerp(PAL.wistLowerSun, smoothstep(0.08, 0.45, t))
            .lerp(PAL.wistBudTipSun, smoothstep(0.35, 0.85, t));
          tipShd.copy(PAL.wistMidShd)
            .lerp(PAL.wistLowerShd, smoothstep(0.08, 0.45, t))
            .lerp(PAL.wistBudTipShd, smoothstep(0.35, 0.85, t));

          // 6-vertex 3D cupped pea-blossom hood (6 triangles per 3D floret):
          // v0: top stem calyx attachment
          // v1: left upper shoulder
          // v2: right upper shoulder
          // v3: central outward-billowing hood crest (gives real 3D thickness!)
          // v4: left lower rounded wing lobe
          // v5: right lower rounded wing lobe
          // v6: bottom hanging keel tip
          const v0 = this.addVertex(
            cx, cy + petalLen * 0.18, cz,
            dirX * 0.4, 0.75, dirZ * 0.4,
            0.5, 0.0, baseSun, baseShd, 2.0
          );
          const v1 = this.addVertex(
            cx + dirX * cupOut * 0.55 - sideX * petalWid * 0.78,
            cy - petalLen * 0.18,
            cz + dirZ * cupOut * 0.55 - sideZ * petalWid * 0.78,
            dirX * 0.6 - sideX * 0.5, 0.35, dirZ * 0.6 - sideZ * 0.5,
            0.0, 0.35, bellySun, bellyShd, 2.0
          );
          const v2 = this.addVertex(
            cx + dirX * cupOut * 0.55 + sideX * petalWid * 0.78,
            cy - petalLen * 0.18,
            cz + dirZ * cupOut * 0.55 + sideZ * petalWid * 0.78,
            dirX * 0.6 + sideX * 0.5, 0.35, dirZ * 0.6 + sideZ * 0.5,
            1.0, 0.35, bellySun, bellyShd, 2.0
          );
          const v3 = this.addVertex(
            cx + dirX * cupOut * 1.18,
            cy - petalLen * 0.36,
            cz + dirZ * cupOut * 1.18,
            dirX, 0.28, dirZ,
            0.5, 0.5, tipSun, bellyShd, 2.0
          );
          const v4 = this.addVertex(
            cx + dirX * cupOut * 0.68 - sideX * petalWid * 0.92,
            cy - petalLen * 0.64,
            cz + dirZ * cupOut * 0.68 - sideZ * petalWid * 0.92,
            dirX * 0.5 - sideX * 0.6, 0.05, dirZ * 0.5 - sideZ * 0.6,
            0.1, 0.75, tipSun, tipShd, 2.0
          );
          const v5 = this.addVertex(
            cx + dirX * cupOut * 0.68 + sideX * petalWid * 0.92,
            cy - petalLen * 0.64,
            cz + dirZ * cupOut * 0.68 + sideZ * petalWid * 0.92,
            dirX * 0.5 + sideX * 0.6, 0.05, dirZ * 0.5 + sideZ * 0.6,
            0.9, 0.75, tipSun, tipShd, 2.0
          );
          const v6 = this.addVertex(
            cx + dirX * cupOut * 0.42,
            cy - petalLen * 1.0,
            cz + dirZ * cupOut * 0.42,
            dirX * 0.6, -0.35, dirZ * 0.6,
            0.5, 1.0, tipSun, tipShd, 2.0
          );

          this.indices.push(
            v0, v1, v3,
            v0, v3, v2,
            v1, v4, v3,
            v3, v5, v2,
            v4, v6, v3,
            v3, v6, v5
          );
        }
      }

      toGeometry() {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(this.positions, 3));
        geo.setAttribute('normal', new THREE.Float32BufferAttribute(this.normals, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(this.uvs, 2));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(this.colors, 3));
        geo.setAttribute('aShadowColor', new THREE.Float32BufferAttribute(this.shadowColors, 3));
        geo.setAttribute('aCardMode', new THREE.Float32BufferAttribute(this.cardModes, 1));
        geo.setIndex(this.indices);
        return geo;
      }
    }

    function buildGhibliTree({
      x = 0,
      y = 0,
      z = 0,
      scale = 1.0,
      sizeTier = 'large',
      hasWisteria = true,
      seed = 42,
    }) {
      const rand = createPRNG(seed);
      const randRange = (lo, hi) => lo + rand() * (hi - lo);

      const s = scale * (sizeTier === 'small' ? 0.68 : sizeTier === 'medium' ? 0.95 : 1.25);
      const crownCenter = new THREE.Vector3(x, y + 3.4 * s, z);
      const builder = new GouacheTreeBuilder(crownCenter);

      // 1. Gnarled Asymmetric Trunk & Wide Spreading Umbrella Boughs
      const leanX = randRange(-0.35, 0.35) * s;
      const leanZ = randRange(-0.28, 0.28) * s;
      const trunkPts = [
        new THREE.Vector3(x, y - 0.12, z),
        new THREE.Vector3(x + leanX * 0.45, y + 0.68 * s, z + leanZ * 0.45),
        new THREE.Vector3(x + leanX * 0.90, y + 1.38 * s, z + leanZ * 0.90),
        new THREE.Vector3(x + leanX * 0.72, y + 2.02 * s, z + leanZ * 0.72),
      ];
      const rBase = (sizeTier === 'large' ? 0.42 : 0.34) * s;
      const rFork = (sizeTier === 'large' ? 0.25 : 0.20) * s;
      builder.addTaperedLimb(trunkPts, rBase, rFork, 8, 0.72);

      const boughCount = sizeTier === 'small' ? 5 : sizeTier === 'medium' ? 6 : 7;
      const lobes = [];

      for (let b = 0; b < boughCount; b++) {
        const az = (b / boughCount) * TAU + randRange(-0.22, 0.22);
        const isLowerShelf = b % 2 === 0;
        const reach = (isLowerShelf ? randRange(2.10, 2.65) : randRange(1.48, 2.00)) * s;
        const rise = (isLowerShelf ? randRange(0.75, 1.10) : randRange(1.38, 1.75)) * s;
        const startY = y + (isLowerShelf ? 1.45 : 1.78) * s;

        const p0 = new THREE.Vector3(x + leanX * 0.72, startY, z + leanZ * 0.72);
        const p1 = new THREE.Vector3(
          x + Math.cos(az) * reach * 0.54,
          startY + rise * 0.58,
          z + Math.sin(az) * reach * 0.54
        );
        const p2 = new THREE.Vector3(
          x + Math.cos(az) * reach,
          startY + rise,
          z + Math.sin(az) * reach
        );
        builder.addTaperedLimb([p0, p1, p2], rFork * 0.64, rFork * 0.22, 6, 0.0);

        for (const side of [-1, 1]) {
          const subAz = az + side * randRange(0.45, 0.68);
          const subReach = randRange(0.85, 1.15) * s;
          const subEnd = new THREE.Vector3(
            p1.x + Math.cos(subAz) * subReach,
            p1.y + randRange(0.28, 0.52) * s,
            p1.z + Math.sin(subAz) * subReach
          );
          builder.addTaperedLimb([p1, subEnd], rFork * 0.36, rFork * 0.10, 5, 0.0);
        }

        const rx = randRange(1.36, 1.68) * s;
        lobes.push({
          center: new THREE.Vector3(p2.x, p2.y + 0.28 * s, p2.z),
          rx,
          ry: rx * randRange(0.52, 0.62),
          rz: rx * randRange(0.90, 1.12),
          hFrac: isLowerShelf ? 0.35 : 0.68,
          isRim: true,
          isLowerShelf,
        });
      }

      const topShelves = [
        { ox: -0.58, oy: 3.68, oz:  0.48, rx: 1.62, ry: 0.90, hFrac: 0.82 },
        { ox:  0.64, oy: 3.78, oz: -0.50, rx: 1.56, ry: 0.86, hFrac: 0.86 },
        { ox:  0.00, oy: 4.22, oz:  0.05, rx: 1.68, ry: 0.92, hFrac: 0.98 },
      ];
      for (const ts of topShelves) {
        lobes.push({
          center: new THREE.Vector3(x + ts.ox * s, y + ts.oy * s, z + ts.oz * s),
          rx: ts.rx * s,
          ry: ts.ry * s,
          rz: ts.rx * s,
          hFrac: ts.hFrac,
          isRim: false,
          isLowerShelf: false,
        });
      }

      // 2. Populate each shelf with crossed & radially-tilted Ragged Leaf-Cluster Cards
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      for (let lIdx = 0; lIdx < lobes.length; lIdx++) {
        const lobe = lobes[lIdx];
        const cardCount = sizeTier === 'small' ? 20 : 28;
        for (let i = 0; i < cardCount; i++) {
          const t = (i + 0.5) / cardCount;
          const uy = -0.45 + t * 1.43;
          const rHoriz = Math.sqrt(Math.max(0.05, 1.0 - Math.min(1.0, uy * uy)));
          const theta = i * goldenAngle + lIdx * 2.1;

          const jitterR = 0.72 + 0.44 * ((i * 7 + lIdx * 3) % 5) / 4;
          const ux = Math.cos(theta) * rHoriz * jitterR;
          const uz = Math.sin(theta) * rHoriz * jitterR;

          const pos = new THREE.Vector3(
            lobe.center.x + ux * lobe.rx,
            lobe.center.y + uy * lobe.ry,
            lobe.center.z + uz * lobe.rz
          );

          const radialDir = new THREE.Vector3(ux, uy * 1.2 + 0.2, uz).normalize();
          const tiltAxis = new THREE.Vector3(-Math.sin(theta), 0.35, Math.cos(theta)).normalize();
          const cardNormal = radialDir.clone().lerp(tiltAxis, (i % 2 === 0 ? 0.52 : -0.52)).normalize();

          const cardRadius = randRange(0.82, 1.14) * s;
          const hasFlowers = uy > 0.18 && (i + lIdx) % 4 === 0 ? 1 : 0;
          const hLocal = Math.max(0, Math.min(1, lobe.hFrac * 0.58 + (uy * 0.5 + 0.5) * 0.42));
          const ao = smoothstep(-0.50, 0.35, uy) * 0.54 + 0.46;

          builder.addLeafCard({
            center: pos,
            lobeCenter: lobe.center,
            cardNormal,
            cardRadius,
            cupDepth: cardRadius * 0.18,
            roll: rand() * TAU,
            tileIndex: hasFlowers,
            hCrownFrac: hLocal,
            aoFactor: ao,
          });
        }
      }

      // 3. 3D Shingled-Petal Wisteria Cascades draped along the outer bough rims (matching 01-title.png!)
      if (hasWisteria) {
        const rimLobes = lobes.filter((l) => l.isRim);
        for (let lIdx = 0; lIdx < rimLobes.length; lIdx++) {
          const lobe = rimLobes[lIdx];
          const outBaseAng = Math.atan2(lobe.center.z - z, lobe.center.x - x);
          const groupCount = lobe.isLowerShelf
            ? (sizeTier === 'small' ? 3 : 4)
            : (sizeTier === 'small' ? 2 : 3);

          for (let g = 0; g < groupCount; g++) {
            const frac = (g - (groupCount - 1) * 0.5) / Math.max(1, groupCount);
            const baseAng = outBaseAng + frac * 1.85 + randRange(-0.10, 0.10);
            // Place on the outer rim of the leaf shelf (0.82..1.05 * rx) so cascades hang in full view!
            const baseR = lobe.rx * randRange(0.82, 1.04);

            // Curtain trio: 1 long hero raceme + 2 flanking medium/short companion racemes right beside it
            const trio = lobe.isLowerShelf ? [
              { dAng: -0.14, dR: -0.06, lenMul: 0.74, radMul: 0.85 },
              { dAng:  0.00, dR:  0.02, lenMul: 1.05, radMul: 1.00 },
              { dAng:  0.15, dR: -0.04, lenMul: 0.84, radMul: 0.90 },
            ] : [
              { dAng: -0.08, dR:  0.00, lenMul: 0.88, radMul: 0.92 },
              { dAng:  0.10, dR: -0.05, lenMul: 0.68, radMul: 0.82 },
            ];

            for (let sc = 0; sc < trio.length; sc++) {
              const sub = trio[sc];
              const ang = baseAng + sub.dAng;
              const r = baseR + sub.dR * s;
              const px = lobe.center.x + Math.cos(ang) * r;
              const pz = lobe.center.z + Math.sin(ang) * r;
              const py = lobe.center.y - lobe.ry * randRange(0.08, 0.24);

              const rawLen = randRange(1.05, 1.58) * s * sub.lenMul;
              const maxSafeLen = Math.max(0.65, py - (y + 0.95));
              const len = Math.min(rawLen, maxSafeLen);
              const topRad = randRange(0.21, 0.27) * s * sub.radMul;

              builder.addShingledPetalWisteriaRaceme({
                topX: px,
                topY: py,
                topZ: pz,
                length: len,
                topRadius: topRad,
                swayX: Math.cos(ang) * 0.10 * s,
                swayZ: Math.sin(ang) * 0.10 * s,
                seed: seed + lIdx * 37 + g * 11 + sc * 5,
              });
            }
          }
        }
      }

      return builder.toGeometry();
    }

    function createGouacheTreeMaterial(atlasTex) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uAtlas: { value: atlasTex },
          uSunDir: { value: new THREE.Vector3(0.48, 0.76, 0.44).normalize() },
          uRimColor: { value: new THREE.Color('#e8fc96') },
        },
        side: THREE.DoubleSide,
        transparent: false,
        depthWrite: true,
        vertexColors: true,
        vertexShader: /* glsl */ `
          attribute vec3 aShadowColor;
          attribute float aCardMode;
          varying vec2 vUv;
          varying vec3 vColorSun;
          varying vec3 vColorShd;
          varying vec3 vNormal;
          varying vec3 vWorldPos;
          varying float vCardMode;

          void main() {
            vUv = uv;
            vColorSun = color;
            vColorShd = aShadowColor;
            vCardMode = aCardMode;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            vNormal = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform sampler2D uAtlas;
          uniform vec3 uSunDir;
          uniform vec3 uRimColor;
          varying vec2 vUv;
          varying vec3 vColorSun;
          varying vec3 vColorShd;
          varying vec3 vNormal;
          varying vec3 vWorldPos;
          varying float vCardMode;

          void main() {
            vec3 rawN = gl_FrontFacing ? normalize(vNormal) : -normalize(vNormal);
            vec3 L = normalize(uSunDir);
            vec3 V = normalize(cameraPosition - vWorldPos);

            if (vCardMode < 0.5) {
              // 0.0: Solid Gnarled Trunk & Branches
              float ndl = dot(rawN, L) * 0.5 + 0.5;
              float cel = smoothstep(0.32, 0.46, ndl) * 0.65 + smoothstep(0.66, 0.80, ndl) * 0.35;
              vec3 barkCol = mix(vColorShd, vColorSun, cel);
              gl_FragColor = vec4(barkCol, 1.0);
            } else if (vCardMode < 1.5) {
              // 1.0: Gouache Leaf-Cluster Card (with warm Ghibli hemisphere wrap so shadow sides stay lush emerald!)
              vec4 texel = texture2D(uAtlas, vUv);
              if (texel.a < 0.44) discard;

              vec3 N = normalize(mix(rawN, vec3(rawN.x * 0.5, max(rawN.y, 0.38), rawN.z * 0.5), 0.35));
              float ndl = dot(N, L) * 0.5 + 0.5;
              float cel = 0.22 + 0.44 * smoothstep(0.22, 0.42, ndl) + 0.34 * smoothstep(0.56, 0.76, ndl);

              float isFlower = clamp((texel.r - texel.g) * 3.2 + (min(texel.r, texel.b) - 0.62) * 3.0, 0.0, 1.0);
              vec3 leafTint = mix(vColorShd, vColorSun, cel) * (0.68 + 0.54 * texel.rgb);
              vec3 flowerCol = texel.rgb * mix(vec3(0.86, 0.80, 0.90), vec3(1.06, 1.03, 1.0), cel);
              vec3 col = mix(leafTint, flowerCol, isFlower);

              float fres = 1.0 - clamp(abs(dot(N, V)), 0.0, 1.0);
              float rim = smoothstep(0.45, 0.85, fres) * smoothstep(0.50, 0.85, ndl);
              col = mix(col, uRimColor, rim * 0.26 * (1.0 - isFlower));
              gl_FragColor = vec4(col, 1.0);
            } else {
              // 2.0: 3D Shingled-Petal Wisteria Floret
              float ndl = dot(rawN, L) * 0.5 + 0.5;
              float wrapLit = 0.25 + 0.45 * smoothstep(0.20, 0.48, ndl) + 0.30 * smoothstep(0.56, 0.82, ndl);
              vec3 col = mix(vColorShd, vColorSun, wrapLit);

              // Subtle petal-edge translucency & rim glow
              float fres = 1.0 - clamp(abs(dot(rawN, V)), 0.0, 1.0);
              float rim = smoothstep(0.42, 0.86, fres) * smoothstep(0.25, 0.95, vUv.y);
              col = mix(col, vec3(1.0, 0.95, 1.0), rim * 0.34);

              gl_FragColor = vec4(col, 1.0);
            }
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `,
      });
    }

    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    renderer.setScissorTest(true);

    const atlasTex = createGouacheFoliageAtlas();
    const treeMat = createGouacheTreeMaterial(atlasTex);

    function createGroundPedestal(radius = 5.2) {
      const g = new THREE.Group();
      const top = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius * 1.04, 0.28, 32),
        new THREE.MeshBasicMaterial({ color: '#6ec246' })
      );
      top.position.y = -0.14;
      g.add(top);

      const shd = new THREE.Mesh(
        new THREE.CircleGeometry(radius * 0.72, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: '#468a32' })
      );
      shd.position.y = 0.01;
      g.add(shd);
      return g;
    }

    const sceneSides = new THREE.Scene();
    sceneSides.background = new THREE.Color('#74bcf7');
    sceneSides.add(createGroundPedestal(5.2));
    const heroTreeGeo = buildGhibliTree({ x: 0, y: 0, z: 0, scale: 1.0, sizeTier: 'large', hasWisteria: true, seed: 77 });
    const heroTreeMesh = new THREE.Mesh(heroTreeGeo, treeMat);
    sceneSides.add(heroTreeMesh);

    const sceneSizes = new THREE.Scene();
    sceneSizes.background = new THREE.Color('#74bcf7');
    const meadowGround = new THREE.Mesh(
      new THREE.PlaneGeometry(46, 26).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: '#6ec246' })
    );
    sceneSizes.add(meadowGround);

    const smallGeo = buildGhibliTree({ x: -8.6, y: 0, z: 0, scale: 1.0, sizeTier: 'small', hasWisteria: true, seed: 12 });
    const medGeo   = buildGhibliTree({ x: -0.8, y: 0, z: 0, scale: 1.0, sizeTier: 'medium', hasWisteria: false, seed: 34 });
    const largeGeo = buildGhibliTree({ x:  8.4, y: 0, z: 0, scale: 1.0, sizeTier: 'large', hasWisteria: true, seed: 77 });
    const combinedSizesGeo = mergeGeometries([smallGeo, medGeo, largeGeo], false);
    sceneSizes.add(new THREE.Mesh(combinedSizesGeo, treeMat));

    const humanGroup = new THREE.Group();
    humanGroup.position.set(3.6, 0, 1.2);
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.85, 6, 12), new THREE.MeshBasicMaterial({ color: '#cbd5e1' }));
    body.position.y = 0.72;
    const cape = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.0, 8), new THREE.MeshBasicMaterial({ color: '#dc2626' }));
    cape.position.set(0, 0.70, -0.12);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 14, 12), new THREE.MeshBasicMaterial({ color: '#94a3b8' }));
    head.position.y = 1.42;
    humanGroup.add(body, cape, head);
    sceneSizes.add(humanGroup);

    const labelsEl = document.getElementById('labels');
    const cam = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

    function renderMode(mode) {
      const W = window.innerWidth;
      const H = window.innerHeight;
      renderer.setSize(W, H);
      labelsEl.innerHTML = '';

      if (mode === 'all-sizes') {
        renderer.setViewport(0, 0, W, H);
        renderer.setScissor(0, 0, W, H);
        cam.aspect = W / H;
        cam.fov = 40;
        cam.updateProjectionMatrix();
        cam.position.set(0, 4.2, 23.5);
        cam.lookAt(0, 3.2, 0);
        renderer.render(sceneSizes, cam);

        const tags = [
          { text: 'Small Young Wisteria (~4.2m)', left: '12%', top: '88%' },
          { text: 'Medium Meadow Oak / Crown Blossom Tree (~5.8m)', left: '39%', top: '88%' },
          { text: '1.7m Player Scale', left: '56%', top: '91%' },
          { text: 'Large Ancient Wisteria Hero Tree (~7.4m) · 1 Draw Call', left: '67%', top: '88%' },
        ];
        for (const t of tags) {
          const d = document.createElement('div');
          d.className = 'panel-tag';
          d.style.left = t.left;
          d.style.top = t.top;
          d.textContent = t.text;
          labelsEl.appendChild(d);
        }
      } else {
        const cols = 3, rows = 2;
        const pw = Math.floor(W / cols);
        const ph = Math.floor(H / rows);
        const views = [
          { label: '0° Front View (Eye-Level)', pos: [0, 3.1, 13.0], target: [0, 3.2, 0] },
          { label: '90° Right Profile', pos: [13.0, 3.1, 0], target: [0, 3.2, 0] },
          { label: '180° Rear View', pos: [0, 3.1, -13.0], target: [0, 3.2, 0] },
          { label: '270° Left Profile', pos: [-13.0, 3.1, 0], target: [0, 3.2, 0] },
          { label: '3/4 Close-Up on 3D Shingled-Petal Wisteria', pos: [6.0, 1.85, 6.2], target: [1.1, 2.35, 1.1] },
          { label: '90° Overhead Canopy View', pos: [0, 16.5, 0.01], target: [0, 3.0, 0] },
        ];

        views.forEach((v, idx) => {
          const c = idx % cols;
          const r = Math.floor(idx / cols);
          const vx = c * pw;
          const vy = (rows - 1 - r) * ph;
          renderer.setViewport(vx, vy, pw, ph);
          renderer.setScissor(vx, vy, pw, ph);
          cam.aspect = pw / ph;
          cam.fov = 42;
          cam.updateProjectionMatrix();
          cam.position.set(...v.pos);
          cam.lookAt(...v.target);
          renderer.render(sceneSides, cam);

          const tag = document.createElement('div');
          tag.className = 'panel-tag';
          tag.style.left = `${c * (100 / cols) + 1.2}%`;
          tag.style.top = `${r * (100 / rows) + 2.0}%`;
          tag.textContent = v.label;
          labelsEl.appendChild(tag);
        });
      }
    }

    const params = new URLSearchParams(window.location.search);
    const initialMode = params.get('mode') || 'all-sides';
    renderMode(initialMode);

    window.__TREE_STUDY__ = {
      ready: true,
      setMode: renderMode,
      heroTriangles: heroTreeGeo.index.count / 3,
      allSizesTriangles: combinedSizesGeo.index.count / 3,
    };
  </script>
</body>
</html>
