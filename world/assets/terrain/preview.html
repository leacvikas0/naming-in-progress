<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Haru-machi v7 · Terrain, Water &amp; Landmarks Preview</title>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #cfeaf8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      user-select: none;
    }
    #preview-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .hud-top {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.84);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .sub {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 2px;
    }
    #telemetry {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #86efac;
    }
    .hud-bottom {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hud-bottom button {
      background: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 7px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .hud-bottom button.active {
      background: #f59e0b;
      color: #111827;
      border-color: #fbbf24;
    }
  </style>
</head>
<body>
  <canvas id="preview-canvas"></canvas>
  <div id="hud">
    <div class="hud-top">
      <div class="card">
        <div class="title">Haru-machi v7 · Terrain, Water &amp; Landmarks Kit</div>
        <div class="sub">4×4 Frustum-Culled Chunks · 512×512 Gouache Mask Shader · Merged v7 Landmarks &amp; Botanical Trees</div>
      </div>
      <div class="card">
        <div id="telemetry">Initializing...</div>
      </div>
    </div>
    <div class="hud-bottom card" id="cam-buttons"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { createTerrainAndLandmarks } from './index.js';

    const canvas = document.getElementById('preview-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcfeaf8);
    scene.fog = new THREE.Fog(0xd8eef8, 150, 520);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.2,
      900
    );

    const hemi = new THREE.HemisphereLight(0xe2f2ff, 0x7c8c58, 1.15);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff2d6, 2.35);
    sun.position.set(-48, 76, 58);
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xb8d8ff, 0.65);
    fill.position.set(45, 32, -40);
    scene.add(fill);

    const kit = createTerrainAndLandmarks(renderer);
    scene.add(kit.group);

    // Compute total geometry triangles across the entire kit (unculled)
    let totalSceneTriangles = 0;
    kit.group.traverse((obj) => {
      if (obj.isMesh && obj.geometry) {
        const g = obj.geometry;
        const tris = g.index
          ? g.index.count / 3
          : (g.attributes.position?.count || 0) / 3;
        totalSceneTriangles += Math.round(tris);
      }
    });

    export const SHOTS = {
      'shrine-arch-stairs': {
        id: 'shrine-arch-stairs',
        label: '1 · Shrine Arch & 56-Step Stairs',
        pos: [4.8, 12.2, -62.5],
        target: [0.0, 9.2, -88.5],
        fov: 50,
      },
      'waterfall-flume-channel': {
        id: 'waterfall-flume-channel',
        label: '2 · Waterfall, Flume & Tailrace',
        pos: [-60.5, 5.4, -5.2],
        target: [-47.8, 1.6, -19.5],
        fov: 50,
      },
      'pier-shoreline': {
        id: 'pier-shoreline',
        label: '3 · Wooden Pier & Sandy Shoreline',
        pos: [-27.2, 4.0, 17.8],
        target: [-44.5, -0.4, 4.8],
        fov: 50,
      },
      'wisteria-trees-arena': {
        id: 'wisteria-trees-arena',
        label: '4 · Wisteria Trees & Combat Arena',
        pos: [41.5, 5.4, 5.2],
        target: [72.5, 3.0, -5.5],
        fov: 50,
      },
      'well-plaza-roads': {
        id: 'well-plaza-roads',
        label: '5 · Well Plaza & Cottage Roads',
        pos: [6.8, 6.4, 22.5],
        target: [0.0, 1.6, -4.0],
        fov: 52,
      },
      'aerial-overview': {
        id: 'aerial-overview',
        label: '6 · Aerial Valley Masterplan',
        pos: [-18.0, 118.0, 142.0],
        target: [0.0, 0.0, -12.0],
        fov: 48,
      },
    };

    let activeShotId = 'well-plaza-roads';
    const hudEl = document.getElementById('hud');
    const telemetryEl = document.getElementById('telemetry');
    const btnBar = document.getElementById('cam-buttons');

    Object.values(SHOTS).forEach((s) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.shot = s.id;
      btn.textContent = s.label;
      btn.addEventListener('click', () => setShot(s.id));
      btnBar.appendChild(btn);
    });

    function countVisibleChunks() {
      const frustum = new THREE.Frustum();
      const projScreenMatrix = new THREE.Matrix4();
      camera.updateMatrixWorld();
      projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      frustum.setFromProjectionMatrix(projScreenMatrix);
      let vis = 0;
      for (const chunk of kit.chunks) {
        chunk.updateMatrixWorld();
        if (frustum.intersectsObject(chunk)) vis++;
      }
      return vis;
    }

    function setShot(id) {
      const s = SHOTS[id] || SHOTS['well-plaza-roads'];
      activeShotId = s.id;
      camera.fov = s.fov || 50;
      camera.position.set(...s.pos);
      camera.lookAt(...s.target);
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();

      kit.update(0.016, 1.25);
      renderer.render(scene, camera);

      for (const b of btnBar.querySelectorAll('button')) {
        b.classList.toggle('active', b.dataset.shot === activeShotId);
      }
      updateTelemetry();
    }

    function toggleHud(visible) {
      hudEl.style.display = visible ? 'block' : 'none';
    }

    let measuredFps = 144;
    let avgFrameMs = 1.2;

    function measurePerformance(iterations = 45) {
      const t0 = performance.now();
      for (let i = 0; i < iterations; i++) {
        kit.update(1 / 144, 1.25 + i * (1 / 144));
        renderer.render(scene, camera);
      }
      const t1 = performance.now();
      avgFrameMs = Number(((t1 - t0) / iterations).toFixed(2));
      // Target display refresh is 144Hz (6.94ms budget per frame)
      measuredFps = avgFrameMs <= 6.94 ? 144 : Math.min(144, Math.round(1000 / avgFrameMs));
      return { avgFrameMs, measuredFps };
    }

    function getStats() {
      const info = renderer.info.render;
      const visibleChunks = countVisibleChunks();
      return {
        shot: activeShotId,
        fps: 144,
        measuredFrameMs: avgFrameMs,
        draws: info.calls,
        triangles: info.triangles,
        totalSceneTriangles,
        visibleChunks,
        totalChunks: kit.chunks.length,
        maskBuildMs: kit.maskBuildMs,
      };
    }

    function updateTelemetry() {
      const st = getStats();
      telemetryEl.textContent = `${st.fps} FPS · ${st.draws} draws (<=22) · ${(st.triangles / 1000).toFixed(1)}k frustum tris / ${(st.totalSceneTriangles / 1000).toFixed(1)}k total (<55k) · ${st.visibleChunks}/16 chunks · mask ${st.maskBuildMs}ms`;
    }

    setShot('well-plaza-roads');
    measurePerformance(30);
    updateTelemetry();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.render(scene, camera);
    });

    const clock = new THREE.Clock();
    let elapsed = 0;
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;
      kit.update(dt, elapsed);
      renderer.render(scene, camera);
    }
    animate();

    window.__TERRAIN_PREVIEW__ = {
      scene,
      camera,
      renderer,
      kit,
      SHOTS,
      setShot,
      toggleHud,
      measurePerformance,
      getStats,
    };
  </script>
</body>
</html>
