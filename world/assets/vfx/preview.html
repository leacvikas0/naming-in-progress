      * { box-sizing: border-box; }

        margin: 0;

        pointer-events: auto;
        background: rgba(15, 23, 42, 0.84);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.16);

        createCinderFallSystem,
        createStormLanceSystem,
        createSwordVfxSystem,
        createMageBoltSystem,
        createArtoriousVfxSystem,
        createAimArrowSystem,
      } from './index.js';

      const canvas = document.getElementById('scene');
      const titleEl = document.getElementById('title');
      const statsEl = document.getElementById('stats');
      const playBtn = document.getElementById('play-btn');
      const scrubSlider = document.getElementById('scrub-slider');
      const timeLabel = document.getElementById('time-label');

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        preserveDrawingBuffer: true,
        powerPreference: 'high-performance',

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.02;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd8eef5);
      scene.fog = new THREE.Fog(0xd8eef5, 165, 520);

      const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.2, 900);
      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;

      // 1. Authentic Haru-machi Time-of-Day Sky & Post-Processing Pipeline (`post.js`)
      const sky = createTimeOfDaySky({ quality: 'high', camera });
      scene.add(sky.group);

      const post = createWorldPost({
        renderer,
        scene,
        camera,
        width: window.innerWidth,
        height: window.innerHeight,
        enabled: true,
        aaSamples: 4,
      });

      // 2. Real Haru-machi East Wisteria Combat Ring Terrain, Landmarks, Botanical Wisteria Trees & Meadow
      const stageGroup = new THREE.Group();
      stageGroup.name = 'harumachiWisteriaArenaWorldStage';
      scene.add(stageGroup);

      const terrainKit = createTerrainAndLandmarks(renderer, {
        includeBuildings: false,
        includeHorizonClouds: false,
      });
      stageGroup.add(terrainKit.group);

      const treeShadowData = buildTreeShadowUniformArray();
      const meadow = createToroidalMeadow({
        profile: 'tablet',
        worldMaskTexture: terrainKit.worldMaskTex,
        sampleHeight: terrainHeightAt,
        worldExtent: INNER_EXTENT,
        treeShadows: treeShadowData.treeShadowVecs,
        treeCount: treeShadowData.treeCount,
      });
      stageGroup.add(meadow.group);

      // 3. Stage 3 Cel-Shaded Characters inside East Wisteria Arena
      const actorsGroup = new THREE.Group();
      actorsGroup.name = 'arenaCombatActors';
      scene.add(actorsGroup);

      const DEFAULT_MAGE_POS = [59.8, walkableHeightAt(59.8, -4.0), -4.0];
      const DEFAULT_KNIGHT_POS = [59.1, walkableHeightAt(59.1, -2.05), -2.05];
      const DEFAULT_KNIGHT_ROTY = Math.PI * 0.5 - 0.16;

      const charKit = createCharactersKit();
      const [mageChar, knightChar, skelWarrior, skelMage] = await Promise.all([
        charKit.createCharacter('Mage', {
          position: [...DEFAULT_MAGE_POS],
          rotY: Math.PI * 0.5,
          initialClip: 'cast_shoot',
          initialTime: 0.30,
        }),
        charKit.createCharacter('Knight', {
          position: [...DEFAULT_KNIGHT_POS],
          rotY: DEFAULT_KNIGHT_ROTY,
          initialClip: 'Idle_Combat',
          initialTime: 0.35,
        }),
        charKit.createCharacter('Skeleton_Warrior', {
          position: [75.10, walkableHeightAt(75.10, -3.80), -3.80],
          rotY: -1.15,
          initialClip: 'Idle_Combat',
          initialTime: 0.40,
        }),
        charKit.createCharacter('Skeleton_Mage', {
          position: [77.2, walkableHeightAt(77.2, -5.65), -5.65],
          rotY: -1.35,
          initialClip: 'Idle_Combat',
          initialTime: 0.55,
        }),

      actorsGroup.add(mageChar.group, knightChar.group, skelWarrior.group, skelMage.group);

        scene,
        getGroundHeight: walkableHeightAt,
      });

      const shatterlance = createShatterlanceSystem({
        scene,
        getGroundHeight: walkableHeightAt,
      });

      const cinderFall = createCinderFallSystem({
        scene,
        getGroundHeight: walkableHeightAt,
      });

      const stormLance = createStormLanceSystem({
        scene,
        getGroundHeight: walkableHeightAt,
      });

      const swordVfx = createSwordVfxSystem({
        scene,
        getGroundHeight: walkableHeightAt,
      });
      swordVfx.attachToKnight(knightChar);

      const mageBolt = createMageBoltSystem({
        scene,
        getGroundHeight: walkableHeightAt,
      });

      const artoriousVfx = createArtoriousVfxSystem({
        scene,
        getGroundHeight: walkableHeightAt,
      });

      const aimArrow = createAimArrowSystem({
        scene,
        getGroundHeight: walkableHeightAt,
      });

      const allSystems = {
        frostLance,
        shatterlance,
        cinderFall,
        stormLance,
        swordVfx,
        mageBolt,
        artoriousVfx,
        aimArrow,

      const CAST_DIR = new THREE.Vector3(1.0, 0.0, 0.0);

      function clearAllVfx() {
        frostLance.clear();
        shatterlance.clear();
        cinderFall.clear();
        stormLance.clear();
        swordVfx.clear();
        mageBolt.clear();
        artoriousVfx.clear();
        aimArrow.clear();
      }

      function applyTimeOfDayMode(todMode, simTime = 1.0) {
        const skyState = sky.setTimeOfDay(todMode);
        post.setTimeOfDayGrade(skyState.t);
        scene.fog.color.copy(skyState.fogColor);
        scene.background.copy(skyState.fogColor);

        if (terrainKit.terrainMat?.uniforms) {
          terrainKit.terrainMat.uniforms.uSunDir.value.copy(skyState.activeLightDir);
          terrainKit.terrainMat.uniforms.uFogColor.value.copy(skyState.fogColor);
          terrainKit.terrainMat.uniforms.uLightTint.value.copy(skyState.worldTint);
        }
        if (meadow?.sharedUniforms) {
          meadow.sharedUniforms.uSunDir.value.copy(skyState.activeLightDir);
          meadow.sharedUniforms.uLightTint.value.copy(skyState.worldTint);
        }
        if (terrainKit.treesSys) {
          terrainKit.treesSys.setSunDirection(skyState.activeLightDir);
          terrainKit.treesSys.setTimeOfDay(skyState.daylight, skyState.worldTint, skyState.fogColor);
        }

        terrainKit.update(
          0.016,
          simTime,
          skyState.activeLightDir,
          skyState.daylight,
          skyState.fogColor,
          skyState.worldTint
        );
        meadow.update(simTime, _meadowFocus);
        sky.update(simTime);

        const lightingCfg = {
          sunDir: skyState.activeLightDir,
          daylight: skyState.daylight,
          glowBoost: todMode === 'evening' ? 0.96 : 0.28,
        };
        frostLance.setLighting(lightingCfg);
        shatterlance.setLighting(lightingCfg);
        cinderFall.setLighting(lightingCfg);
        stormLance.setLighting(lightingCfg);
        swordVfx.setLighting(lightingCfg);
        mageBolt.setLighting(lightingCfg);
        artoriousVfx.setLighting(lightingCfg);
        aimArrow.setLighting(lightingCfg);
      }

        '16-mage-bolt-volley': {

          fov: 45,
          boltConfig: {

          },
          poses: {

            skelW: { clip: 'Idle_Combat', time: 0.40, dy: 0.0, pitch: 0.0 },
            skelM: { clip: 'Idle_Combat', time: 0.55, dy: 0.0, pitch: 0.0 },

        },
        '17-aim-arrow-frost-lance': {
          id: '17-aim-arrow-frost-lance',
          system: 'aimArrow',
          label: '17. Terrain-Conforming Aim Arrow — Frost Lance Mode (Fixed 14.5m Glacial Cyan-White & Cerulean SDF)',
          tod: 'day',
          time: 0.45,
          pos: [55.2, 5.45, 1.85],
          target: [68.4, 0.95, -4.0],
          fov: 48,
          aimOptions: {
            origin: [60.4, walkableHeightAt(60.4, -4.0), -4.0],
            direction: [1.0, 0.0, 0.0],
            mode: 'frost_lance',
            distance: 14.5,
          },
          poses: {
            mage: { clip: 'cast_spell', time: 0.40 },
            knight: { clip: 'Idle_Combat', time: 0.35 },
            skelW: { clip: 'Idle_Combat', time: 0.40, dy: 0.0, pitch: 0.0 },
            skelM: { clip: 'Idle_Combat', time: 0.55, dy: 0.0, pitch: 0.0 },
          },
        },
        '18-aim-arrow-cinder-fall': {
          id: '18-aim-arrow-cinder-fall',
          system: 'aimArrow',
          label: '18. Terrain-Conforming Aim Arrow — Cinder Fall Mode (Variable 11.8m Solar Amber-Crimson & Impact Reticle)',
          tod: 'day',
          time: 0.45,
          pos: [55.8, 5.85, 2.45],
          target: [67.8, 0.95, -4.0],
          fov: 48,
          aimOptions: {
            origin: [60.4, walkableHeightAt(60.4, -4.0), -4.0],
            direction: [1.0, 0.0, 0.0],
            mode: 'cinder_fall',
            distance: 11.8,
          },
          poses: {
            mage: { clip: 'cast_spell', time: 0.44 },
            knight: { clip: 'Idle_Combat', time: 0.35 },
            skelW: { clip: 'Idle_Combat', time: 0.40, dy: 0.0, pitch: 0.0 },
            skelM: { clip: 'Idle_Combat', time: 0.55, dy: 0.0, pitch: 0.0 },
          },
        },
      };

      let playing = false;
      let currentShotDef = SHOT_DEFS['03-apex-crown-impact'];

      function seekActiveSystem(def, timeSeconds) {
        if (def.system === 'shatterlance') {
          shatterlance.seek(timeSeconds);
        } else if (def.system === 'cinderFall') {
          cinderFall.seek(timeSeconds);
        } else if (def.system === 'stormLance') {
          stormLance.seek(timeSeconds);
        } else if (def.system === 'swordVfx') {
          swordVfx.seek(timeSeconds, def.swordPose);
        } else if (def.system === 'mageBolt') {
          mageBolt.seek(timeSeconds, def.boltConfig);
        } else if (def.system === 'artoriousVfx') {
          artoriousVfx.seek(timeSeconds, def.artoriousOptions);
        } else if (def.system === 'aimArrow') {
          aimArrow.seek(timeSeconds, def.aimOptions);
        } else {
          frostLance.seek(timeSeconds);
        }
      }

      function seekCharactersAndVfx(timeSeconds, poses = null, def = currentShotDef) {
        const kPos = def?.knightPos || DEFAULT_KNIGHT_POS;
        const kRotY = def?.knightRotY ?? DEFAULT_KNIGHT_ROTY;
        knightChar.group.position.set(kPos[0], kPos[1], kPos[2]);
        knightChar.group.rotation.y = kRotY;

        mageChar.group.position.y = BASE_MAGE_Y + (poses?.mage?.dy || 0);
        mageChar.group.rotation.z = poses?.mage?.pitch || 0;

        if (poses) {
          mageChar.poseAt(poses.mage.clip, poses.mage.time);
          knightChar.poseAt(poses.knight.clip, poses.knight.time);
          skelWarrior.group.position.y = BASE_SKEL_W_Y + (poses.skelW.dy || 0);
          skelWarrior.group.rotation.z = poses.skelW.pitch || 0;
          skelWarrior.poseAt(poses.skelW.clip, poses.skelW.time);
          skelMage.group.position.y = BASE_SKEL_M_Y + (poses.skelM.dy || 0);
          skelMage.group.rotation.z = poses.skelM.pitch || 0;
          skelMage.poseAt(poses.skelM.clip, poses.skelM.time);
        } else if (def.system === 'artoriousVfx') {
          const mode = def.artoriousOptions?.mode || 'miracle';
          if (mode === 'smite') {
            const hitT = Math.max(0, timeSeconds - 0.05);
            const hop = timeSeconds >= 0.05 && timeSeconds <= 0.52
              ? Math.sin(((timeSeconds - 0.05) / 0.47) * Math.PI) * 0.14
              : 0;
            knightChar.group.position.y = kPos[1] + hop;
            knightChar.group.rotation.z = hop * 0.65;
            knightChar.poseAt(timeSeconds < 0.05 ? 'cheer' : 'hit_B', timeSeconds < 0.05 ? timeSeconds : Math.min(0.68, hitT * 1.15));
            mageChar.poseAt('cheer', timeSeconds * 0.9);
          } else {
            knightChar.group.rotation.z = 0;
            mageChar.poseAt('cast_spell', timeSeconds * 0.85);
            knightChar.poseAt('cheer', timeSeconds * 0.90);
          }
        } else {
          const hitActive = timeSeconds >= 0.58 && timeSeconds <= 1.45;
          mageChar.poseAt(timeSeconds < 0.55 ? 'cast_shoot' : 'cast_spell', timeSeconds);
          knightChar.poseAt('Idle_Combat', timeSeconds);
          const lift = hitActive ? Math.max(0, Math.sin((timeSeconds - 0.58) * 5.5) * 0.24) : 0;
          skelWarrior.group.position.y = BASE_SKEL_W_Y + lift;
          skelWarrior.group.rotation.z = hitActive ? -lift * 0.75 : 0;
          skelWarrior.poseAt(hitActive ? 'hit_A' : 'Idle_Combat', hitActive ? timeSeconds - 0.56 : timeSeconds);
          skelMage.poseAt(hitActive ? 'hit_B' : 'Idle_Combat', hitActive ? timeSeconds - 0.56 : timeSeconds);
        }

        seekActiveSystem(def, timeSeconds);
        if (def.system === 'artoriousVfx') {
          const mode = def.artoriousOptions?.mode || 'miracle';
          const mLev = mode === 'smite' ? 0 : artoriousVfx.getHeroLevitationOffset('origin');
          const kLev = mode === 'smite' ? artoriousVfx.getHeroLevitationOffset('origin') : artoriousVfx.getHeroLevitationOffset('partner');
          mageChar.group.position.y = BASE_MAGE_Y + mLev + (poses?.mage?.dy || 0);
          knightChar.group.position.y = kPos[1] + kLev + (poses ? 0 : (mode === 'smite' && timeSeconds >= 0.05 && timeSeconds <= 0.52 ? Math.sin(((timeSeconds - 0.05) / 0.47) * Math.PI) * 0.14 : 0));
          if (!poses) {
            const shk = artoriousVfx.getCameraShakeOffset();
            camera.position.set(def.pos[0] + shk.x, def.pos[1] + shk.y, def.pos[2] + shk.z);
            controls.target.set(def.target[0] + shk.x * 0.5, def.target[1] + shk.y * 0.5, def.target[2] + shk.z * 0.5);
            controls.update();
          }
        }
        scrubSlider.value = timeSeconds.toFixed(2);
        timeLabel.textContent = `t = ${timeSeconds.toFixed(2)}s`;
      }

      function setShot(shotName, { hideUI = false } = {}) {
        const def = SHOT_DEFS[shotName] || SHOT_DEFS['03-apex-crown-impact'];
        currentShotDef = def;
        playing = false;
        playBtn.classList.remove('active');
        playBtn.textContent = '▶ Play Loop';

        document.getElementById('hud').style.display = hideUI ? 'none' : 'flex';
        document.getElementById('dock').style.display = hideUI ? 'none' : 'flex';

        for (const btn of document.querySelectorAll('#dock button')) {
          btn.classList.toggle('active', btn.dataset.shot === def.id);
        }

        applyTimeOfDayMode(def.tod, def.time);

        camera.fov = def.fov || 44;
        camera.updateProjectionMatrix();
        camera.position.set(...def.pos);
        controls.target.set(...def.target);
        controls.update();

        // 0. Clear all VFX and measure Idle VFX Draw Calls (must be 0!)
        clearAllVfx();
        stageGroup.visible = false;
        actorsGroup.visible = false;
        sky.group.visible = false;
        renderer.info.autoReset = false;
        renderer.info.reset();
        renderer.render(scene, camera);
        const idleVfxDrawCalls = renderer.info.render.calls;

        // 1. Cast & Seek the Target System for this Shot
        if (def.system === 'shatterlance') {
          shatterlance.cast(CAST_ORIGIN, CAST_DIR, { range: 14.3, seed: 1.0 });
        } else if (def.system === 'cinderFall') {
          cinderFall.cast(CAST_ORIGIN, CAST_DIR, { distance: 14.0, seed: 1.0 });
        } else if (def.system === 'stormLance') {
          stormLance.cast(CAST_ORIGIN, CAST_DIR, { range: 14.3, seed: 1.0 });
        } else if (def.system === 'mageBolt') {
          mageBolt.fireComboVolley(def.boltConfig);
        } else if (def.system === 'aimArrow') {
          aimArrow.show(def.aimOptions);
        } else if (def.system === 'artoriousVfx') {
          const opts = def.artoriousOptions || {};
          if (opts.mode === 'smite') {
            artoriousVfx.triggerSmite(opts.origin);
          } else if (opts.mode === 'channel') {
            artoriousVfx.startChannel(opts.origin, opts.partnerPos);
            artoriousVfx.setSuspense(Boolean(opts.suspense));
          } else if (opts.mode === 'heal') {
            artoriousVfx.triggerHeal(opts.origin, opts.partnerPos);
          } else if (opts.mode === 'blessing') {
            artoriousVfx.triggerBlessing(opts.origin, opts.partnerPos);
          } else {
            artoriousVfx.triggerMiracle(opts.origin, opts.partnerPos, opts.enemyCenter);
          }
        } else if (def.system === 'frostLance') {
          frostLance.cast(CAST_ORIGIN, CAST_DIR, { range: 14.5, seed: 1.0 });
        }

        seekCharactersAndVfx(def.time, def.poses, def);
        scene.updateMatrixWorld(true);

        // 2. Measure Active VFX Draw Calls, Triangles & Update+Render Frame Time
        stageGroup.visible = false;
        sky.group.visible = false;
        if (def.system === 'swordVfx') {
          actorsGroup.visible = true;
          mageChar.group.visible = false;
          skelWarrior.group.visible = false;
          skelMage.group.visible = false;
          if (knightChar.toonStats?.skinMesh) knightChar.toonStats.skinMesh.visible = false;
          if (knightChar.toonStats?.outlineMesh) knightChar.toonStats.outlineMesh.visible = false;
        } else {
          actorsGroup.visible = false;
        }

        // Warm-up render ensures one-time WebGL shader compilation is excluded from steady-state frame timing
        renderer.render(scene, camera);
        renderer.info.reset();
        const t0 = performance.now();
        for (let iter = 0; iter < 20; iter++) {
          if (def.system === 'swordVfx') {
            swordVfx._evaluateState(def.time);
          } else {
            seekActiveSystem(def, def.time);
          }
        }
        renderer.render(scene, camera);
        const t1 = performance.now();
        const vfxFrameMs = Number(((t1 - t0) / 20).toFixed(3));
        const vfxDrawCalls = renderer.info.render.calls;
        const vfxTriangles = renderer.info.render.triangles;
        renderer.info.autoReset = true;

        // Restore all character & stage visibility and render full frame with Post-Processing
        mageChar.group.visible = true;
        skelWarrior.group.visible = true;
        skelMage.group.visible = true;
        if (knightChar.toonStats?.skinMesh) knightChar.toonStats.skinMesh.visible = true;
        if (knightChar.toonStats?.outlineMesh) knightChar.toonStats.outlineMesh.visible = true;
        stageGroup.visible = true;
        actorsGroup.visible = true;
        sky.group.visible = true;
        post.render(0.016);

        const activeSys = allSystems[def.system] || frostLance;
        const vfxStats = activeSys.getStats();
        titleEl.textContent = def.label;
        statsEl.textContent = `System: ${def.system} | VFX Draws: ${vfxDrawCalls}/6 (Idle: ${idleVfxDrawCalls}) | VFX Tris: ${vfxTriangles.toLocaleString()} | VFX Frame: ${vfxFrameMs} ms`;

        return {
          shot: def.id,
          system: def.system,
          tod: def.tod,
          timeSeconds: def.time,
          idleVfxDrawCalls,
          vfxDrawCalls,
          vfxTriangles,
          vfxFrameMs,
          ...vfxStats,
        };
      }

      for (const btn of document.querySelectorAll('#dock button')) {
        btn.addEventListener('click', () => setShot(btn.dataset.shot));
      }

      playBtn.addEventListener('click', () => {
        playing = !playing;
        playBtn.classList.toggle('active', playing);
        playBtn.textContent = playing ? '⏸ Pause' : '▶ Play Loop';
      });

      scrubSlider.addEventListener('input', (e) => {
        playing = false;
        playBtn.classList.remove('active');
        playBtn.textContent = '▶ Play Loop';
        const t = parseFloat(e.target.value);
        seekCharactersAndVfx(t, null, currentShotDef);
        post.render(0.016);
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        post.setSize(window.innerWidth, window.innerHeight);
      });

      const initialStats = setShot('03-apex-crown-impact');
      const clock = new THREE.Clock();

      renderer.setAnimationLoop(() => {
        const dt = Math.min(clock.getDelta(), 0.05);
        controls.update();
        if (playing) {
          const activeSys = allSystems[currentShotDef.system] || frostLance;
          let nextT = (activeSys.age || 0) + dt;
          if (nextT > 3.8) nextT = 0.04;
          seekCharactersAndVfx(nextT, null, currentShotDef);
        }
        post.render(dt);
      });

      window.__vfxPreview = {
        setShot,
        clearAllVfx,
        frostLance,
        shatterlance,
        cinderFall,
        stormLance,
        swordVfx,
        mageBolt,
        artoriousVfx,
        aimArrow,
        knightChar,
        mageChar,
        scene,
        camera,
        renderer,
        post,
        initialStats,
      };
      window.__ready = true;
    </script>
